/**
 * UNE DATE QUI N'EST PAS ENCORE ARRÊTÉE.
 *
 * Les arrêtés servis à côté de la page sont ceux qu'on a construits d'avance.
 * Pour toute autre date, la page ne bricole rien : elle enregistre la demande,
 * et la relève planifiée la construit — même chaîne, mêmes contrôles. Mieux
 * vaut attendre une balance juste qu'obtenir tout de suite une balance qui
 * ressemble à celle qu'on voulait.
 */
/**
 * UNE DATE QUI N'EST PAS ENCORE ARRÊTÉE.
 *
 * « je veux pas qu'il y ait besoin d'une relève pour voir, je veux que dès que
 *   je met une date cela actualise l'ecran », 27/10/2026.
 *
 * La demande différée est retirée. Tant que la page ne sait pas refaire
 * l'imputation des règlements à une date — et elle ne le saura pas sans
 * emporter le moteur entier — elle dit ce qu'elle a et ce qu'elle n'a pas,
 * sans promettre un délai.
 */
// DEMANDER UNE DATE QU'ON N'A PAS, C'EST LA FAIRE CONSTRUIRE, 12/11/2026.
//
// « normalement lorsque l'on met une date je suis censé avant tt la balance
// agé qui s'actualise ». La page se contentait d'annoncer que la date n'était
// pas arrêtée et de lister les autres : la demande différée avait été retirée
// et rien ne l'avait remplacée. Elle est rétablie ici dans la forme que le
// relevé lit déjà — collection « demandes », document « arrete », la date en
// AAAA-MM-JJ dans le champ « date ».
const ARRETE_MINI='2025-07-01';
const jjmmaaaa=d=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d||'')); 
  return m ? m[3]+'/'+m[2]+'/'+m[1] : String(d||''); };
async function demanderArrete(date){
  const e=E('arrete-note'), dire=t=>{ if(e) e.textContent=t; };
  const dispo=Object.keys(ARRETES).sort().reverse().map(d=>ARRETES[d].a);
  // L'export part du 01/07/2025 : avant, tout arrive en report à nouveau et
  // aucun arrêté ne se justifierait devant un commissaire aux comptes.
  if(date<ARRETE_MINI){
    dire('Le '+jjmmaaaa(date)+' n’est pas calculable : le grand livre part du 01/07/2025.');
    return;
  }
  if(!DB||!admin){
    dire('Le '+jjmmaaaa(date)+' n’est pas arrêté. Disponibles : '+(dispo.join(', ')||'aucun')+'.');
    return;
  }
  dire('Demande en cours d’enregistrement…');
  const v={date:date, quand:leJour(), quandISO:new Date().toISOString(),
           motif:'arrêté au '+date, etat:'en attente'};
  try{
    await DB.collection('demandes').doc('arrete').set(v);
    const envoi=await prevenir(v,
      'Construire la balance âgée arrêtée au '+date+' — demande du '+v.quand+'.\n'
      +'Construire l’arrêté à cette date, le contrôler, et republier la page '
      +'avec ce nouvel arrêté dans le choix de dates si tout est vert.');
    dire(envoi==='transmise'
      ? 'Le '+jjmmaaaa(date)+' va être construit · la balance sera republiée avec cette date.'
      : envoi==='consentement'
        ? 'Demande enregistrée · autorisez l’envoi à Claude pour qu’elle parte tout de suite.'
        : 'Demande enregistrée · elle sera reprise au prochain relevé.');
  }catch(err){
    dire('La demande n’a pas pu être enregistrée.');
  }
}

async function prevenir(v,texte){
  if(!COMM||!COMM.sendToClaude||!COMM.canSendToClaude) return '';
  let etat='';
  try{ etat=await COMM.canSendToClaude(); }catch(e){ return ''; }
  if(etat!=='available') return '';
  const bloc=E('depot-bloc')||document.body;
  try{
    const ancre=await COMM.anchorFor(bloc);
    await COMM.sendToClaude({anchor:ancre, text: texte ||
      ('Actualiser la balance âgée — demande du '+v.quand+', motif : '+v.motif+'.\n'
      +'Reprendre les fichiers déposés et les réglages, reconstruire, repasser '
      +'les contrôles, et republier la page avec ses données si tout est vert.')});
    return 'transmise';
  }catch(e){ return (e&&e.code==='consent_required')?'consentement':''; }
}

// La jauge se pose sur un pourcentage, pas sur un numéro d'étape : chaque
// étape occupe un tiers de la bande et avance à l'intérieur de son tiers au
// fur et à mesure de ce qui est réellement fait.
function poserBande(id,etape,part,detail,nom){
  const b=E(id+'-bande'); if(!b) return;
  const t=100/ETAPES.length;
  const pc=Math.min(100,Math.round((etape-1)*t+Math.max(0,Math.min(1,part))*t));
  b.hidden=false;
  b.classList.toggle('fini',pc>=100);
  b.querySelector('.actu-jauge').style.width=pc+'%';
  // Le nom de l'étape peut être repris : « Balance reconstruite » est vrai à
  // l'arrivée, pas pendant le calcul.
  b.querySelector('.actu-dit').textContent=pc+' % · étape '+etape+'/'+ETAPES.length
    +' · '+(nom||ETAPES[etape-1])+(detail?' '+detail:'');
}

// Une pause qui laisse le navigateur peindre : sans elle, la jauge saute
// d'un bout à l'autre sans qu'aucun état intermédiaire ne soit affiché.
const peindre=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

// ÉTAPE 1, SOUS-TÂCHE PAR SOUS-TÂCHE.
//
// Les poids sont les durées mesurées sur ce jeu de données : l'assiette de
// provision 10 ms, le tableau des taux 17 ms, les tableaux de règles 1 ms, la
// balance et le détail 42 ms. La jauge avance de la part réellement faite.
const TACHES=[
  ['paramètres',             1,  ()=>{ paramsPrets(); ASSIETTE=null; }],
  ['assiette de provision', 10,  ()=>{ assiettes(); }],
  ['taux de provision',     17,  ()=>{ tableProvision(); }],
  ['règles',                 1,  ()=>{ tableClassement(); tableEcheance(); }],
  ['balance et détail',     42,  ()=>{ rafraichir(); }],
];

async function refaireAffichage(id){
  const total=TACHES.reduce((a,t)=>a+t[1],0);
  let fait=0;
  const t0=performance.now();
  for(const [nom,poids,faire] of TACHES){
    poserBande(id,1,fait/total,'· '+nom+'…');
    await peindre();
    faire();
    fait+=poids;
  }
  poserBande(id,1,1,'en '+Math.max(1,Math.round(performance.now()-t0))+' ms');
  await peindre();
}

// ÉTAPE 3 — LA RECONSTRUCTION, QUI SE PASSE HORS DE LA PAGE.
//
// La page ne voit pas le calcul ; elle voit le document de demande. Tant qu'il
// est « en attente », la jauge reste au seuil de l'étape. Dès qu'il passe « en
// cours », elle avance en continu, du temps écoulé depuis le début rapporté à
// la durée RÉELLEMENT MESURÉE de la reconstruction précédente — c'est une
// estimation, elle est annoncée comme telle, et elle plafonne à 99 % : seule
// la republication de la balance la porte à 100 %.
let SUIVI=null;
function suivreReconstruction(){
  if(SUIVI){ clearInterval(SUIVI); SUIVI=null; }
  const ids=['ech-actu','prov-actu','depot-actu'];
  const dessiner=()=>{
    if(!DEMANDE||!DEMANDE.quand) return false;
    if(reconstruiteDepuis()){
      for(const id of ids) poserBande(id,3,1,'le '+(D.genere||'?'));
      return false;
    }
    // UNE DEMANDE CLOSE NE LAISSE PAS LA JAUGE TOURNER, 12/11/2026.
    //
    // « l'actualisation est encore sur 99 % ». Les seuls états prévus étaient
    // « en attente » et « en cours » : « échec » retombait sur le dernier cas
    // et plantait la bande, « servie » attendait que la page soit rebâtie —
    // ce qui n'arrive jamais quand la reconstruction n'a rien publié.
    if(DEMANDE.etat==='échec'){
      for(const id of ids) poserBande(id,3,0,'','Reconstruction interrompue');
      return false;
    }
    if(DEMANDE.etat==='servie'){
      for(const id of ids) poserBande(id,3,1,'le '+(D.genere||'?'));
      return false;
    }
    if(DEMANDE.etat==='en cours' && DEMANDE.debutISO){
      const duree=Number(D.dureeMs)>0?Number(D.dureeMs):120000;
      const passe=Date.now()-Date.parse(DEMANDE.debutISO);
      const part=Math.max(0,Math.min(0.97,passe/duree));
      const dit=passe>duree ? '· plus longue que la précédente'
        : '· '+Math.round(passe/1000)+' s sur '+Math.round(duree/1000)+' s estimées';
      for(const id of ids) poserBande(id,3,part,dit,'Reconstruction en cours');
      return true;
    }
    for(const id of ids) poserBande(id,2,1,'le '+DEMANDE.quand+' · en attente');
    return true;
  };
  if(!dessiner()) return;
  // On ne relit le document que tant qu'une demande est en cours, et pas
  // au-delà d'un quart d'heure : une page laissée ouverte ne doit pas
  // interroger la base indéfiniment.
  const fin=Date.now()+15*60*1000;
  SUIVI=setInterval(async()=>{
    if(Date.now()>fin){ clearInterval(SUIVI); SUIVI=null; return; }
    if(DB){ try{
      const q=await DB.collection('demandes').get();
      q.docs.forEach(doc=>{ if(doc.id==='reconstruction') DEMANDE=doc.data()||DEMANDE; });
    }catch(e){} }
    if(!dessiner()){ clearInterval(SUIVI); SUIVI=null; }
  },4000);
}

// La reconstruction est faite quand la page a été rebâtie APRÈS la demande.
function reconstruiteDepuis(){
  if(!DEMANDE||!DEMANDE.quand) return true;
  // À l'horodatage quand les deux en portent un : une reconstruction du jour
  // même doit compter.
  if(D.genereISO && DEMANDE.quandISO) return D.genereISO>DEMANDE.quandISO;
  const n=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s||'').trim());
    return m?(+m[3]*10000+ +m[2]*100+ +m[1]):0;};
  return n(D.genere)>n(DEMANDE.quand);
}

function direRecons(){
  const e=E('depot-recons'); if(!e) return;
  const faite='Dernière reconstruction : '+(D.genere||'?')+' · arrêté au '+(D.arrete||'?')+'.';
  if(!DEMANDE||!DEMANDE.quand){ e.textContent=faite; return; }
  // Un échec se dit, et il se dit avec son motif : la bande seule ne porte
  // qu'un libellé, et une demande qui s'arrête sans raison visible se relance
  // indéfiniment.
  if(DEMANDE.etat==='échec'){
    e.textContent=faite+' Actualisation demandée le '+DEMANDE.quand
      +' · interrompue. '+(DEMANDE.motif||'');
    return;
  }
  if(DEMANDE.etat==='servie'){ e.textContent=faite; return; }
  e.textContent=faite+' Actualisation demandée le '+DEMANDE.quand
    +', en attente de reconstruction.';
}

async function demanderActualisation(motif,etatId,bandeId){
  const dire=t=>{ const e=E(etatId); if(e) e.textContent=t; };
  dire('');
  // ÉTAPE 1 — ce qui se calcule dans la page se recalcule maintenant.
  await refaireAffichage(bandeId);
  if(!DB||!admin){ dire('Affichage actualisé.'); return; }
  // ÉTAPE 2 — la demande, horodatée et motivée.
  poserBande(bandeId,2,0,'…');
  const v={quand:leJour(), quandISO:new Date().toISOString(), motif:motif, etat:'en attente'};
  try{
    await DB.collection('demandes').doc('reconstruction').set(v);
    DEMANDE=v; direRecons();
    poserBande(bandeId,2,0.5,'· transmission…');
    const envoi=await prevenir(v);
    if(envoi==='transmise'){
      poserBande(bandeId,2,1,'le '+v.quand+' · reconstruction lancée');
      // La bande, elle, continue de dire ce que le document dit : « en
      // attente » tant que la reconstruction n'a pas commencé pour de bon.
      dire('Demande transmise · la reconstruction va démarrer.');
    }else if(envoi==='consentement'){
      poserBande(bandeId,2,1,'le '+v.quand+' · en attente');
      dire('Demande enregistrée · autorisez l’envoi à Claude pour qu’elle parte tout de suite.');
    }else{
      poserBande(bandeId,2,1,'le '+v.quand+' · en attente');
      dire('Demande enregistrée · elle sera reprise au prochain relevé.');
    }
    suivreReconstruction();
  }catch(e){
    dire('La demande n’a pas pu être enregistrée.');
  }
}

function brancherActualiser(){
  const paires=[['ech-actu','les règles d’échéance','ech-etat'],
                ['prov-actu','les règles de provision','prov-etat'],
                ['depot-actu','les fichiers déposés','depot-etat']];
  for(const [id,motif,etat] of paires){
    const b=E(id); if(!b) continue;
    if(admin) b.hidden=false;
    b.addEventListener('click',()=>demanderActualisation(motif,etat,id));
  }
  // À l'ouverture, la bande dit où en est la dernière demande, et se met à la
  // suivre si elle n'est pas encore servie.
  suivreReconstruction();
  direRecons();
}

async function ouvrirBase(){
  DISPOS=[...new Set(I.map(i=>V(i,'Type de financement'))
    .filter(c=>c&&c!=='À classer'))].sort();
  E('lot-disp').innerHTML='<option value="">Choisir…</option>'
    +DISPOS.map(d=>'<option>'+d+'</option>').join('');
  try{
    if(window.claude&&claude.use){
      DB=await claude.use('db');
      await ouvrirCommentaires();
      const u=await claude.use('user');
      // Deux rôles, et un seul critère : qui peut modifier l'artefact est
      // administrateur. Sa règle, le 16/10/2026 : « tout le monde ne peut pas
      // compléter la balance âgée ». Un lecteur consulte, filtre et exporte ;
      // il ne voit ni les cases à cocher, ni les boutons de modification.
      // La base refuse l'écriture de son côté : l'affichage n'est qu'une
      // politesse, la règle est côté serveur.
      if(u){
        try{ admin = !!(u.canEdit ? await u.canEdit() : (u.isOwner && await u.isOwner())); }
        catch(e){ admin=false; }
      } else { admin=false; }
      peutEcrire=admin;
    } else {
      // Le fichier autonome n'est pas publié : il n'a ni base ni identité.
      // C'est SA copie, posée sur son disque — elle y est chez elle.
      admin=true; peutEcrire=true;
    }
  }catch(e){ DB=null; }
  try{
    if(DB){
      const q=await DB.collection('complements').get();
      q.docs.forEach(doc=>{ const v=doc.data()||{};
        if(v&&v.cle&&v.dispositif) compl.set(v.cle,{...v,dispositif:dispoActuel(v.dispositif)}); });
      try{ const dq=await DB.collection('demandes').get();
        dq.docs.forEach(doc=>{
          if(doc.id==='reconstruction') DEMANDE=doc.data()||null;
          // Une demande d'arrêté laissée en plan se reprend au chargement :
          // elle a toutes les chances d'avoir été demandée depuis cette page,
          // puis rechargée pour voir où elle en est.
        });
      }catch(e){}
      const pq=await DB.collection('parametres').get();
      pq.docs.forEach(doc=>{ const v=doc.data()||{};
        if(doc.id==='provision'&&v.taux){ paramsPrets(); PROV={...PROV,...v}; }
        if(doc.id==='echeance'&&Array.isArray(v.regles)) ECH=v.regles; });
    } else {
      const brut=localStorage.getItem('rec_complements');
      if(brut) for(const v of JSON.parse(brut)) if(v&&v.cle)
        compl.set(v.cle,{...v,dispositif:dispoActuel(v.dispositif)});
      const pv=localStorage.getItem('rec_provision');
      if(pv){ paramsPrets(); PROV={...PROV,...JSON.parse(pv)}; }
      const ec=localStorage.getItem('rec_echeance');
      if(ec) ECH=JSON.parse(ec);
    }
  }catch(e){}
  parametres();
  brancherActualiser();
  ruban();
  if(compl.size) rafraichir();
  // Le dépôt vient après : il a besoin de savoir qui regarde (DB, admin).
  if(window.claude&&claude.use) ouvrirDepots();
}

function rafraichir(){
  ASSIETTE=null;                    // un complément peut changer la famille
  const y=E('viewport').scrollTop;
  ruban(); synthese(); appliquer(true);
  E('viewport').scrollTop=y;
  if(sel>=0) fiche(sel);
}

const cochable=i=>!!V(i,'Type de financement : à compléter') && !compl.has(cleLigne(i)) && peutEcrire;

// La barre de lot : elle dit ce qui est coché et ne s'affiche pas sans objet.
function barre(){
  const n=selection.size;
  E('lot').hidden=!n;
  if(n) E('lot-n').textContent=n.toLocaleString('fr-FR')+(n>1?' lignes sélectionnées':' ligne sélectionnée');
  E('lot-ok').disabled=!n||!E('lot-disp').value;
  const ct=E('coche-tout');
  if(ct){ const dispo=[...new Set(filtre)].filter(cochable);
    ct.hidden=!dispo.length;
    ct.checked=dispo.length>0&&dispo.every(i=>selection.has(i)); }
}

// Poser un complément sans redessiner : le lot en pose plusieurs à la suite,
// et une balance qui se recalcule entre chaque écriture clignoterait pour rien.
async function poser(v){
  compl.set(v.cle,v);
  try{
    if(DB) await DB.collection('complements').doc(idDoc(v.cle)).set(v);
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ compl.delete(v.cle); return false; }
  return true;
}

// Un dispositif, posé sur tout le lot. Plusieurs lignes peuvent appartenir à
// la même créance : on ne l'écrit qu'une fois.
async function completerLot(){
  const disp=E('lot-disp').value; if(!disp||!selection.size) return;
  const bt=E('lot-ok'), note=E('lot-note');
  bt.disabled=true;
  const parCreance=new Map();
  for(const i of selection){
    const k=cleLigne(i);
    if(!parCreance.has(k)) parCreance.set(k,{cle:k, dispositif:disp,
      compte:V(i,'N° de compte'), tiers:V(i,'Tiers'), facture:V(i,'N° de facture')||'',
      manquait:V(i,'Type de financement : à compléter'), quand:leJour()});
  }
  let faits=0, refus=0, n=0;
  for(const v of parCreance.values()){
    note.textContent='enregistrement '+(++n)+' / '+parCreance.size+'…';
    if(await poser(v)) faits++; else refus++;
  }
  selection.clear();
  note.textContent=faits.toLocaleString('fr-FR')+(faits>1?' créances complétées':' créance complétée')
    +' en « '+disp+' »'+(refus?' · '+refus+' refusée'+(refus>1?'s':''):'');
  rafraichir(); barre();
  bt.disabled=false;
}

async function enregistrer(v){
  compl.set(v.cle,v);
  let ok=true;
  try{
    if(DB) await DB.collection('complements').doc(idDoc(v.cle)).set(v);
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ ok=false; compl.delete(v.cle); }
  rafraichir();
  return ok;
}

async function effacer(cle){
  const v=compl.get(cle); if(!v) return;
  compl.delete(cle);
  try{
    if(DB) await DB.collection('complements').doc(idDoc(cle)).delete();
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ compl.set(cle,v); }
  rafraichir();
}

// L'index des rapprochements : chaque numéro, ses lignes au débit — la ou les
// factures proposées — et sa ligne au crédit, le règlement.
let rapIdx=null;
function indexRappro(){
  if(rapIdx) return rapIdx;
  rapIdx=new Map();
  for(const i of I){
    const s=V(i,'N° de rapprochement'); if(!s) continue;
    const ou=N(i,'Débit')>0.009?'deb':'cre';
    for(const n of s.split('·')){ const k=n.trim(); if(!k) continue;
      let e=rapIdx.get(k); if(!e){ e={deb:[],cre:[]}; rapIdx.set(k,e); }
      e[ou].push(i); }
  }
  return rapIdx;
}

function fiche(i){
  const g=n=>V(i,n), k=cleLigne(i), c=compl.get(k), ac=g('Type de financement : à compléter')&&!c;
  const cal=g('Détail du calcul'), m=metaCreance.get(g('Clé de la créance'));
  // « Je veux une séparation nette entre 2 propositions de rapprochement »,
  // 22/10/2026. Une par ligne ne suffisait pas : deux lignes qui se touchent
  // se lisent comme une phrase qui revient à la ligne. Chacune prend donc son
  // bloc, adossé à un trait.
  const enLignes=t=>{
    const bouts=esc(t).split('\n').map(x=>x.replace(/^•\s*/,'').trim()).filter(Boolean);
    return bouts.length<2 ? bouts.join('')
      : '<ul class="props">'+bouts.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  };
  let h='<div class="fiche-tete"><span class="ref">'+(g('N° de facture')||'écriture sans numéro')+'</span>'
    +'<span>'+g('Tiers')+'</span>'
    +'<span class="puce'+(ac?' sig':' ok')+'">'
    +(c?'complété':(ac||'justifiée'))+'</span></div>';
  // Ce qu'il manque se complète ici même : le dispositif choisi déplace
  // aussitôt le reste dû de la créance dans la balance, et il est gardé.
  if(ac||c){
    h+='<div class="compl'+(c?' fait':'')+'">';
    if(c){
      h+='<span class="etat"><strong>'+c.dispositif+'</strong> — complété le '+c.quand
        +(m&&m.rd?' · '+eur(m.rd)+' déplacés de « '+(m.sc||'À classer')+' » vers « '+c.dispositif+' »':'')
        +'</span><button type="button" class="plat" id="c-annul">Revenir en arrière</button>';
    } else if(peutEcrire){
      h+='<label for="c-disp">Type de financement</label>'
        +'<select id="c-disp"><option value="">Choisir…</option>'
        +DISPOS.map(d=>'<option>'+d+'</option>').join('')+'</select>'
        +'<button type="button" id="c-ok" disabled>Enregistrer</button>'
        +'<span class="etat" id="c-note">'
        +(m&&m.rd?eur(m.rd)+' quitteront « '+(m.sc||'À classer')+' »'
                :'cette écriture ne pèse rien dans la balance : seul son classement change')
        +'</span>';
    } else {
      h+='<span class="etat">Lecture seule : les compléments ne peuvent pas être enregistrés depuis cette vue.</span>';
    }
    h+='</div>';
  }
  if(cal) h+='<p class="calcul">'+cal
    +(g('Règle de datation appliquée')?'<br><span style="color:var(--encre-2)">motif : '+g('Règle de datation appliquée')+'</span>':'')
    +'</p>';
  h+='<div class="champs">';
  for(const nom of D.cols){
    const v=g(nom); if(!v) continue;
    // Tout ce qui parle de rapprochement se lit une proposition par ligne :
    // la facture, sa fiabilité et sa raison, des deux côtés du couple.
    h+='<div class="champ"><dt>'+nom+'</dt><dd>'
      +(/rapprochement$/.test(nom)?enLignes(v)
       :nom==='Lien Pennylane'
         ?'<a class="lien-fact" href="'+esc(v)+'" target="_blank" rel="noopener">ouvrir dans Pennylane</a>'
       :v)+'</dd></div>';
  }
  E('fiche').innerHTML=h+'</div>';
  const sl=E('c-disp'), bt=E('c-ok');
  if(sl&&bt){
    sl.addEventListener('change',()=>{ bt.disabled=!sl.value; });
    bt.addEventListener('click',async()=>{
      if(!sl.value) return; bt.disabled=true;
      const ok=await enregistrer({cle:k, dispositif:sl.value, compte:g('N° de compte'),
        tiers:g('Tiers'), facture:g('N° de facture')||'', manquait:g('Type de financement : à compléter'),
        quand:leJour()});
      if(!ok){ const n=E('c-note');
        if(n) n.textContent='Enregistrement refusé — rien n’a été gardé.';
        bt.disabled=false; }
    });
  }
  const an=E('c-annul'); if(an) an.addEventListener('click',()=>effacer(k));
  E('fiche').scrollIntoView({behavior:'smooth',block:'nearest'});
}
// ═══════════ la section « Paramètres » ═══════════
//
// Elle montre les deux jeux de règles à tout le monde, et ne les ouvre à la
// modification que pour l'administratrice. Un lecteur voit exactement les
// mêmes chiffres : ce qui fait la balance ne se cache pas.
let modifProv=false, modifEch=false;
const pc=v=>(v*100).toLocaleString('fr-FR',{maximumFractionDigits:1})+' %';

function parametres(){
  paramsPrets();
  const qui=E('param-qui'); if(!qui) return;
  qui.textContent=admin
    ? 'Vous êtes administratrice : vous pouvez compléter la balance et modifier ces règles.'
    : 'Lecture seule : vous pouvez consulter, filtrer et exporter. Les règles et les '
      +'compléments sont tenus par le responsable recouvrement.';
  for(const id of ['prov-modif','ech-modif']){ const b=E(id); if(b) b.hidden=!admin; }
  methodeProvision();
  tableProvision(); tableClassement(); tableEcheance();
}

// ───── comment la provision se calcule, selon la doctrine ─────
//
// Sa question du 02/11/2026 : « les règles ds balance agé liora st les mm que
// celle ds la balance agé client, comment cela se fait ? pourtant ce ne sont
// pas du tt les mm regles pour les provisions ». L'exposé de la méthode était
// écrit une fois pour toutes dans le gabarit : les deux pages affichaient donc
// la même, celle de l'imputation en cinq temps, alors que cette balance-ci ne
// fait aucune imputation — « ds le fichier on clôture par aging les montant
// créditeur quoi qu'il arrive sans regarder le type de client ».
//
// Les deux exposés vivent maintenant dans le gabarit, et celui qui n'a pas
// servi est RETIRÉ DU DOCUMENT, pas seulement masqué : un bloc caché reste
// dans l'impression, dans une recherche de page et dans ce qu'un lecteur
// trouve en lisant la source. Une page ne doit porter que les règles qui ont
// produit ses chiffres.
function methodeProvision(){
  const garde=CAC()?'prov-methode-cac':'prov-methode';
  const jette=CAC()?'prov-methode':'prov-methode-cac';
  const g=E(garde); if(g) g.hidden=false;
  const j=E(jette); if(j) j.remove();
}

// ───── le barème de provision ─────
function tableProvision(){
  paramsPrets();
  const fen=PROV.fenetres||[], taux=PROV.taux||{}, fams=Object.keys(taux);
  let h='<table><thead><tr><th>Type de client</th>'
    +fen.map(f=>'<th class="n">'+esc(f.label)+'</th>').join('')
    +'<th class="n">À provisionner</th></tr></thead><tbody>';
  const pv=provisions();
  for(const f of fams){
    h+='<tr><td class="fam">'+esc(f)+'</td>'
      +(taux[f]||[]).map((t,j)=>'<td class="n">'+(modifProv
        ? '<input data-fam="'+esc(f)+'" data-j="'+j+'" value="'+(t*100)+'">'
        : pc(t))+'</td>').join('')
      +'<td class="n">'+eur(pv.parFam.get(f)||0)+'</td></tr>';
  }
  h+='<tr><td class="fam">TOTAL</td>'+fen.map(()=>'<td></td>').join('')
    +'<td class="n">'+eur(pv.total)+'</td></tr></tbody></table>';
  E('prov-taux').innerHTML=h;
  const sr=E('prov-reste');
  if(sr){ const r=creditSansEmploi();
    sr.textContent=r>0.005
      ?(eur(r)+' sur le type de financement '+creditSansEmploiDit()):'aucun'; }

  // Le rattachement : un type de financement par ligne, son type de client en
  // face. Il se lit dans ce sens-là parce que c'est la question qu'on se pose —
  // « ce type de financement, je le provisionne comment ? » — et parce qu'ainsi
  // aucun d'eux ne peut être oublié en silence.
  const tous=[...new Set(I.map(i=>sousVraie(i)).filter(Boolean))].sort();
  let g='<table><thead><tr><th>Type de financement</th><th>Type de client</th>'
    +'<th class="n">Reste dû</th><th class="n">À provisionner</th></tr></thead><tbody>';
  const rd=new Map(), vues=new Set();
  for(const i of I){ const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const sc=sousVraie(i); rd.set(sc,(rd.get(sc)||0)+N(i,'Reste dû de la créance')); }
  for(const sc of tous){
    const f=familleDe(sc);
    g+='<tr><td>'+esc(sc)+'</td><td>'+(modifProv
      ? '<select data-sc="'+esc(sc)+'">'
        +['(aucune)'].concat(Object.keys(taux)).map(x=>'<option'
          +((x==='(aucune)'?null:x)===f?' selected':'')+'>'+esc(x)+'</option>').join('')
        +'</select>'
      : (f?'<span class="fam">'+esc(f)+'</span>'
          :(EXCLU(sc)
            ?'<span style="color:var(--encre-3)">exclu du barème</span>'
            :'<span style="color:var(--alerte)">à rattacher</span>')))
      +'</td><td class="n">'+eur(rd.get(sc)||0)+'</td>'
      +'<td class="n">'+eur(pv.parSc.get(sc)||0)+'</td></tr>';
  }
  g+='</tbody></table>';
  // L'EXCLUSION SE LIT SUR LA DOCTRINE, PAS SUR LE SOLDE DU JOUR. Un type
  // exclu dont le reste dû est nul à cet arrêté n'apparaît pas dans
  // pv.horsFamille : la note en aurait oublié la moitié alors que le tableau,
  // lui, les montre tous les deux.
  const typesVus=new Set(tous);
  const horsExclus=(PROV.exclus||[]).filter(x=>typesVus.has(x));
  const horsOublis=[...pv.horsFamille.keys()].filter(x=>!EXCLU(x));
  if(horsExclus.length) g+='<p class="param-note">'
    +horsExclus.map(esc).join(' · ')+' : exclu'+(horsExclus.length>1?'s':'')
    +' du barème par la doctrine. Leur reste dû n’est pas provisionné, à son '
    +'débit comme à son crédit.</p>';
  if(horsOublis.length) g+='<p class="param-avertir">'
    +horsOublis.length+' type'+(horsOublis.length>1?'s':'')+' de financement '
    +(horsOublis.length>1?'ne sont rattachés':"n'est rattaché")
    +' à aucun type de client du barème : '+horsOublis.map(esc).join(' · ')
    +'. Leur reste dû n’est pas provisionné.</p>';
  if(!PROV.confirme) g+='<p class="param-avertir">Ce rattachement est une proposition : '
    +'il n’a pas encore été confirmé. Modifiez-le ici, et il le sera.</p>';
  E('prov-familles').innerHTML=g;
  const act=E('prov-actions'); if(act) act.hidden=!modifProv;
  const b=E('prov-modif'); if(b) b.textContent=modifProv?'Fermer':'Modifier';
}

// Le décompte par règle N'EST PLUS FAIT ICI.
//
// Il l'était, par expressions régulières sur le texte français du motif, et il
// mentait : « Encaissement · daté à la dernière date de son libellé » contient
// le mot « libellé », donc 2 782 encaissements étaient comptés comme un repli
// de libellé, et 212 autres comme du barème. La construction le fait
// maintenant sur les champs du moteur — voir rangDeLaLigne() dans
// construire.js — et le pose sur chaque règle, en « n ». Un seul décompte, le
// même dans le classeur et dans la page.

// ───── les règles de classement ─────
//
// « Ajoute dans les paramètres les règles de classement. » Elles n'étaient
// écrites nulle part : la page montrait comment une échéance se calcule, et
// pas comment un type de financement se décide. Le décompte en face de chaque
// règle vient de la colonne « Origine du classement », donc du travail
// réellement fait, et non d'une estimation.
function tableClassement(){
  const L=D.classement||[];
  if(!L.length){ E('cla-ordre').innerHTML=''; return; }
  const n=x=>Number(x||0).toLocaleString('fr-FR');
  E('cla-ordre').innerHTML='<table><thead><tr><th>Rang</th><th>Règle</th>'
    +'<th>Condition d’application</th><th class="n">Écritures</th></tr></thead><tbody>'
    +L.map(r=>'<tr><td class="fam">'+esc(r.rang)+'</td>'
      +'<td class="fam">'+esc(r.quoi)+'</td><td>'+esc(r.quand)
      +(r.note?'<br><span style="color:var(--encre-2)">'+esc(r.note)+'</span>':'')
      +'</td><td class="n">'+n(r.n)+'</td></tr>').join('')
    +'<tr class="total"><td></td><td></td><td>TOTAL</td><td class="n">'
    +n(L.reduce((a,r)=>a+(r.n||0),0))+'</td></tr></tbody></table>';
}

// ───── les règles d'échéance ─────
function tableEcheance(){
  paramsPrets();
  const ORD=D.ordreEcheance||[];
  const nb=x=>Number(x||0).toLocaleString('fr-FR');
  let o='<table><thead><tr><th>Rang</th><th>Nature</th><th>Quand</th><th>Alors</th>'
    +'<th class="n">Écritures</th></tr></thead><tbody>'
    +((D.ordreEcheance||[]).map(r=>'<tr><td class="fam">'+esc(r.rang)+'</td>'
      +'<td class="fam">'+esc(r.nature||'')+'</td><td>'
      +esc(r.quand)+'</td><td>'+esc(r.alors)
      +(r.note?'<br><span style="color:var(--encre-2)">'+esc(r.note)+'</span>':'')
      +'</td><td class="n">'+nb(r.n)+'</td></tr>').join(''))
    +'<tr class="total"><td></td><td></td><td></td><td>TOTAL</td><td class="n">'
    +nb(ORD.reduce((a,r)=>a+(r.n||0),0))
    +'</td></tr></tbody></table>';
  E('ech-ordre').innerHTML=o;

  let h='<table><thead><tr><th>Type de financement</th><th>Type de client</th>'
    +'<th>Base de l’échéance</th><th class="n">Délai (jours)</th><th>Repli</th>'
    +'</tr></thead><tbody>';
  ECH.forEach((r,k)=>{
    h+='<tr><td class="fam">'+esc(r.dispositif)+'</td><td>'+esc(r.type)+'</td>'
      +'<td>'+(modifEch?'<input class="large" data-ech="'+k+'" data-champ="base" value="'
        +esc(r.base)+'">':esc(r.base))+'</td>'
      +'<td class="n">'+(modifEch?'<input data-ech="'+k+'" data-champ="jours" value="'
        +esc(r.jours)+'">':esc(r.jours))+'</td>'
      +'<td>'+esc(r.repli||'—')+'</td></tr>';
  });
  E('ech-bareme').innerHTML=h+'</tbody></table>'
    +'<p class="param-avertir">Une base ou un délai modifié ici est enregistré et servira '
    +'à la prochaine balance. Les dates déjà calculées ne bougent pas dans cette page : '
    +'elles portent chacune leur justification, et les recalculer sans la refaire '
    +'rendrait la balance inauditable.</p>';
  const act=E('ech-actions'); if(act) act.hidden=!modifEch;
  const b=E('ech-modif'); if(b) b.textContent=modifEch?'Fermer':'Modifier';
}

// ───── enregistrer ─────
async function poserParam(id,valeur){
  try{
    if(DB) await DB.collection('parametres').doc(id).set(valeur);
    else localStorage.setItem('rec_'+id,JSON.stringify(valeur));
    return true;
  }catch(e){ return false; }
}

function brancherParametres(){
  const pm=E('prov-modif'); if(pm) pm.addEventListener('click',()=>{
    modifProv=!modifProv; E('prov-etat').textContent=''; tableProvision(); });
  const pn=E('prov-non'); if(pn) pn.addEventListener('click',()=>{
    modifProv=false; tableProvision(); });
  const po=E('prov-ok'); if(po) po.addEventListener('click',async()=>{
    const taux={};
    for(const f of Object.keys(PROV.taux||{})) taux[f]=(PROV.taux[f]||[]).slice();
    for(const inp of E('prov-taux').querySelectorAll('input[data-fam]')){
      const v=Number(String(inp.value).replace(',','.').replace('%','').trim());
      if(isFinite(v)) taux[inp.dataset.fam][Number(inp.dataset.j)]=v/100;
    }
    // Le rattachement affiché ne porte que les dispositifs présents dans la
    // balance du mois. Les autres n'ont pas de ligne à l'écran — ils n'ont pas
    // pour autant quitté le barème, et un enregistrement les effaçait en
    // silence. On les reconduit d'abord, puis on pose ce qui est affiché.
    const familles={}; for(const f of Object.keys(taux)) familles[f]=[];
    const choix=[...E('prov-familles').querySelectorAll('select[data-sc]')];
    const affiches=new Set(choix.map(s=>s.dataset.sc));
    for(const [f,liste] of Object.entries(PROV.familles||{}))
      for(const sc of liste) if(!affiches.has(sc)&&familles[f]) familles[f].push(sc);
    for(const sel of choix){
      const f=sel.value; if(f&&f!=='(aucune)'&&familles[f]) familles[f].push(sel.dataset.sc);
    }
    const v={...PROV, taux, familles, confirme:true, quand:leJour()};
    const ok=await poserParam('provision',v);
    E('prov-etat').textContent=ok?'Enregistré le '+leJour():'Enregistrement refusé — rien n’a été gardé.';
    if(ok){ PROV=v; modifProv=false; ruban(); tableProvision(); }
  });

  const em=E('ech-modif'); if(em) em.addEventListener('click',()=>{
    modifEch=!modifEch; E('ech-etat').textContent=''; tableEcheance(); });
  const en=E('ech-non'); if(en) en.addEventListener('click',()=>{
    modifEch=false; tableEcheance(); });
  const eo=E('ech-ok'); if(eo) eo.addEventListener('click',async()=>{
    const regles=ECH.map(r=>({...r}));
    for(const inp of E('ech-bareme').querySelectorAll('input[data-ech]')){
      const k=Number(inp.dataset.ech); if(!regles[k]) continue;
      regles[k][inp.dataset.champ]=inp.value.trim();
    }
    const ok=await poserParam('echeance',{regles, quand:leJour()});
    E('ech-etat').textContent=ok?'Enregistré le '+leJour():'Enregistrement refusé — rien n’a été gardé.';
    if(ok){ ECH=regles; modifEch=false; tableEcheance(); }
  });
}

// ═══════════ la vue « à provisionner » ═══════════
//
// Elle répond à sa demande du 16/10/2026 : voir, visuellement, comment les
// types de financement se répartissent dans chaque type de client.
//
// Une seule échelle pour les trois groupes : une barre deux fois plus longue
// vaut deux fois plus d'euros, d'un groupe à l'autre comme à l'intérieur d'un
// groupe. Deux échelles auraient fait paraître égaux des montants qui ne le
// sont pas — c'est la faute la plus courante de ce genre de graphique.

function vueProvision(){
  paramsPrets();
  const cible=E('bloc-prov'); if(!cible) return;
  // Le même tableau que les deux autres lectures : une ligne par groupe, les
  // mêmes colonnes d'ancienneté. Seuls les montants changent — ce sont les
  // provisions, et non le reste dû. Sa règle, le 16/10/2026 : « je ne veux pas
  // que tu changes la mise en forme dans à provisionner ».
  //
  // PAR TYPE DE CLIENT EN DOCTRINE CAC, 04/11/2026 : « ds l'artefcat, ici, je
  // ne veux pas que cela soit trié en type de financement mais en type de
  // client ». Le barème du commissaire aux comptes SE LIT par type de client :
  // une ligne par financement obligeait à les rassembler de tête pour retrouver
  // le taux qui s'y applique.
  const parClient=CAC();
  const parSc=new Map(), vues=new Set();
  for(const i of I){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const sc=parClient?categorieDe(i,'cat'):sousVraie(i); if(!sc) continue;
    const rd=N(i,'Reste dû de la créance');
    // Une créance intégralement réglée à l'intérieur de son lot garde sa clé
    // dans le détail mais ne doit plus rien : elle ne se compte pas ici, pas
    // plus qu'au zoom ni dans l'export. Sans ce filtre la colonne « Créances »
    // annonçait 6 141 quand le reste de la page en publie 6 031.
    if(Math.abs(rd)<0.005) continue;
    const t=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
    // Le taux se prend TOUJOURS sur le type de financement de la créance, quel
    // que soit le regroupement affiché : c'est lui qui désigne la famille du
    // barème. Prendre la clé d'affichage aurait changé la provision.
    const p=provisionDe(rd, sousVraie(i), t, k);
    let g=parSc.get(sc);
    if(!g){ g={sc, cat:categorieDe(i,'cat'), rd:0, prov:0, nb:0, tr:new Map()}; parSc.set(sc,g); }
    g.rd+=rd; g.prov+=p; g.nb++;
    if(p) g.tr.set(t,(g.tr.get(t)||0)+p);
  }
  const liste=[...parSc.values()].sort((a,b)=>b.prov-a.prov||(a.sc<b.sc?-1:1));
  const total=liste.reduce((s,x)=>s+x.prov,0);
  const rdTot=liste.reduce((s,x)=>s+x.rd,0);
  const nbTot=liste.reduce((s,x)=>s+x.nb,0);
  const trTot=new Map();
  for(const x of liste) for(const [t,v] of x.tr) trTot.set(t,(trTot.get(t)||0)+v);

  const cell=(v,sc,tr)=>v
    ? '<td class="n ouvrable" data-sc="'+esc(sc)+'" data-tr="'+esc(tr||'')+'"'
      +' title="Voir les lignes">'+eurC(v)+'</td>'
    : '<td class="n">·</td>';
  const pct=v=>!total?'·':(v/total*100).toLocaleString('fr-FR',
    {minimumFractionDigits:1,maximumFractionDigits:1})+' %';
  let h='<table id="prov-table"><thead><tr>'
    +'<th>'+(parClient?'Type de client':'Type de financement')+'</th>'
    +'<th class="n">Reste dû</th><th class="n">À provisionner</th><th class="n">Part</th>'
    +D.tranches.map(x=>'<th class="n">'+esc(x)+'</th>').join('')
    +'<th class="n">Non échu</th><th class="n">Créances</th></tr></thead><tbody>';
  for(const g of liste){
    h+='<tr><td>'+esc(g.sc)+'</td>'
      +'<td class="n">'+eurC(g.rd)+'</td>'
      +(g.prov?('<td class="n prov ouvrable" data-sc="'+esc(g.sc)+'" data-tr=""'
          +' title="Voir les lignes">'+eurC(g.prov)+'</td>'):'<td class="n prov">·</td>')
      +'<td class="n">'+(g.prov?pct(g.prov):'·')+'</td>'
      +D.tranches.map(t=>cell(g.tr.get(t)||0,g.sc,t)).join('')
      +'<td class="n">·</td><td class="n">'+g.nb.toLocaleString('fr-FR')+'</td></tr>';
  }
  h+='<tr class="total"><td>TOTAL</td><td class="n">'+eurC(rdTot)+'</td>'
    +'<td class="n prov ouvrable" data-sc="" data-tr="" title="Voir les lignes">'
      +eurC(total)+'</td><td class="n">100,0 %</td>'
    +D.tranches.map(t=>cell(trTot.get(t)||0,'',t)).join('')
    +'<td class="n">·</td><td class="n">'+nbTot.toLocaleString('fr-FR')+'</td></tr>'
    +'</tbody></table>';
  cible.innerHTML=h;
  // Un clic sur un montant à provisionner rend les lignes qui le composent.
  for(const td of cible.querySelectorAll('td.ouvrable'))
    td.addEventListener('click',()=>ouvrir(td.dataset.sc,td.dataset.tr,
      parClient?'cat':'sous',true));
}
