// Le barème de provision du groupe, tel qu'il est appliqué, suivi du
// rattachement de chaque type de financement à son type de client. Les deux se lisent
// ensemble : un taux sans son périmètre ne dit pas quel montant il couvre.
function provisionRegles(ws){
  paramsPrets();
  const fen=PROV.fenetres||[], taux=PROV.taux||{};
  if(!fen.length) return;
  ws.addRow([]);
  // L'exposé de la règle de provision a quitté le classeur le 21/10/2026 :
  // « retire ça de l'export ». Le 22/10, le chapeau du rattachement est parti
  // à son tour : qu'il ne soit pas confirmé se lit maintenant dans l'en-tête
  // de sa colonne. Le classeur garde les taux et le rattachement — des
  // chiffres, pas un cours.
  const pv=provisions();
  poserEntete(ws,ws.addRow(['Type de client',...fen.map(f=>f.label),'À provisionner']));
  let y=0;
  for(const f of Object.keys(taux)){
    const l=ws.addRow([f,...(taux[f]||[]),pv.parFam.get(f)||0]);
    l.getCell(1).font={bold:true};
    for(let c=2;c<=1+fen.length;c++) l.getCell(c).numFmt='0 %';
    l.getCell(2+fen.length).numFmt=EUROS;
    if(y++%2) remplirLigne(ws,l,PALE);
  }
  const tot=ws.addRow(['TOTAL',...fen.map(()=>null),pv.total]);
  tot.getCell(1).font={bold:true}; tot.getCell(2+fen.length).font={bold:true};
  tot.getCell(2+fen.length).numFmt=EUROS;
  ws.addRow([]);
  poserEntete(ws,ws.addRow(['Type de financement',
    'Type de client'+(PROV.confirme?'':' (proposition, à confirmer)'),'',
    'Reste dû','À provisionner']));
  const rd=new Map(), vues=new Set();
  for(const i of I){ const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const sc=sousVraie(i); if(sc) rd.set(sc,(rd.get(sc)||0)+N(i,'Reste dû de la créance')); }
  y=0;
  for(const sc of [...rd.keys()].sort()){
    const l=ws.addRow([sc, familleDe(sc)||sansType(sc), '', rd.get(sc)||0, pv.parSc.get(sc)||0]);
    l.getCell(1).font={bold:true};
    l.getCell(4).numFmt=EUROS; l.getCell(5).numFmt=EUROS;
    if(!familleDe(sc)) l.getCell(2).font=EXCLU(sc)
      ?{color:{argb:ENCRE3},italic:true}:{color:{argb:CORAIL},bold:true};
    if(y++%2) remplirLigne(ws,l,PALE);
  }

  // ── LES RÈGLES DE PROVISION, À LA SUITE DES TAUX ──
  //
  // Sa demande du 02/11/2026 : « ajoute dans les règles, à la suite des
  // provisions, les règles de celle-ci en succinct ».
  //
  // SUCCINCT VEUT DIRE EN CELLULES. L'exposé en paragraphes avait quitté le
  // classeur les 21 et 22/10 — « retire ça de l'export », « enlève-moi ce type
  // de phrase de l'export » : un fait se dit dans une cellule, pas dans une
  // phrase. Une règle par ligne, son énoncé en regard, et rien à lire avant.
  ws.addRow([]);
  bande(ws,'RÈGLES DE PROVISION',{bold:true,size:12,color:{argb:BLEU}});
  ws.addRow([]);
  const eR=ws.addRow(['Règle','Ce qu’elle dit']);
  ws.mergeCells(eR.number,2,eR.number,8);
  poserEntete(ws,eR);
  const fen2=(PROV.fenetres||[]).map(f=>f.label).join(' · ');
  const sansEmploi=creditSansEmploi();

  // LE REGROUPEMENT DU BARÈME EST LE TYPE DE CLIENT, ET RIEN D'AUTRE.
  //
  // « c pas une famille alors, c un type de client », 02/11/2026. Elle a raison,
  // et la donnée le dit : type de financement par type de financement, le
  // regroupement du barème coïncide EXACTEMENT avec le type de client porté par
  // chaque ligne, dans les deux balances. « Famille » était un synonyme inventé
  // par-dessus une colonne qui existait déjà — et il se lisait d'autant plus mal
  // qu'un même nom désignait les deux niveaux : « Financement personnel » est un
  // type de client ET un type de financement. Un seul mot pour une seule chose.
  //
  // LA LISTE SE CONSTRUIT SUR LES PARAMÈTRES, jamais à la main : une règle qui
  // énumère de mémoire ment dès le premier rattachement modifié.
  const grp=PROV.familles||{};
  const grpNoms=Object.keys(PROV.taux||{});
  const rattaches=new Set([].concat(...grpNoms.map(f=>grp[f]||[])));
  const grpDit='Le taux s’applique au type de client, et non au type de financement '
    +'pris isolément : le barème compte une ligne par type de client, et chaque type '
    +'de financement est rattaché à l’un d’eux. '
    +grpNoms.map(f=>f+' : '+((grp[f]||[]).join(', ')
      ||'aucun type de financement rattaché')).join(' — ')+'.';
  // CE QUI N'EST RATTACHÉ À RIEN SE NOMME, au lieu de se deviner. Les types de
  // financement sont relevés SUR LES ÉCRITURES de l'arrêté : un type absent du
  // grand livre n'a pas à figurer dans une règle, et un type présent mais oublié
  // du barème ne doit pas pouvoir s'y cacher.
  const tousTypes=[...new Set(I.map(i=>sousVraie(i)).filter(Boolean))].sort();
  const orphelins=tousTypes.filter(x=>!rattaches.has(x));
  const exclus=orphelins.filter(x=>(PROV.exclus||[]).indexOf(x)>=0);
  const oublis=orphelins.filter(x=>(PROV.exclus||[]).indexOf(x)<0);
  // UN TAUX NUL N'EST PAS UNE ABSENCE, ET SE DIT. Un type de client dont le
  // barème porte zéro dans toutes les fenêtres est rattaché — il figure dans
  // les tableaux — mais rien n'en est provisionné. Sans cette phrase, la règle
  // annonçait « Aucun » alors que l'intragroupe ne l'est pas.
  const zeroFams=grpNoms.filter(f=>((PROV.taux||{})[f]||[]).length
    && ((PROV.taux||{})[f]||[]).every(t=>!t));
  const zeroDit=zeroFams.map(f=>f+' ('+((grp[f]||[]).join(', ')
    ||'aucun type de financement rattaché')+') : rattaché au barème, et '
    +'provisionné à 0 % dans toutes les fenêtres.').join(' ');
  const orphDit=[
    orphelins.length
      ? [exclus.length?exclus.join(', ')+' : exclus du barème par la doctrine.':'',
         oublis.length?oublis.join(', ')+' : aucun type de client du barème ne les '
           +'couvre.':''].filter(Boolean).join(' ')
        +' Leur reste dû n’est pas provisionné, à son débit comme à son crédit.'
      : '',
    zeroDit,
    (!orphelins.length && !zeroFams.length)
      ? 'Aucun : tous les types de financement présents à cet arrêté relèvent d’un '
        +'type de client du barème, à un taux non nul.'
      : ''
  ].filter(Boolean).join(' ');
  const cacNoms=PROV.nomsCac||null;
  const cacDit=cacNoms
    ? Object.keys(cacNoms).filter(k=>grpNoms.indexOf(k)>=0)
        .map(k=>cacNoms[k]+' se lit ici '+k).join(' — ')+'.'
    : '';

  // CETTE BALANCE SE LIT SEULE.
  //
  // « rien à voir avec la balance âgée client, on n'est pas en comparaison »,
  // 02/11/2026. Un lecteur de cette page-ci n'a pas l'autre sous les yeux et n'a
  // pas à la connaître : ce qui est écrit ici est ce qui a servi ici.
  const dit=CAC()?[
    ['Montant à provisionner',
     'Somme, type de client par type de client et fenêtre par fenêtre, du solde net multiplié par le taux applicable.'],
    ['Assiette',
     'Le solde net, sans aucune imputation : chaque créance porte son reste dû dans sa tranche d’ancienneté, au débit comme au crédit, et le taux s’applique au solde net du type de client dans la fenêtre.'],
    ['Solde créditeur',
     'Il se solde dans sa propre tranche d’ancienneté : il provisionne négativement, allège son type de client dans sa fenêtre, et ne se déplace vers aucune autre tranche. Aucun compte client, aucune facture et aucun règlement n’entrent dans ce calcul.'],
    ['Échéance — rang 1',
     'Facture postérieure à la fin de formation, ou facture sans fin de formation : date de facture + 60 jours.'],
    ['Échéance — rang 2',
     'Client titulaire d’un mandat de prélèvement GoCardless : fin de formation + 30 jours.'],
    ['Échéance — rang 3',
     'Barème du type de financement. Agefiph, AIF, B2B, B2C-Entreprise, CPF, POEI, Région, Transition Pro, Interco et DST Allemagne : fin de formation + 60 jours. ETAT, OPCO, OPCO - Alternance et Alternance : fin de formation + 30 jours. Financement personnel et Perso-Alternance : début de formation. Corporate - Alternance : date de facture + 30 jours.'],
    ['Échéance — rang 4',
     'Aucune base de calcul disponible : échéance Pennylane, à défaut date de la ligne.'],
    ['Portée de l’échéance',
     'Elle se détermine par pièce : toutes les lignes d’une même pièce prennent l’échéance de cette pièce, calculée sur sa facture si elle en comporte une, sinon sur sa ligne la plus ancienne. Une ligne sans pièce se date elle-même.'],
    ['Tranches d’ancienneté',
     'Jours de retard entre l’échéance et la date d’arrêté. Bornes : 90 / 120 / 180 / 360 / 540 / 720 / 1080 / 1440 jours, le mois valant trente jours. Aucune tranche n’est scindée, aucun prorata n’est appliqué.'],
    ['Fenêtres de provision',
     fen2+'. En deçà de 121 jours de retard, et sur tout ce qui n’est pas échu, la provision est nulle.'],
    ['Types de client du barème', grpDit],
    ['Noms du fichier CAC', cacDit||'Sans objet.'],
    ['Types de financement non provisionnés', orphDit],
    ['Ancienneté',
     'Celle de chaque créance. Elle ne dépend ni du montant ni du compte : la date qui classe la créance est son échéance.'],
  ]:[
    ['Montant à provisionner',
     'Somme, créance par créance, de l’assiette multipliée par le taux de son type de client dans la fenêtre où tombe son ancienneté.'],
    ['Assiette',
     'Reste dû de la créance, diminué des crédits qui lui ont été imputés. Une assiette nulle ou négative n’est pas provisionnée.'],
    ['Portée du crédit',
     'Le crédit s’impute sur le reste dû, jamais sur le montant provisionné : cent euros de crédit dans une tranche provisionnée à 25 % allègent la provision de vingt-cinq euros.'],
    ['Imputation — temps 1 : le règlement',
     'Un encaissement désignant des factures leur est imputé : par montant exact d’abord, puis de la plus ancienne à la plus récente, avoirs déduits.'],
    ['Imputation — temps 2 : le compte client',
     'Les crédits qu’aucune facture ne porte s’imputent sur les créances à solde débiteur du même compte, de la plus ancienne à la plus récente.'],
    ['Imputation — temps 3 : la tranche',
     'Le crédit restant compense les créances du même type de financement et de la même tranche d’ancienneté, la plus ancienne d’abord.'],
    ['Imputation — temps 4 : la cascade',
     'S’il reste du crédit, il passe à la tranche immédiatement plus ancienne, puis à la suivante, cran par cran.'],
    ['Imputation — temps 5 : la redescente',
     'Faute de cran plus ancien, le crédit redescend cran par cran vers les tranches plus jeunes, jusqu’à être employé.'],
    ['Périmètre de la compensation',
     'Elle ne quitte jamais le type de financement, et porte sur toutes ses créances, y compris celles qu’aucun barème ne provisionne.'],
    ['Ordre d’application',
     'Chaque temps est épuisé pour tous les crédits avant que le suivant ne commence : la tranche propre prime le cran voisin, et le plus ancien le plus jeune.'],
    ['Ancienneté',
     'L’imputation modifie le montant exposé, jamais la date qui le classe : chaque créance conserve sa tranche.'],
    ['Fenêtres de provision',
     fen2+'. En deçà de 121 jours de retard, et sur tout ce qui n’est pas échu, la provision est nulle.'],
    ['Types de client du barème', grpDit],
    ['Types de financement non provisionnés', orphDit],
    ['Crédit sans emploi',
     sansEmploi>0.005
       ? eurC(sansEmploi)+' sur le type de financement '+creditSansEmploiDit()
         +' : aucune créance à solde débiteur de ce type de financement n’a pu l’absorber, dans aucune tranche.'
       : 'Aucun : tout le crédit a trouvé preneur.'],
  ];
  let z=0;
  for(const [quoi,texte] of dit){
    const l=ws.addRow([quoi,texte]);
    ws.mergeCells(l.number,2,l.number,8);
    l.getCell(1).font={bold:true,color:{argb:BLEU}};
    l.getCell(1).alignment={vertical:'top',wrapText:true};
    l.getCell(2).alignment={vertical:'top',wrapText:true};
    l.height=texte.length>120?30:16;
    if(z++%2) remplirLigne(ws,l,PALE);
  }
}

// Le vocabulaire des colonnes d'audit, en clair. Ces expressions disent par
// quel chemin chaque ligne a été classée et datée ; sans glossaire, « hérité
// de la facture du même lettrage » ne se devine pas. Posé à partir de la
// colonne F, à sa demande du 15/10/2026.

// Posé en colonne A, en bas de la feuille : à sa demande du 16/10/2026, et
// parce qu'un bloc décalé en colonne F se lit mal — on ne le voit qu'en
// faisant défiler vers la droite.
// Le glossaire, sans préambule ni intertitres : elle les a retirés le
// 16/10/2026. Une liste de termes et de définitions, sous un en-tête de
// tableau comme les autres — rien à lire avant d'y chercher un mot.

// AVEC OU SANS LA PROVISION, 04/11/2026.
//
// « dans l'onglet balance agé il faut qu'il n'y ai que la balance agé, et dans
// le à provisionné il faut qu'il y ait exactement ce qu'il y a auj dds
// l'onglet balance agé ».
//
// Une feuille, deux usages. Sans provision, elle est la balance âgée nue : le
// reste dû ventilé par ancienneté, et rien d'autre — c'est elle qu'on
// rapproche du grand livre. Avec, elle porte en plus l'assiette, le montant à
// provisionner et le récap par type de client : c'est la démonstration qu'on
// remet au commissaire aux comptes.
//
// Les deux lisent les MÊMES chiffres. Les mélanger dans une seule feuille
// avait coûté une demi-matinée le 04/11 : on additionnait les tranches d'un
// côté, on lisait l'assiette de l'autre, et les 6 960 € d'Interco exclu du
// barème séparaient les deux sans que rien ne le dise.
function feuilleBalance(wb,niv,idx,opt){
  opt=opt||{};
  const avecProv = opt.provision!==false;
  // « Balance âgée par type de financement » dépasse les 31 caractères
  // qu'Excel accorde à un nom d'onglet : c'est la forme courte qui tient.
  const nom=opt.nom||(niv==='cat'?'Balance âgée':'Balance âgée par financement');
  const tete=niv==='cat'?'Type de client':'Type de financement';
  // La colonne de droite donne l'AUTRE lecture du même compte : son ou ses
  // types de financement quand on lit par type de client, son ou ses types de
  // client quand on lit par type de financement. Répéter la colonne de tête
  // n'apprendrait rien.
  const autre=niv==='cat'?'Type de financement':'Type de client';
  const nT=D.tranches.length;
  // Une seule colonne ajoutée à la balance. Tout le reste — le compte, la
  // facture, la date — tient dans la première colonne, par l'indentation. Une
  // écriture ventile son montant dans les MÊMES colonnes d'ancienneté que la
  // balance : c'est ce qui permet de lire, tranche par tranche, ce qui compose
  // un montant.
  // L'ASSIETTE SE LIT À CÔTÉ DU RESTE DÛ, 03/11/2026 : « normalement si
  // j'impute les % provisionné je suis sencé avoir le bon montant
  // provisionné ». Une balance âgée dont on ne peut pas refaire la provision
  // à la main est incomplète. Les colonnes d'ancienneté portent le RESTE DÛ ;
  // la provision, elle, se calcule sur l'ASSIETTE — le reste dû diminué des
  // encaissements et avoirs non rattachés. Deux grandeurs différentes : sans
  // la seconde, le taux appliqué à la première ne retombe sur rien.
  // Sans provision, les deux colonnes qui la portent n'existent pas : une
  // colonne vide se lirait comme une donnée manquante.
  const P = avecProv
    ? {lib:0, total:1, echu:2, tranche:3, nonEchu:3+nT, nb:4+nT, part:5+nT,
       assiette:6+nT, prov:7+nT, ecart:8+nT, autre:9+nT}
    : {lib:0, total:1, echu:2, tranche:3, nonEchu:3+nT, nb:4+nT, part:5+nT,
       ecart:6+nT, autre:7+nT};
  const LARGE = avecProv ? 10+nT : 8+nT;
  const ws=wb.addWorksheet(nom);
  // Le niveau visible à l'ouverture : 1. Les comptes sont donc repliés, et
  // déplier une catégorie ne déplie PAS les écritures qu'elle contient.
  ws.properties.outlineLevelRow=1;
  ws.properties.outlineProperties={summaryBelow:false,summaryRight:false};
  ws.columns=[{width:48},{width:15},{width:15},...D.tranches.map(()=>({width:14})),
    {width:15},{width:10},{width:9},
    ...(avecProv?[{width:18},{width:16}]:[]),
    {width:10},{width:30}];
  const t=ws.addRow([opt.titre||(niv==='cat'?'RESTE DÛ PAR TYPE DE CLIENT ET PAR ANCIENNETÉ'
    :'RESTE DÛ PAR TYPE DE FINANCEMENT ET PAR ANCIENNETÉ')]);
  t.font={bold:true,size:14,color:{argb:BLEU}}; t.height=24;
  ws.addRow([]);
  const ent=new Array(LARGE).fill('');
  ent[P.lib]=tete; ent[P.total]='Restant dû'; ent[P.echu]='Échu';
  D.tranches.forEach((x,j)=>{ ent[P.tranche+j]=x; });
  ent[P.nonEchu]='Non échu'; ent[P.nb]='Créances'; ent[P.part]='Part';
  if(avecProv){ ent[P.assiette]='Assiette de provision'; ent[P.prov]='À provisionner'; }
  ent[P.ecart]='Écart'; ent[P.autre]=autre;
  poserEntete(ws,ws.addRow(ent));
  for(let c=P.total+1;c<=P.nonEchu+1;c++) ws.getColumn(c).numFmt=EURO();
  ws.getColumn(P.nb+1).numFmt=ENTIER; ws.getColumn(P.ecart+1).numFmt=EURO();
  // La part du NOMBRE de créances que porte la ligne, en fraction de 1 pour
  // qu'Excel la calcule et la somme. Sa règle, le 16/10/2026.
  ws.getColumn(P.part+1).numFmt='0.0 %';
  if(avecProv){ ws.getColumn(P.prov+1).numFmt=EURO();
                ws.getColumn(P.assiette+1).numFmt=EURO(); }
  const lignesSynth=synthRows(niv);
  // La provision par ligne de synthèse : la somme de celles de ses créances.
  const provCat=new Map(), assCat=new Map();
  const totalNb=lignesSynth.reduce((n,x)=>x.cat==='TOTAL'?n:n+x.nb,0)||0;
  const part=n=>totalNb?n/totalNb:null;

  const rang=new Map(D.tranches.map((x,j)=>[x,j]));
  const info=new Map(), par=new Map();
  for(const i of idx){
    const k=V(i,'Clé de la créance'); if(!k||info.has(k)) continue;
    const rd=N(i,'Reste dû de la créance'); if(Math.abs(rd)<0.005) continue;
    // L'ASSIETTE DE CETTE CRÉANCE, telle que la provision l'emploie : le reste
    // dû après imputation des crédits du compte, compensation de tranche et
    // cascade.
    //
    // ET SEULEMENT CE QUE LE BARÈME VOIT. Une créance non échue, ou en deçà de
    // 121 jours de retard, ne tombe dans aucune fenêtre : son assiette est
    // nulle ici, sinon la colonne annoncerait une base dont le taux ne ferait
    // rien — et le lecteur retomberait, en multipliant, sur un nombre qui n'est
    // pas la provision. Même filtre, mot pour mot, que provisionDe().
    const base=(()=>{
      const a=assiettes(); const b=a.has(k)?a.get(k):rd;
      const net=CAC()? b : (b>0?b:0);
      if(!net) return 0;
      paramsPrets();
      const tr=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
      const j=(PROV.fenetres||[]).findIndex(f=>(f.tranches||[]).indexOf(tr)>=0);
      if(j<0) return 0;
      return familleDe(sousVraie(i)) ? net : 0;
    })();
    info.set(k,{cat:categorieDe(i,niv), cpt:V(i,'N° de compte'), rd:rd, ass:base,
      // La provision de CETTE créance : son reste dû au débit multiplié par le
      // taux de sa famille dans la fenêtre où tombe son ancienneté.
      prov:provisionDe(rd, sousVraie(i),
        V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'), k),
      // L'autre lecture de la MÊME créance. Prise sur la créance, pas sur
      // l'écriture : les deux diffèrent dès que la créance n'est pas classée.
      autre:(niv==='cat'?sousVraie(i):categorieDe(i,'cat'))||'',
      tr:V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté')});
  }
  for(const [,e] of info){ provCat.set(e.cat,(provCat.get(e.cat)||0)+e.prov);
    assCat.set(e.cat,(assCat.get(e.cat)||0)+e.ass); }
  provCat.set('TOTAL',[...provCat.values()].reduce((a,b)=>a+b,0));
  assCat.set('TOTAL',[...assCat.values()].reduce((a,b)=>a+b,0));
  for(const i of idx){
    const k=V(i,'Clé de la créance'); const e=k&&info.get(k); if(!e) continue;
    if(!par.has(e.cat)) par.set(e.cat,new Map());
    const m=par.get(e.cat);
    let g=m.get(e.cpt);
    if(!g){ g={cpt:e.cpt, client:V(i,'Libellé de compte')||V(i,'Tiers'), total:0, echu:0,
      nonEchu:0, nb:0, prov:0, ass:0, buckets:D.tranches.map(()=>0), lignes:[], vues:new Set(),
      autres:new Set()}; m.set(e.cpt,g); }
    g.lignes.push(i);
    if(!g.vues.has(k)){ g.vues.add(k); g.nb++; g.total+=e.rd; g.prov+=e.prov; g.ass+=e.ass;
      // Un compte peut porter deux dispositifs : on les nomme tous les deux
      // plutôt que d'en élire un.
      if(e.autre) g.autres.add(e.autre);
      if(e.tr==='Non échu') g.nonEchu+=e.rd;
      else { g.echu+=e.rd; if(rang.has(e.tr)) g.buckets[rang.get(e.tr)]+=e.rd; } }
  }
  const ar2=x=>Math.round(x*100)/100;
  const tri=i=>V(i,'Clé de la créance')+'|'+V(i,'Date');

  // OÙ CHAQUE TYPE DE CLIENT S'ÉCRIT, pour que le récap puisse le MULTIPLIER
  // au lieu de recopier un nombre : « il faut pas que ce soit en dure mais
  // qu'il y ait des formules », 04/11/2026.
  const lignesCat=new Map();
  let z=0;
  for(const s of lignesSynth){
    const l=ws.addRow([s.cat,s.total,s.echu,...s.buckets,s.nonEchu,s.nb,
      part(s.cat==='TOTAL'?totalNb:s.nb),
      ...(avecProv?[ar2(assCat.get(s.cat)||0), ar2(provCat.get(s.cat)||0)]:[]),
      ar2(s.total-(s.echu+s.nonEchu)),'']);
    l.getCell(1).font={bold:true};
    lignesCat.set(s.cat,l.number);
    if(s.cat==='TOTAL'){ poserTotal(l,ws); continue; }
    if(z++%2) remplirLigne(ws,l,PALE);
    for(const g of [...(par.get(s.cat)||new Map()).values()].sort((a,b)=>a.cpt<b.cpt?-1:1)){
      const lr=ws.addRow(['    '+g.cpt+' - '+g.client, ar2(g.total), ar2(g.echu),
        ...g.buckets.map(ar2), ar2(g.nonEchu), g.nb, part(g.nb),
        ...(avecProv?[ar2(g.ass), ar2(g.prov)]:[]),
        ar2(g.total-(g.echu+g.nonEchu)),
        [...g.autres].sort().join(' · ')]);
      lr.outlineLevel=1; lr.hidden=true; lr.getCell(1).font={bold:true};
      // Une ligne par ÉCRITURE du compte : son montant au débit ou au crédit,
      // posé dans la colonne d'ancienneté qui lui correspond.
      //
      // Ces lignes ne totalisent PAS toujours la ligne du compte, tranche par
      // tranche, et c'est normal : la balance répartit le solde d'un lettrage
      // entre ses factures au prorata, tandis qu'un règlement s'impute sur une
      // seule d'entre elles. La ligne du compte, au-dessus, reste la référence.
      for(const i of g.lignes.sort((a,b)=>tri(a)<tri(b)?-1:1)){
        const e=info.get(V(i,'Clé de la créance'));
        const m=ar2(N(i,'Débit')-N(i,'Crédit'));
        const r=new Array(LARGE).fill(null);
        // Une case vide se lit comme une donnée manquante ; un zéro dit « rien
        // dans cette tranche ». Sa règle, le 16/10/2026 : « quand il n'y a
        // rien il faut mettre dans le montant 0 € ». Les colonnes de comptage
        // — créances et part — restent vides : elles n'ont pas de sens sur une
        // écriture, et un zéro y serait une réponse à une question qu'on ne
        // pose pas.
        for(let c=P.total;c<=P.nonEchu;c++) r[c]=0;
        r[P.ecart]=0;
        r[P.lib]='          '+(V(i,'N° de facture')||'·')+'   '+V(i,'Date');
        r[P.total]=m;
        if(e.tr==='Non échu') r[P.nonEchu]=m;
        else { r[P.echu]=m; if(rang.has(e.tr)) r[P.tranche+rang.get(e.tr)]=m; }
        r[P.ecart]=0;
        r[P.autre]=e.autre;
        const le=ws.addRow(r); le.outlineLevel=2; le.hidden=true;
      }
    }
  }

  // LE CALCUL SE REFAIT SUR LA FEUILLE QU'ON LIT, 03/11/2026. Le récap par
  // type de client — assiette, barème, produit — était au bas de « À
  // provisionner » ; il manquait ici, où le tableau par type de client se lit.
  // Il ne s'écrit que dans cette feuille-là : par type de financement, les
  // taux ne s'appliquent pas, puisque le barème se lit par type de client.
  if(niv==='cat' && avecProv) recapParTypeDeClient(ws,
    opt.formules ? {lignes:lignesCat, colTranche:P.tranche+1, tranches:D.tranches} : null);
}

// Ce qui doit arriver dans Excel comme un NOMBRE, et rien d'autre. Un numéro
// de compte n'est pas un nombre : « 4110600400000 » devenait « 4,1106E+12 »,
// illisible et impossible à rapprocher de la balance.
// La première colonne retirée du classeur. Tout ce qui la suit l'est aussi.
const COUPE='N° de rapprochement';
// Les colonnes de provision ajoutées au détail, à sa demande du 31/10/2026.
// Leur nom dit « de la créance » : c'est elle qui les porte, et non l'écriture
// sur laquelle elles se répètent.
//
// ── ET LA CLÉ DE LA CRÉANCE AVEC ELLES, 04/11/2026 ──
//
// Elle était partie le 16/10 avec les colonnes de rapprochement — « retire les
// colonnes de l'export à partir de la colonne AW ». Mais sans elle, la
// provision ne se resomme pas : deux créances du même client sur la même
// facture, sous deux lettrages différents, sont indiscernables dans l'export,
// et les additionner compte deux fois ou pas du tout. Mesuré : 2 818 916 €
// retrouvés au lieu de 3 325 190 €. Une colonne qu'on ne peut pas resommer
// n'est pas auditable ; elle revient donc, et en tête des trois qu'elle
// identifie.
const PROV_COLS=['Clé de la créance','Assiette de provision de la créance',
  'Détail du calcul de la provision','Provision de la créance'];
// Celles qui portent des euros. Le détail est du texte, la clé aussi : leur
// poser un format monétaire en ferait « 0 € » sur toute la colonne.
const PROV_EUROS=new Set(['Assiette de provision de la créance','Provision de la créance']);
// La largeur de chacune : une clé tient en 34, un montant en 30, la phrase du
// calcul demande 86.
const PROV_LARGE={'Clé de la créance':34};
// LE NOMBRE DE COLONNES ANNONCÉ DOIT ÊTRE CELUI DE LA FEUILLE.
// Il ne comptait que les colonnes du grand livre : ni « Compte - Client », qui
// ouvre le tableau, ni les colonnes de provision, qui le ferment. Le sommaire
// en annonçait donc trois de moins qu'il n'y en avait — quatre depuis que le
// détail du calcul s'y ajoute.
const nbColsGL=()=>D.cols.indexOf(COUPE)<0?D.cols.length:D.cols.indexOf(COUPE);
const nbColsDetail=()=>1+nbColsGL()+PROV_COLS.length;
const NUMERIQUES=new Set([...MONNAIE,'Taux d’attribution TVA','Taux de change',
  'Jours de retard','Délai appliqué (jours)']);

// ── L'ONGLET « À PROVISIONNER » ──
//
// Sa demande du 02/11/2026 : « j'aimerais que lorsque je fais un export j'ai
// un onglet avec le tableau à provisionner, de la même manière qu'il y a les
// tableaux par type de financement. »
//
// C'est LE TABLEAU DE L'ÉCRAN, colonne pour colonne : sa règle du 16/10,
// « je ne veux pas que tu changes la mise en forme dans à provisionner »,
// vaut ici aussi. Même ordre — la plus grosse provision en tête —, mêmes
// colonnes d'ancienneté, même colonne « Non échu » qui reste vide puisque
// rien de non échu ne se provisionne, même décompte de créances.
//
// Il porte sur idx, comme les autres feuilles : un export de la sélection à
// l'écran donne la provision de cette sélection, pas celle de toute la
// balance. Un classeur qui contredirait la page qu'on vient de lire ne
// servirait à rien.
function feuilleProvision(wb,idx){
  paramsPrets();
  const nT=D.tranches.length;
  const ws=wb.addWorksheet('À provisionner');
  ws.columns=[{width:34},{width:15},{width:16},{width:9},
    ...D.tranches.map(()=>({width:14})),{width:13},{width:10}];
  const t=ws.addRow(['MONTANT À PROVISIONNER PAR TYPE DE FINANCEMENT ET PAR ANCIENNETÉ']);
  t.font={bold:true,size:14,color:{argb:BLEU}}; t.height=24;
  ws.addRow([]);
  poserEntete(ws,ws.addRow(['Type de financement','Reste dû','À provisionner','Part',
    ...D.tranches,'Non échu','Créances']));
  ws.getColumn(2).numFmt=EUROS;
  ws.getColumn(3).numFmt=EUROS;
  ws.getColumn(4).numFmt='0.0 %';
  for(let c=5;c<=4+nT;c++) ws.getColumn(c).numFmt=EUROS;
  ws.getColumn(5+nT).numFmt=EUROS;
  ws.getColumn(6+nT).numFmt=ENTIER;

  // Une créance intégralement réglée à l'intérieur de son lot garde sa clé
  // dans le détail mais ne doit plus rien : elle ne se compte pas ici, pas
  // plus qu'à l'écran. C'est le même filtre que vueProvision().
  //
  // ── LE DÉPLIAGE, COMME DANS « BALANCE ÂGÉE PAR FINANCEMENT » ──
  //
  // Sa demande : « un onglet avec le tableau à provisionner, DE LA MÊME
  // MANIÈRE QU'IL Y A LES TABLEAUX PAR TYPE DE FINANCEMENT ». Les deux
  // balances se déplient sur deux crans — le dispositif, puis ses comptes,
  // puis leurs lignes. Celui-ci ne se dépliait pas : il annonçait un nombre
  // de créances sans dire lesquelles, et sa règle tient depuis le 14/10 —
  // « à chaque fois qu'il y a un nb de facture, je dois pv savoir de quelle
  // facture il s'agit ».
  //
  // Cran 1 : le compte client. Cran 2 : LA CRÉANCE, une par facture, avec
  // l'échéance qui l'a classée et la provision qu'elle porte. C'est l'unité
  // du calcul — la provision se porte par créance, non par écriture — et
  // c'est elle que compte la colonne « Créances ».
  //
  // LA MISE EN FORME DES LIGNES DÉJÀ LÀ NE BOUGE PAS : « je ne veux pas que
  // tu changes la mise en forme dans à provisionner », 16/10/2026. Les
  // dispositifs et le TOTAL gardent leurs colonnes, leurs couleurs et leur
  // alternance ; le dépliage s'ajoute dessous, replié à l'ouverture.
  ws.properties.outlineLevelRow=1;
  ws.properties.outlineProperties={summaryBelow:false,summaryRight:false};
  const ar2=x=>Math.round(x*100)/100;

  // LE NUMÉRO DE FACTURE ET L'ÉCHÉANCE SE PRENNENT SUR LA LIGNE DE FACTURE.
  // Un encaissement ne porte pas le numéro de la facture qu'il solde, et la
  // première ligne rencontrée d'une créance peut être le règlement.
  const info=new Map();
  for(const i of idx){
    const k=V(i,'Clé de la créance'); if(!k) continue;
    let e=info.get(k);
    if(!e){ e={fac:'', ech:'', sur:false}; info.set(k,e); }
    if(e.sur) continue;
    const ech=V(i,'Date d’échéance recalculée')||V(i,'Date d’échéance');
    const f=V(i,'N° de facture');
    if(f&&/facture/i.test(V(i,'Nature de l’écriture'))){ e.fac=f; e.ech=ech; e.sur=true; }
    else { if(!e.fac&&f) e.fac=f; if(!e.ech) e.ech=ech; }
  }

  const parSc=new Map(), vues=new Set();
  for(const i of idx){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const sc=sousVraie(i); if(!sc) continue;
    const rd=N(i,'Reste dû de la créance');
    if(Math.abs(rd)<0.005) continue;
    const tr=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
    const p=provisionDe(rd, sc, tr, k);
    let g=parSc.get(sc);
    if(!g){ g={sc, rd:0, prov:0, nb:0, tr:new Map(), cpt:new Map()}; parSc.set(sc,g); }
    g.rd+=rd; g.prov+=p; g.nb++;
    if(p) g.tr.set(tr,(g.tr.get(tr)||0)+p);
    const nc=V(i,'N° de compte'), cl=V(i,'Libellé de compte')||V(i,'Tiers');
    let cp=g.cpt.get(nc);
    if(!cp){ cp={cpt:nc, client:cl, rd:0, prov:0, nb:0, tr:new Map(), cr:[]}; g.cpt.set(nc,cp); }
    cp.rd+=rd; cp.prov+=p; cp.nb++;
    if(p) cp.tr.set(tr,(cp.tr.get(tr)||0)+p);
    // UNE CRÉANCE SANS FACTURE SE NOMME POUR CE QU'ELLE EST. Le troisième
    // segment de la clé vaut alors « #2 », « #3 » — un rang interne, qui ne
    // dit rien à qui lit. La cellule porte donc la nature de l'écriture et ce
    // rang, pour qu'un règlement non lettré reste distinct de son voisin.
    const e=info.get(k)||{fac:'',ech:''};
    const nat=V(i,'Nature de la créance')||V(i,'Nature de l’écriture')||'écriture';
    const seg=k.split('|')[2]||'';
    cp.cr.push({fac:e.fac||(nat+(seg?' '+seg:'')),
      ech:e.ech||'', rd:rd, prov:p, tr:tr});
  }
  const liste=[...parSc.values()].sort((a,b)=>b.prov-a.prov||(a.sc<b.sc?-1:1));
  const total=liste.reduce((s,x)=>s+x.prov,0);
  // UN TOTAL VIDE NE SE DISTINGUE PAS D'UN OUBLI. « il n'y a rien ds les
  // totaux de 0 - 3 mois », 02/11/2026 : ces deux tranches ne portent jamais
  // de provision — en deçà de 121 jours de retard le taux est nul — et leur
  // colonne restait blanche de haut en bas, TOTAL compris. Un zéro dit « rien
  // dans cette tranche » ; un blanc ne dit rien du tout. Sa règle du 16/10.
  const pt=v=>total?v/total:0;
  let y=0;
  for(const g of liste){
    const l=ws.addRow([g.sc, ar2(g.rd), ar2(g.prov), pt(g.prov),
      ...D.tranches.map(x=>ar2(g.tr.get(x)||0)), 0, g.nb]);
    l.getCell(1).font={bold:true};
    if(g.prov) l.getCell(3).font={bold:true,color:{argb:CORAIL}};
    if(y++%2) remplirLigne(ws,l,PALE);
    for(const cp of [...g.cpt.values()].sort((a,b)=>a.cpt<b.cpt?-1:1)){
      const lr=ws.addRow(['    '+cp.cpt+' - '+cp.client, ar2(cp.rd), ar2(cp.prov),
        pt(cp.prov), ...D.tranches.map(x=>ar2(cp.tr.get(x)||0)), 0, cp.nb]);
      lr.outlineLevel=1; lr.hidden=true; lr.getCell(1).font={bold:true};
      // Les créances de la plus ancienne échéance à la plus récente : c'est
      // l'ordre dans lequel une balance âgée se lit. Une case vide se lirait
      // comme une donnée manquante — un zéro dit « rien dans cette tranche »,
      // sa règle du 16/10/2026. Les colonnes de comptage restent vides : la
      // créance EST l'unité comptée, un 1 n'y répondrait à aucune question.
      for(const q of cp.cr.sort((a,b)=>a.ech<b.ech?-1:a.ech>b.ech?1:(a.fac<b.fac?-1:1))){
        const r=new Array(6+nT).fill(null);
        r[0]='          '+q.fac+'   '+(q.ech||'sans échéance');
        r[1]=ar2(q.rd); r[2]=ar2(q.prov);
        for(let j=0;j<nT;j++) r[4+j]=0;
        r[4+nT]=0;
        const jt=D.tranches.indexOf(q.tr);
        if(jt>=0) r[4+jt]=ar2(q.prov);
        const le=ws.addRow(r); le.outlineLevel=2; le.hidden=true;
      }
    }
  }
  const trTot=new Map();
  for(const x of liste) for(const [tr,v] of x.tr) trTot.set(tr,(trTot.get(tr)||0)+v);
  const tot=ws.addRow(['TOTAL', ar2(liste.reduce((s,x)=>s+x.rd,0)), ar2(total),
    total?1:0, ...D.tranches.map(x=>ar2(trTot.get(x)||0)), 0,
    liste.reduce((s,x)=>s+x.nb,0)]);
  poserTotal(tot,ws);
  if(total) tot.getCell(3).font={bold:true,color:{argb:CORAIL}};

  // CE QUE LA COMPENSATION N'A PAS PU EMPLOYER, en une cellule et non en une
  // phrase — « enlève-moi ce type de phrase de l'export », 22/10/2026. Une
  // provision qu'on lit sans savoir qu'un crédit est resté sans preneur n'est
  // pas auditable.
  //
  // EN DOCTRINE CAC IL N'Y EN A PAS, et une cellule vide ne se distingue
  // pas d'un oubli : aucun crédit n'y est imputé, donc aucun ne peut rester
  // sans preneur. La ligne n'est pas écrite du tout.
  if(!CAC()){
    ws.addRow([]);
    const r=creditSansEmploi();
    const sc2=ws.addRow(['Crédit sans emploi', r||null, '',
      r>0.005?('financement '+creditSansEmploiDit()):'']);
    sc2.getCell(1).font={bold:true,color:{argb:ENCRE3}};
    sc2.getCell(2).numFmt=EUROS;
    sc2.getCell(4).font={color:{argb:ENCRE3}};
  }

  // ── LE RÉCAP PAR TYPE DE CLIENT, AU BAS DE LA FEUILLE ──
  //
  // Sa demande du 03/11/2026 : « ajoute en bas du tableau déjà existant les
  // provisions par type de client [...] + le tableau avec le % de provision ».
  //
  // Trois tableaux qui se lisent ensemble, et qui SONT la démonstration :
  // l'assiette exposée dans chaque fenêtre, le taux qui s'y applique, et leur
  // produit. Le total du troisième est, au centime, le TOTAL de la feuille :
  // une provision qu'on ne peut pas refaire de tête n'est pas auditable.
  //
  // Le tableau du haut ne bouge pas — « je ne veux pas que tu changes la mise
  // en forme dans à provisionner », 16/10/2026. Ces blocs viennent à la suite.
  recapParTypeDeClient(ws);
}

// L'assiette et la provision, famille par famille ET fenêtre par fenêtre.
// provisions() les additionne déjà, mais sans garder la fenêtre : c'est elle
// qu'il faut ici, puisque c'est elle qui porte le taux.
function provisionParFenetre(){
  paramsPrets();
  const fen=PROV.fenetres||[], taux=PROV.taux||{};
  const a=assiettes();
  const vide=()=>fen.map(()=>0);
  const base=new Map(), prov=new Map();
  const vues=new Set();
  // Le même parcours, le même filtre et le même ordre que provisions() : deux
  // chemins de calcul qui divergeraient donneraient deux totaux, et le lecteur
  // n'aurait aucun moyen de savoir lequel croire.
  for(const i of I){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const rd=N(i,'Reste dû de la créance');
    if(CAC()? !rd : !(rd>0)) continue;
    const b=a.has(k)?a.get(k):rd;
    if(CAC()? !b : !(b>0)) continue;
    const sc=sousVraie(i);
    const tr=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
    const j=fen.findIndex(f=>(f.tranches||[]).indexOf(tr)>=0);
    if(j<0) continue;
    const fam=familleDe(sc); if(!fam) continue;
    if(!base.has(fam)){ base.set(fam,vide()); prov.set(fam,vide()); }
    base.get(fam)[j]+=b;
    prov.get(fam)[j]+=b*((taux[fam]||[])[j]||0);
  }
  return {fen, taux, base, prov};
}

// LA LETTRE D'UNE COLONNE EXCEL. Sans elle, pas de formule : une référence
// se nomme « F17 », pas « colonne 6, ligne 17 ».
function colLettre(n){ let s=''; while(n>0){ const r=(n-1)%26;
  s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }

// ANCRE : où lire, dans la feuille, ce que le barème multiplie.
//
// Sa demande du 04/11/2026 : « ds l'onglet à provisionner on enlève le tableau
// assiette, et ds le tableau montant provisionné il faut pas que ce soit en
// dure mais qu'il y ait des formules ».
//
// Avec une ancre, le récap ne porte plus que DEUX blocs — le barème et le
// montant — et chaque montant est une formule : la somme des tranches de la
// fenêtre, prise sur la ligne du type de client dans le tableau du haut,
// multipliée par la cellule de taux. Changer un taux recalcule la feuille.
//
// CE N'EST PLUS TOUT À FAIT LA MÊME BASE. Le moteur provisionne l'ASSIETTE,
// qui écarte les financements hors barème — l'intragroupe. Les tranches, elles,
// les portent. L'écart se dit en une ligne sous le tableau plutôt que de
// laisser deux totaux se contredire en silence.
function recapParTypeDeClient(ws,ancre){
  const {fen,taux,base,prov}=provisionParFenetre();
  if(!fen.length) return;
  const ar2=x=>Math.round(x*100)/100;
  // L'ordre des types de client est celui du tableau de la balance, pas celui
  // d'un objet : les deux lectures doivent se superposer.
  const fams=(D.ordreTypeClient||[]).filter(f=>taux[f])
    .concat(Object.keys(taux).filter(f=>(D.ordreTypeClient||[]).indexOf(f)<0));
  const lab=fen.map(f=>f.label);

  // UN NUMÉRO DE LIGNE SE RELÈVE, IL NE SE CALCULE PAS. Déduit de rowCount et
  // d'un décalage, il pointait sur l'entête du barème au lieu du taux : la
  // formule multipliait par du texte. Le bloc rend donc les lignes qu'il a
  // réellement écrites.
  // La largeur du récap : l'intitulé, les fenêtres, et le total quand il y en
  // a un. Les bandes s'y arrêtent, au lieu de déborder jusqu'à la colonne 8.
  const LARGEUR=2+fen.length;
  const bloc=(titre, lire, fmt, avecTotal, sortieLignes)=>{
    ws.addRow([]);
    bande(ws,titre,{bold:true,size:12,color:{argb:BLEU}},1,LARGEUR);
    poserEntete(ws,ws.addRow(['Type de client',...lab,...(avecTotal?['Total']:[])]));
    const somme=fen.map(()=>0);
    let y=0;
    for(const f of fams){
      const v=lire(f)||fen.map(()=>0);
      const cells=[f,...v.map(x=>fmt==='euros'?ar2(x):x)];
      if(avecTotal) cells.push(ar2(v.reduce((a,b)=>a+b,0)));
      const l=ws.addRow(cells);
      if(sortieLignes) sortieLignes.push(l.number);
      l.getCell(1).font={bold:true};
      for(let c=2;c<=1+lab.length+(avecTotal?1:0);c++)
        l.getCell(c).numFmt=(fmt==='euros'?EURO():'0 %');
      v.forEach((x,j)=>somme[j]+=x);
      if(y++%2) remplirLigne(ws,l,PALE);
    }
    if(fmt==='euros'){
      const cells=['TOTAL',...somme.map(ar2)];
      if(avecTotal) cells.push(ar2(somme.reduce((a,b)=>a+b,0)));
      const t=ws.addRow(cells);
      poserTotal(t,ws);
      for(let c=2;c<=1+lab.length+(avecTotal?1:0);c++) t.getCell(c).numFmt=EURO();
    }
    return somme;
  };

  ws.addRow([]);
  const tt=bande(ws,'RÉCAP PAR TYPE DE CLIENT',
    {bold:true,size:14,color:{argb:BLEU}},1,LARGEUR);
  tt.height=26;

  // Sans ancre, les trois blocs d'hier, en valeurs. Avec, deux blocs et des
  // formules : le tableau d'assiette s'efface, puisque la formule va chercher
  // les tranches elles-mêmes.
  if(!ancre) bloc('Assiette exposée, par fenêtre de provision', f=>base.get(f), 'euros', true);

  const lignesBareme=new Map(), rowsBareme=[];
  bloc('Barème appliqué', f=>taux[f], 'taux', false, rowsBareme);
  fams.forEach((f,k)=>{ if(rowsBareme[k]!=null) lignesBareme.set(f, rowsBareme[k]); });

  let somme;
  if(!ancre){
    somme=bloc('Montant à provisionner', f=>prov.get(f), 'euros', true);
  } else {
    ws.addRow([]);
    bande(ws,'Montant à provisionner',{bold:true,size:12,color:{argb:BLEU}},1,LARGEUR);
    poserEntete(ws,ws.addRow(['Type de client',...lab,'Total']));
    const nC=lab.length;
    const premiere=ws.rowCount+1;
    somme=fen.map(()=>0);
    let y=0;
    for(const f of fams){
      const lTab=ancre.lignes.get(f), lBar=lignesBareme.get(f);
      const cells=[f];
      const v=prov.get(f)||fen.map(()=>0);
      for(let j=0;j<nC;j++){
        const refs=(fen[j].tranches||[]).map(nom=>{
          const k=ancre.tranches.indexOf(nom);
          return k<0?null:colLettre(ancre.colTranche+k)+lTab; }).filter(Boolean);
        // Sans ligne dans le tableau du haut, aucune formule n'est possible :
        // la valeur du moteur vaut mieux qu'une référence inventée.
        cells.push((lTab&&refs.length&&lBar)
          ? {formula:'SUM('+refs.join(',')+')*'+colLettre(2+j)+lBar}
          : ar2(v[j]||0));
      }
      const l=ws.addRow(cells);
      l.getCell(1).font={bold:true};
      l.getCell(2+nC).value={formula:'SUM('+colLettre(2)+l.number+':'+colLettre(1+nC)+l.number+')'};
      for(let c=2;c<=2+nC;c++) l.getCell(c).numFmt=EURO();
      if(y++%2) remplirLigne(ws,l,PALE);
      v.forEach((x,j)=>somme[j]+=x);
    }
    const derniere=ws.rowCount;
    const t=ws.addRow(['TOTAL']);
    for(let c=2;c<=2+nC;c++){
      t.getCell(c).value={formula:'SUM('+colLettre(c)+premiere+':'+colLettre(c)+derniere+')'};
      t.getCell(c).numFmt=EURO();
    }
    poserTotal(t,ws);
  }

  // CE QUE LA FORMULE NE PROVISIONNE PAS COMME LE MOTEUR, DIT EN UNE LIGNE.
  // Le moteur applique le taux à l'ASSIETTE, qui écarte les financements hors
  // barème ; la formule l'applique aux TRANCHES, qui les portent. Une ligne
  // nomme l'écart plutôt que de laisser deux totaux se contredire.
  const attendu=provisions().total;
  let obtenu=somme.reduce((a,b)=>a+b,0);
  if(ancre){
    obtenu=0;
    for(const f of fams){
      const lTab=ancre.lignes.get(f); if(!lTab) continue;
      const ligne=(synthRows('cat')||[]).find(r=>r.cat===f);
      fen.forEach((x,j)=>{ let base2=0;
        (x.tranches||[]).forEach(nom=>{ const k=D.tranches.indexOf(nom);
          if(k>=0&&ligne) base2+=(ligne.buckets||[])[k]||0; });
        obtenu+=base2*((taux[f]||[])[j]||0); });
    }
  }
  if(Math.abs(attendu-obtenu)>0.005){
    const e=ws.addRow([ancre
      ? 'Écart avec le moteur — financements hors barème compris dans les tranches'
      : 'Écart avec le total de la feuille', ar2(obtenu-attendu)]);
    e.getCell(1).font={bold:true,color:{argb:CORAIL}};
    e.getCell(2).numFmt=EURO(); e.getCell(2).font={bold:true,color:{argb:CORAIL}};
  }

  // LA CORRESPONDANCE DES NOMS A QUITTÉ LA FEUILLE, 04/11/2026 : « enlève ce
  // tableau ». Elle redisait en quatre lignes ce que les règles portent déjà,
  // et elle venait s'ajouter sous un récap qui doit se lire d'un coup.
}

function feuilleDetail(wb,idx,nom){
  const ws=wb.addWorksheet(nom);
  // La première colonne reprend mot pour mot l'étiquette de la balance :
  // « 411C103129000 - Lorik Carrier ». Un filtre sur cette colonne donne les
  // écritures du compte qu'on vient de lire, sans rien reconstruire à la main.
  // Les colonnes de travail de la page ne vont pas dans le classeur. Sa
  // demande du 16/10/2026 : « retire les colonnes de l'export à partir de la
  // colonne AW ». Ce sont les propositions de rapprochement et les attributs
  // de la créance, dont la page a besoin pour calculer mais qui n'ont rien à
  // faire dans un document qu'on relit.
  const COLS=D.cols.slice(0,nbColsGL());
  // Les deux colonnes de la provision ferment le tableau. Elles ne viennent
  // pas du grand livre : la page les calcule, et elles portent la valeur DE LA
  // CRÉANCE, répétée sur chacune de ses écritures — voir provLigne().
  ws.columns=[{header:'Compte - Client',width:46},
    ...COLS.map(c=>({header:c,width:Math.min(42,Math.max(13,c.length+3))})),
    ...PROV_COLS.map(c=>({header:c,
      width:PROV_LARGE[c]||(PROV_EUROS.has(c)?30:86)}))];
  poserEntete(ws,ws.getRow(1));
  // 16 080 lignes : on écrit les valeurs d'un bloc et on ne pose la mise en
  // forme que sur les colonnes, pas sur chaque cellule — sans quoi le
  // navigateur passerait une minute à fabriquer 884 000 objets de style.
  ws.addRows(idx.map(i=>{ const p=provLigne(i); return [
    V(i,'N° de compte')+' - '+(V(i,'Libellé de compte')||V(i,'Tiers')),
    ...COLS.map(c=>{ const v=V(i,c);
      return (NUMERIQUES.has(c)&&NOMBRE.test(v))?Number(v):v; }),
    // La clé telle que la page la porte : « compte | lettrage | facture ».
    // C'est elle, et elle seule, qui désigne une créance.
    V(i,'Clé de la créance')||'', p.base, detailProvision(i), p.prov]; }));
  COLS.forEach((c,j)=>{ if(MONNAIE.has(c)) ws.getColumn(j+2).numFmt=EUROS; });
  PROV_COLS.forEach((c,j)=>{ if(PROV_EUROS.has(c)) ws.getColumn(COLS.length+2+j).numFmt=EUROS; });
  ws.autoFilter={from:{row:1,column:1},
                 to:{row:1,column:COLS.length+1+PROV_COLS.length}};
}

async function classeur(idx,nomDetail){

  wb.creator='Balance âgée Liora'; wb.created=new Date();
  // Le sommaire annonce combien de paiements l'onglet porte : on les compte
  // avant de l'écrire, puisqu'il passe en premier dans le classeur.
  feuilleSommaire(wb,idx,nom);
  feuilleRegles(wb);
  if(CAC()){
    // DEUX ONGLETS, DEUX QUESTIONS, 04/11/2026. La balance âgée ne répond plus
    // qu'à « combien me doit-on, et depuis quand » ; « à provisionner » reprend
    // le même tableau et lui ajoute l'assiette, le montant et le récap. Le
    // tableau par type de financement cède la place : le barème du commissaire
    // aux comptes se lit par type de client, pas par financement.
    feuilleBalance(wb,'cat',idx,{provision:false});
    feuilleBalance(wb,'sous',idx);
    feuilleBalance(wb,'cat',idx,{provision:true, nom:'À provisionner',
      titre:'MONTANT À PROVISIONNER PAR TYPE DE CLIENT ET PAR ANCIENNETÉ',
      formules:true});
  } else {

const MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
// ↓ la seule ligne qui diffère entre le fichier autonome et l'artefact ↓
let remettre=async(nom,octets)=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([octets],{type:MIME}));
  a.download=nom;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);};

// ↑ la seule ligne qui diffère ↑
// LE CLASSEUR SE CONSTRUIT SOUS LES YEUX, PAS DANS LE DOS.
//
// « ça prend beaucoup à passer de la page télécharger a ou b et la page
// enregistrer le fichier, c'est normal ? », 27/10/2026. Oui et non : mesuré à
// 15,4 s pour 38 286 écritures et 8,68 Mo, dont 17 ms pour l'enregistrement
// lui-même — tout le temps part dans la construction des cinq onglets. Ce qui
// n'était pas normal, c'est qu'on ne voyait rien : le message « Préparation du
// classeur… » était bien posé, mais la construction accaparait le fil
// principal dans la même foulée, si bien qu'il n'était JAMAIS peint. La page
// semblait figée. Deux images d'attente avant de commencer suffisent à le
// montrer, et le compte des écritures dit pourquoi c'est long.
const envoyer=async(bouton,nom,idx,quoi,nomDetail)=>{
  if(!remettre) return;
  const b=E(bouton), autre=E(bouton==='dl-xlsx'?'dl-csv':'dl-xlsx');
  b.disabled=true; if(autre) autre.disabled=true;
  E('dl-note').textContent='Préparation du classeur — '
    +idx.length.toLocaleString('fr-FR')+' écritures, '
    +(idx.length>20000?'une quinzaine de secondes':'quelques secondes')+'…';
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r,0))));
  try{
    await remettre(nom, await classeur(idx,nomDetail));
    E('dl-note').textContent=idx.length.toLocaleString('fr-FR')+' écritures · '+quoi
      +' · 6 onglets, sommaire en tête';
    setTimeout(fermerPop,1600);
  }catch(e){ E('dl-note').textContent='Le classeur n’a pas pu être écrit.'; }
  b.disabled=false; if(autre) autre.disabled=false;
};

// ───────── compléter une ligne, et s'en souvenir ─────────

// dispositif se décide par créance, pas par écriture, et toutes les lignes de
// la créance suivent. À défaut — une écriture d'un lot soldé, qui ne pèse rien
// dans la balance — la ligne se désigne par son compte, son numéro et sa date.
const cleLigne=i=>V(i,'Clé de la créance')
  || (V(i,'N° de compte')+'|'+(V(i,'N° de facture')||V(i,'N° de pièce')||'·')+'|'+V(i,'Date'));
const idDoc=k=>k.replace(/[^A-Za-z0-9_.~:@+-]+/g,'_').slice(0,180);
const leJour=()=>new Date().toLocaleDateString('fr-FR');
// Un dispositif renommé : sa décision porte l'ancien intitulé, la balance le
// nouveau. On ramène l'un à l'autre à la lecture, une fois pour toutes, plutôt
// que de laisser deux lignes vivre côte à côte pour un seul dispositif.
const dispoActuel=d=>((D&&D.anciensDispositifs)||{})[d]||d;
// Administratrice ou lectrice. Faux tant que la page n'a pas pu le demander :

//
// Les deux jeux de règles vivent dans la base de l'artefact, pas dans le

// LA DOCTRINE QUE CETTE PAGE SERT.
//
// Deux balances âgées vivent côte à côte depuis le 02/11/2026 : la sienne,
// avec ses cinq temps d'imputation, et celle du commissaire aux comptes, qui
// n'impute rien. « Les 2 balances âgées se basent sur des règles différentes,
// c'est normal qu'elles ne soient pas identiques. »
//
// La page est la MÊME des deux côtés : c'est la donnée qui dit laquelle elle
// est. Un second gabarit aurait divergé du premier au premier correctif.
const CAC=()=>!!(D&&D.doctrine==='CAC');

// À quelle famille de provision appartient un type de financement.
// UN TYPE DE FINANCEMENT QUE LE BARÈME NE COUVRE PAS : ou bien il attend son
// rattachement, ou bien la doctrine l'exclut — et les deux ne se disent pas de

// alors que c'est une règle : Interco et Interne - DST Allemagne ne sont pas
// provisionnés, et c'est voulu.
const EXCLU=sc=>((PROV.exclus||[]).indexOf(sc)>=0);
const sansType=sc=>EXCLU(sc)?'exclu du barème':'à rattacher';
const familleDe=sc=>{

  for(const [f,liste] of Object.entries(PROV.familles||{}))
    if(liste.indexOf(sc)>=0) return f;

// ───────── l'assiette de la provision ─────────
//
// On ne provisionne pas une dette qu'un paiement du même lot a déjà éteinte.
// Depuis qu'une écriture sans facture fait SA créance, un règlement non
// rattaché est devenu une créance à solde créditeur à côté des dettes du même lot, et
// la provision portait sur le BRUT de ces dettes : 16 983 311 € au lieu des
// 14 635 123 € réellement dus, soit 5 670 753 € provisionnés au lieu de
// 4 654 820 €. Un million de trop.
//
// Les crédits non rattachés d'un lot s'imputent donc sur ses dettes, de la
// plus ancienne à la plus récente — l'imputation de droit commun, et ce que le
// moteur faisait de lui-même avant la découpe, puisque le lot ne faisait
// qu'une créance. L'ANCIENNETÉ, elle, reste celle de chaque ligne.
let ASSIETTE=null, CREDIT_SANS_EMPLOI=0, IMPUTE=null, SANS_EMPLOI_SC=null;
function assiettes(){
  if(ASSIETTE) return ASSIETTE;
  ASSIETTE=new Map();
  // ─── DOCTRINE CAC : AUCUNE IMPUTATION ───
  // « Sommes nettes par sous-catégorie, montants négatifs compris », son
  // onglet Règles CAC. Chaque créance porte son reste dû tel quel dans sa
  // tranche, débiteur ou créditeur ; le taux s'applique au solde net de la
  // famille dans la fenêtre, et une tranche négative allège la provision.
  // Il n'y a donc ni compensation, ni cascade, ni crédit sans emploi.
  if(CAC()){
    const vues=new Set();
    for(const i of I){
      const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
      ASSIETTE.set(k, N(i,'Reste dû de la créance'));
    }
    CREDIT_SANS_EMPLOI=0; SANS_EMPLOI_SC=new Map(); IMPUTE=new Map();
    return ASSIETTE;
  }
  // CE QUI A MANGÉ LE CRÉDIT, CRÉANCE PAR CRÉANCE ET TEMPS PAR TEMPS.
  // La colonne « Détail du calcul de la provision » s'en sert pour écrire la
  // phrase : sans cette trace, on saurait que l'assiette est plus basse que le
  // reste dû, mais pas par quelle règle. C'est la question que pose un
  // commissaire aux comptes.
  IMPUTE=new Map();
  // L'imputation se lit PAR COMPTE CLIENT, sa décision du 20/10/2026. C'est le
  // même périmètre que la tuile « trop-perçu », et c'est ce qui rend la page
  // cohérente avec elle-même : un client déclaré globalement créditeur d'un
  // côté ne peut pas voir sa dette provisionnée à 100 % de l'autre. Au
  // lettrage, 27 lots dont le client ne devait rien portaient encore
  // 204 879 € de provision. Le résidu non imputé devient alors exactement le
  // trop-perçu des comptes nets créditeurs, et rien d'autre.
  const lots=new Map(), vues=new Set();
  for(const i of I){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    // L'ancienneté de la CRÉANCE : un encaissement porte sa propre date
    // depuis le 20/10/2026, et l'ordre d'imputation ne doit pas en dépendre.
    const jc=V(i,'Jours de retard de la créance');
    const j=jc!==''?jc:V(i,'Jours de retard');
    const lot=V(i,'N° de compte');
    if(!lots.has(lot)) lots.set(lot,[]);
    lots.get(lot).push({k, rd:N(i,'Reste dû de la créance'), j:j===''?-1:Number(j),
      // Le financement et la tranche DE LA CRÉANCE : ils ne servent pas au
      // premier temps, qui ne regarde que le compte, mais au second, qui ne
      // regarde qu'eux. sousVraie() et non le champ brut : les compléments
      // qu'elle a posés dans la page déplacent un dispositif d'une famille à
      // l'autre, et la compensation doit suivre le classement qu'elle voit.
      sc:sousVraie(i), tr:V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté')});
  }
  // L'ordre d'imputation doit être TOTAL, sinon le chiffre dépend de l'ordre
  // de lecture : deux créances du même âge se départagent par leur clé. Sans
  // ce départage, la page et le contrôle annonçaient 4 048 692,24 € et
  // 4 047 124,73 € — 1 567,51 € d'écart sur rien d'autre que l'ordre.
  const ancien=(a,b)=>b.j-a.j||(a.k<b.k?-1:a.k>b.k?1:0);
  // LA CONTREPARTIE SE NOMME, 04/11/2026 : « comment je vais pv sav quel
  // montant / ligne ont été imputé ailleurs ? ds une autre plage de retard ? »
  // Le montant et la règle étaient dits ; la ligne d'en face, non. Sa règle du
  // 14/10 vaut ici comme ailleurs : « à chaque fois qu'il y a un nb de facture,
  // je dois pv savoir de quelle facture il s'agit ».
  //
  // On note donc les DEUX SENS : ce que la créance a reçu, et où le crédit est
  // parti. Le numéro de facture se lit dans la clé — compte|lettrage|facture.
  // Le numéro quand il y en a un ; sinon le COMPTE, qui désigne tout de même
  // la ligne — un encaissement non rattaché n'a pas de facture, mais il a un
  // client, et c'est par là qu'on le retrouve dans le détail.
  const facDe=k=>{ const t=String(k||'').split('|');
    const f=(t[2]||'').trim();
    if(f) return f;
    return t[0] ? 'un crédit du compte '+t[0] : 'un crédit sans compte';
  };
  const noter=(k,quoi,montant,src)=>{
    let o=IMPUTE.get(k);
    // LES COMPTEURS SE NOMMENT PAR L'ORIGINE DU CRÉDIT, PAS PAR SON TRAJET.
    // Au temps 4 le crédit MONTE vers une tranche plus ancienne : la créance
    // qui le reçoit le reçoit donc d'une tranche plus JEUNE. Au temps 5 il
    // descend, et la créance le reçoit d'une tranche plus ANCIENNE. Nommés par
    // le trajet, les deux libellés sortaient inversés du classeur.
    if(!o){ o={compte:0, tranche:0, depuisJeune:0, depuisAncien:0, venus:[]}; IMPUTE.set(k,o); }
    o[quoi]+=montant;
    if(src && src.k){
      o.venus.push({fac:facDe(src.k), tr:src.tr||'', m:montant, quoi});
      // Et l'autre sens, sur le crédit lui-même : où il est allé.
      let c=IMPUTE.get(src.k);
      if(!c){ c={compte:0, tranche:0, depuisJeune:0, depuisAncien:0, venus:[]}; IMPUTE.set(src.k,c); }
      if(!c.partis) c.partis=[];
      c.partis.push({fac:facDe(k), tr:src.vers||'', m:montant, quoi});
    }
  };

  // ─── premier temps : PAR COMPTE CLIENT ───
  const reliquat=[];
  for(const [,g] of lots){
    const dettes=g.filter(c=>c.rd>0).sort(ancien);
    for(const dt of dettes) ASSIETTE.set(dt.k, dt.rd);
    // LE CRÉDIT S'IMPUTE CRÉANCE PAR CRÉANCE, ET NON EN BLOC.
    // Le total consommé est rigoureusement le même — les dettes sont prises
    // dans le même ordre, pour le même montant — mais on sait alors QUEL
    // crédit n'a pas trouvé preneur, et de quel financement et de quelle
    // tranche il relève. Le second temps en a besoin ; un bloc ne le dit pas.
    for(const cr of g.filter(c=>c.rd<0).sort(ancien)){
      let reste=-cr.rd;
      for(const dt of dettes){
        if(reste<=0.005) break;
        const a=ASSIETTE.get(dt.k); if(!(a>0.005)) continue;
        const pris=Math.min(reste,a); ASSIETTE.set(dt.k, a-pris); reste-=pris;
        noter(dt.k,'compte',pris,{k:cr.k, tr:cr.tr, vers:dt.tr});
      }
      if(reste>0.005) reliquat.push({k:cr.k, sc:cr.sc, tr:cr.tr, reste});
    }
  }

  // ─── second temps : MÊME TYPE DE FINANCEMENT, MÊME TRANCHE ───
  //
  // Sa décision du 02/11/2026, dictée en deux réponses : « tous les crédits
  // que l'on n'a pas réussi à imputer suivront la règle suivante :
  // compensation des créances de la même tranche d'aging », puis, sur la
  // question de savoir d'où le crédit se retranche : « soit de ce que le
  // client doit » — donc de l'ASSIETTE, et non du montant provisionné. Un
  // crédit de 100 € dans une tranche à 25 % fait baisser la provision de 25 €,
  // pas de 100 €. Et sur le périmètre : « essaye de faire que le montant
  // compense le même type de financement ».
  //
  // La compensation ne franchit NI la tranche NI le financement. Un crédit
  // dont le couple n'offre plus rien à compenser reste sans emploi : il n'est
  // reporté sur aucune autre tranche, et il est compté, parce qu'une balance
  // qui absorbe 200 000 € en silence n'est plus auditable.
  //
  // Elle s'applique à TOUTES les créances du couple, y compris celles qu'aucun
  // barème ne provisionne — moins de 121 jours, non échu. Le crédit y est
  // consommé sans effet sur la provision : c'est le sens littéral de sa règle,
  // et c'est le plus prudent, puisqu'il ne peut plus servir ailleurs.
  // Les dettes encore ouvertes, indexées par financement et par tranche, et
  // triées une fois pour toutes : la cascade les parcourt jusqu'à dix fois.
  const cle=(sc,tr)=>(sc||'')+'\u0001'+(tr||'');
  const parCT=new Map();
  for(const [,g] of lots) for(const c of g){
    if(!(c.rd>0)) continue;
    const u=cle(c.sc,c.tr);
    if(!parCT.has(u)) parCT.set(u,[]);
    parCT.get(u).push(c);
  }
  for(const [,v] of parCT) v.sort(ancien);
  // Vider un crédit sur les dettes d'une tranche de son financement.
  const vider=(r,tr,quoi)=>{
    for(const c of (parCT.get(cle(r.sc,tr))||[])){
      if(r.reste<=0.005) return;
      const a=ASSIETTE.get(c.k); if(!(a>0.005)) continue;
      const pris=Math.min(r.reste,a); ASSIETTE.set(c.k, a-pris); r.reste-=pris;
      noter(c.k,quoi,pris,{k:r.k, tr:r.tr, vers:tr});
    }
  };
  // L'ÉCHELLE DES TRANCHES, du plus jeune au plus ancien. Elle vient des
  // données — les neuf tranches de la balance — et tout ce que les créances
  // portent en plus, « Non échu » en pratique, se pose devant : c'est le plus
  // jeune de tous. Trié, pour que l'échelle ne dépende pas de l'ordre de
  // lecture du fichier.
  const ECH=((D&&D.tranches)||[]).slice();
  const inconnues=new Set();
  for(const [,g] of lots) for(const c of g)
    if(c.tr && ECH.indexOf(c.tr)<0) inconnues.add(c.tr);
  for(const t of [...inconnues].sort().reverse()) ECH.unshift(t);

  // LES TROIS TEMPS SE JOUENT L'UN APRÈS L'AUTRE, POUR TOUS LES CRÉDITS.
  //
  // Et non crédit par crédit : sa tranche a priorité sur le cran suivant, et
  // le plus ancien a priorité sur le plus jeune. Si un crédit déroulait toute
  // sa cascade avant qu'un autre ait servi dans sa propre tranche, il lui
  // prendrait une dette à laquelle le second avait un droit plus fort — et le
  // résultat dépendrait de l'ordre de lecture. Chaque temps est donc purgé
  // en entier avant le suivant.
  for(const r of reliquat) vider(r, r.tr, 'tranche');           // temps 3 : sa tranche

  // ─── temps 4 : vers le PLUS ANCIEN, cran par cran ───
  // Sa décision du 02/11 : « lorsqu'il reste des montants à provisionner même
  // suite à la règle 3, on continue d'affecter les montants créditeurs sur les
  // montants débiteurs sur la tranche 1 cran plus ancienne du même type de
  // financement ; si tout est affecté on va un cran plus ancien aussi, ainsi
  // de suite. »
  for(const r of reliquat){
    if(r.reste<=0.005) continue;
    const dep=ECH.indexOf(r.tr); if(dep<0) continue;
    for(let i=dep+1;i<ECH.length && r.reste>0.005;i++) vider(r, ECH[i], 'depuisJeune');
  }

  // ─── temps 5 : puis vers le PLUS JEUNE, cran par cran ───
  // Son amendement du même jour. Posé d'abord pour les crédits déjà dans la
  // tranche la plus ancienne, qui n'ont aucun cran au-delà — « alors tu vas
  // dans la tranche juste avant pour ce cas-là » — puis généralisé : « si UN
  // cran ne clôture pas tout on descend de encore 1 cran etc. » Un crédit qui
  // n'a rien trouvé de plus ancien redescend donc, cran par cran, sans jamais
  // quitter son financement.
  //
  // CE TEMPS FAIT PASSER LA BALANCE SOUS SON CLASSEUR MANUEL : 2 863 873 € au
  // 30/06/2026 contre 2 942 758 € au classeur, soit 78 885 € de moins. Je lui
  // ai dit, en montrant qu'un crédit de cinq ans d'âge posé sur un compte
  // d'archive vient alors réduire une dette de quatre mois ; elle a tranché
  // deux fois. La règle est la sienne, le chiffre est écrit ici pour qui
  // relira.
  for(const r of reliquat){
    if(r.reste<=0.005) continue;
    const dep=ECH.indexOf(r.tr); if(dep<0) continue;
    for(let i=dep-1;i>=0 && r.reste>0.005;i--) vider(r, ECH[i], 'depuisAncien');
  }

  CREDIT_SANS_EMPLOI=reliquat.reduce((s,r)=>s+(r.reste>0.005?r.reste:0),0);
  // DE QUEL FINANCEMENT RELÈVE CE QUI RESTE.
  // « ici précise que c'est un financement interco », 02/11/2026. Un montant
  // sans son financement ne dit pas où chercher : c'est le même principe que
  // pour les factures, qu'elle veut toujours nommées.
  SANS_EMPLOI_SC=new Map();
  for(const r of reliquat){
    if(!(r.reste>0.005)) continue;
    const u=r.sc||'(sans type de financement)';
    SANS_EMPLOI_SC.set(u,(SANS_EMPLOI_SC.get(u)||0)+r.reste);
  }
  return ASSIETTE;
}
// Ce que la compensation n'a pas pu employer. Calculé par assiettes(), affiché
// sous l'exposé des règles : le chiffre doit se lire là où la règle se lit.
function creditSansEmploi(){ assiettes(); return CREDIT_SANS_EMPLOI; }
// Les financements qui le portent, du plus gros au plus petit. Un seul la
// plupart du temps — il se nomme alors sans qu'on répète son montant.
function creditSansEmploiSc(){
  assiettes();
  return [...(SANS_EMPLOI_SC||new Map())].sort((a,b)=>b[1]-a[1]);
}
function creditSansEmploiDit(){
  const l=creditSansEmploiSc();
  if(!l.length) return '';
  if(l.length===1) return l[0][0];
  return l.map(([sc,v])=>sc+' '+eurC(v)).join(' · ');
}
// LE CALCUL DE LA PROVISION, EN TOUTES LETTRES.
//
// Sa demande du 02/11/2026 : « n'oublie pas d'ajouter dans le détail ligne à
// ligne les 2 colonnes supplémentaires avec le détail du calcul de la
// provision + le montant de la prov », puis, entre remplacer l'assiette ou
// ajouter la phrase : « 2 » — la phrase s'ajoute, et les deux nombres
// restent. L'échéance fonctionne déjà ainsi : elle donne la base, le délai ET
// la phrase.
//
// La phrase dit le chemin complet — le reste dû, ce que chaque temps lui a
// retiré, l'assiette obtenue, le taux et sa justification, le montant. Quand
// rien n'est provisionné, elle dit POURQUOI plutôt que de laisser une cellule
// vide : une cellule vide ne se distingue pas d'un oubli.
function detailProvision(i){
  paramsPrets();
  const k=V(i,'Clé de la créance');
  if(!k) return '';
  const rd=N(i,'Reste dû de la créance');
  if(CAC()){
    // Pas d'imputation : la phrase n'a qu'un chemin à dire.
    if(!rd) return 'créance soldée : rien à provisionner';
    const tr0=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
    const fen0=PROV.fenetres||[];
    const j0=fen0.findIndex(f=>(f.tranches||[]).indexOf(tr0)>=0);
    if(j0<0) return 'solde net '+eurC(rd)+' · '+(tr0||'sans tranche')
      +' : hors des quatre fenêtres, rien à provisionner';
    const fam0=familleDe(sousVraie(i));
    if(!fam0) return 'solde net '+eurC(rd)+' · '+(sousVraie(i)||'sans type de financement')
      +' : hors des types de client du barème, rien à provisionner';
    const t0=((PROV.taux||{})[fam0]||[])[j0]||0;
    if(!t0) return 'solde net '+eurC(rd)+' · '+fam0+', '+fen0[j0].label
      +' : taux nul, rien à provisionner';
    return 'solde net '+eurC(rd)+' × '+pc(t0)+' ('+fam0+', '+fen0[j0].label+') = '+eurC(rd*t0);
  }
  // UNE CRÉANCE EST AU DÉBIT, PAR DÉFINITION : « créance au crédit ne veut
  // rien dire », 04/11/2026. Ce qu'on désigne ici, c'est une créance dont le
  // SOLDE est créditeur — les encaissements et les avoirs y dépassent la
  // facture. Le montant est dit, pour qu'on sache de combien.
  if(rd<0){
    // OÙ EST ALLÉ CE CRÉDIT. Sa question du 04/11/2026 : « comment je vais pv
    // sav quel montant / ligne ont été imputé ailleurs ? ds une autre plage de
    // retard ? » Les trois plus gros preneurs sont nommés, et le reste compté.
    const im0=IMPUTE?IMPUTE.get(k):null;
    const p=(im0&&im0.partis)?im0.partis.slice().sort((a,b)=>b.m-a.m):[];
    if(!p.length) return 'solde créditeur de '+eurC(-rd)
      +' : resté sans emploi, aucune créance à solde débiteur à absorber';
    const dit=p.slice(0,3).map(x=>x.fac+(x.tr?' ('+x.tr+')':'')+' '+eurC(x.m));
    const reste=p.length-3;
    return 'solde créditeur de '+eurC(-rd)+' — imputé sur '+dit.join(', ')
      +(reste>0?' et '+reste+' autre'+(reste>1?'s':''):'');
  }
  if(!(rd>0)) return 'créance soldée : rien à provisionner';
  const a=assiettes();
  const base=a.has(k)?a.get(k):rd;
  const im=IMPUTE?IMPUTE.get(k):null;
  const parts=[];
  if(im){
    if(im.compte>0.005)  parts.push('− '+eurC(im.compte)+' imputés sur le compte');
    if(im.tranche>0.005) parts.push('− '+eurC(im.tranche)+' compensés dans sa tranche');
    if(im.depuisJeune>0.005)  parts.push('− '+eurC(im.depuisJeune)+' compensés par un crédit d’une tranche plus jeune');
    if(im.depuisAncien>0.005) parts.push('− '+eurC(im.depuisAncien)+' compensés par un crédit d’une tranche plus ancienne');
  }
  let chemin='reste dû '+eurC(rd);
  if(parts.length) chemin+=' '+parts.join(' ')+' = assiette '+eurC(base>0?base:0);
  // ET D'OÙ CES CRÉDITS VIENNENT. Un montant retranché sans contrepartie
  // nommée n'est pas vérifiable : on nomme les trois plus gros, on compte le
  // reste, et la tranche d'origine se lit — c'est elle qui dit si le crédit
  // a changé de plage de retard.
  if(im&&im.venus&&im.venus.length){
    const v=im.venus.slice().sort((a,b)=>b.m-a.m);
    const dit=v.slice(0,3).map(x=>x.fac+(x.tr?' ('+x.tr+')':'')+' '+eurC(x.m));
    const reste=v.length-3;
    chemin+=' · venus de '+dit.join(', ')+(reste>0?' et '+reste+' autre'+(reste>1?'s':''):'');
  }
  if(!(base>0)) return chemin+' : assiette nulle, rien à provisionner';
  const sc=sousVraie(i);
  const tr=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
  const fen=PROV.fenetres||[];
  const j=fen.findIndex(f=>(f.tranches||[]).indexOf(tr)>=0);
  if(j<0) return chemin+' · '+(tr||'sans tranche')
    +' : hors des quatre fenêtres — en deçà de 121 jours de retard ou non échu, rien à provisionner';
  const fam=familleDe(sc);
  if(!fam) return chemin+' · '+(sc||'sans type de financement')
    +' : aucun type de client du barème ne le couvre, rien à provisionner';
  const t=((PROV.taux||{})[fam]||[])[j]||0;
  if(!t) return chemin+' · '+fam+', '+fen[j].label+' : taux nul, rien à provisionner';
  return chemin+' × '+pc(t)+' ('+fam+', '+fen[j].label+') = '+eurC(base*t);
}

// Le barème s'applique à ce qui reste vraiment dû sur la créance.
function provisionDe(rd, sc, tr, cle){
  paramsPrets();
  const a=assiettes();
  const base=(cle!=null&&a.has(cle))?a.get(cle):rd;
  // En doctrine CAC un solde créditeur n'est pas ignoré : il provisionne
  // NÉGATIVEMENT, et c'est ainsi que les tranches négatives de son fichier
  // allègent la famille. Ailleurs, une assiette nulle ou négative ne couvre
  // aucune perte et ne se provisionne pas.
  if(CAC()){ if(!base) return 0; } else if(!(base>0)) return 0;
  const j=(PROV.fenetres||[]).findIndex(f=>(f.tranches||[]).indexOf(tr)>=0);
  if(j<0) return 0;
  const fam=familleDe(sc); if(!fam) return 0;
  return base*(((PROV.taux||{})[fam]||[])[j]||0);
}

// CE QUI ENTRE DANS LA PROVISION, ET CE QU'ELLE VAUT, POUR UNE ÉCRITURE.
//
// Sa demande du 31/10/2026 : « une avec calcul pour provision, l'autre avec le
// montant effectivement provisionné », et, au dépliage d'un montant à
// provisionner, « tt les lignes associés au montant avec le montant provisionné
// par ligne ».
//
// LES DEUX NOMBRES SONT PORTÉS PAR LA CRÉANCE, PAS PAR L'ÉCRITURE. Une créance
// est faite de plusieurs écritures — la facture, ses règlements partiels — et
// la provision se calcule une fois sur la créance entière. Les deux colonnes
// répètent donc la même valeur sur chacune de ses écritures, exactement comme
// « Reste dû de la créance » le fait déjà, et leur nom le dit : les additionner
// écriture par écriture compterait la même provision plusieurs fois. Le total
// juste est celui que la vue « À provisionner » affiche.
//
//   assiette  = reste dû de la créance, DIMINUÉ des règlements non rattachés
//               du même compte client, de la créance la plus ancienne à la
//               plus récente (l'imputation de droit commun, décision du 20/10).
//   provision = assiette × le taux de la famille pour sa fenêtre d'ancienneté.
//
// Une créance déjà éteinte par les crédits de son compte garde une assiette
// nulle : il n'y a plus rien à couvrir, et la provision suit.
function provLigne(i){
  const k=V(i,'Clé de la créance');
  if(!k) return {base:0, prov:0};
  const rd=N(i,'Reste dû de la créance');
  const a=assiettes();
  const base=a.has(k)?a.get(k):rd;
  const tr=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
  return {base: CAC()?base:(base>0?base:0), prov: provisionDe(rd, sousVraie(i), tr, k)};
}

// La provision par ligne de synthèse, au niveau de lecture courant. Elle suit
// les compléments comme le reste : la famille vient de sousVraie() et la ligne
// de categorieDe(), qui tiennent compte des décisions prises dans la page.
function provisionParCategorie(niv){
  const m=new Map(), vues=new Set();
  for(const i of I){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const p=provisionDe(N(i,'Reste dû de la créance'), sousVraie(i),
      V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'), k);
    if(!p) continue;
    const c=categorieDe(i,niv);
    m.set(c,(m.get(c)||0)+p);
  }
  return m;
}

// Le total à provisionner, créance par créance : la même assiette et le même
// barème que provisionDe(), ventilés par famille et par dispositif. Un seul
// calcul dans la page — le bandeau, les tableaux, l'onglet et la feuille des
// règles doivent annoncer le même chiffre. En deçà de 121 jours, et pour une
// créance non échue ou sans date, rien. Un reste dû négatif — un compte
// créditeur — ne se provisionne pas : il n'y a pas de perte à couvrir.
function provisions(){
  paramsPrets();
  const fen=PROV.fenetres||[], taux=PROV.taux||{};
  const a=assiettes();
  const parFam=new Map(), parSc=new Map();
  let total=0, horsFamille=new Map();
  const vues=new Set();
  for(const i of I){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const rd=N(i,'Reste dû de la créance');
    if(CAC()? !rd : !(rd>0)) continue;
    const base=a.has(k)?a.get(k):rd;
    if(CAC()? !base : !(base>0)) continue;
    const sc=sousVraie(i);
    const tr=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
    const j=fen.findIndex(f=>(f.tranches||[]).indexOf(tr)>=0);
    if(j<0) continue;
    const fam=familleDe(sc);
    if(!fam){ horsFamille.set(sc,(horsFamille.get(sc)||0)+base); continue; }
    const t=(taux[fam]||[])[j]||0;
    const p=base*t;
    total+=p;
    parFam.set(fam,(parFam.get(fam)||0)+p);
    parSc.set(sc,(parSc.get(sc)||0)+p);
  }
  return {total, parFam, parSc, horsFamille};
}
// Les dispositifs proposés sont ceux que la balance porte déjà : une liste

// LE MAGASIN DE LA PAGE N'ACCEPTE PAS UN CLASSEUR.
//
// « Lorsque je dépose le grand livre l'artefact ne s'actualise pas, c
// normal ? », 22/10/2026. Non : le dépôt n'arrivait pas. Le magasin de
// fichiers de la page n'accepte qu'une liste fermée de types — images, PDF,
// polices, CSV, Markdown, JSON, texte — et un .xlsx n'en fait pas partie. Les
// deux classeurs du mois étaient donc refusés à chaque tentative, et un .csv
// l'était dès que le système annonçait son type autrement (Windows présente
// volontiers un .csv comme un fichier Excel) ou qu'il n'était pas en UTF-8.
//
// Les fichiers montent donc dans une enveloppe JSON, qui est un type
// accepté : le fichier y voyage en base64, octet pour octet, avec son nom et
// sa taille. Rien n'est converti, rien n'est perdu — l'enveloppe est ouverte
// à la reconstruction et le fichier d'origine en ressort tel quel.
const ENVELOPPE='json/base64';
// Le plafond du magasin est de 20 Mio, et la base64 pèse un tiers de plus que
// le fichier : 14 Mio de fichier font 19 Mio d'enveloppe. C'est donc 14 Mio
// qu'on annonce. Les fichiers du mois tiennent largement dessous — le plus
// gros des quatre, l'export Sellsy, pèse 4,5 Mo. Le grand livre complet, lui,
// peut approcher le plafond : c'est le seul à surveiller.
const DEPOT_MAX=14*1024*1024;
// Une pile d'appel ne supporte pas 4 millions d'arguments : la conversion se
// fait par tranches de 32 ko.
const enBase64=buf=>{
  const u=new Uint8Array(buf); let s='';
  for(let k=0;k<u.length;k+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(k,k+0x8000));
  return btoa(s);
};
let ASSETS=null, DEPOSES=new Map();

const fTaille=o=>o>=1048576?(o/1048576).toFixed(1).replace('.',',')+' Mo'
  :Math.max(1,Math.round(o/1024))+' ko';

async function ouvrirDepots(){
  try{ ASSETS=await claude.use('assets'); }catch(e){ ASSETS=null; }
  // Pas de canal : lecteur sans droit d'écriture, ou fichier autonome. Le bloc
  // ne s'affiche pas plutôt que d'afficher un bouton qui ne ferait rien.
  if(!ASSETS||!DB||!admin) return;
  try{
    const q=await DB.collection('depots').get();
    for(const d of q.docs) DEPOSES.set(d.id,d.data());
  }catch(e){}
  E('depot-bloc').hidden=false;
  dessinerDepots();
}

function dessinerDepots(){
  E('depot-liste').innerHTML=DEPOTS.map(d=>{
    const v=DEPOSES.get(d.cle);
    const etat=v
      ? '<span class="depot-etat2">'+esc(v.nom||'')+' · '+fTaille(v.octets||0)
        +'<br>déposé le '+esc(v.quand||'')+'</span>'
      : '<span class="depot-etat2 vide">rien de déposé</span>';
    return '<div class="depot-case">'
      +'<span class="depot-n"><b>'+esc(d.nom)+'</b><span>'+esc(d.quoi)+'</span></span>'
      +etat
      +'<label for="dep-'+d.cle+'">'+(v?'Remplacer':'Déposer')+'</label>'
      +'<input type="file" id="dep-'+d.cle+'" accept="'+d.ext.join(',')+'">'
      +'</div>';
  }).join('');
  for(const d of DEPOTS){
    const i=E('dep-'+d.cle);
    if(i) i.addEventListener('change',()=>deposer(d,i));
  }
}

async function deposer(d,input){
  const f=input.files&&input.files[0]; if(!f) return;
  const lab=document.querySelector('label[for="dep-'+d.cle+'"]');
  const dire=t=>{ E('depot-etat').textContent=t; };
  if(!d.ext.some(x=>f.name.toLowerCase().endsWith(x))){
    dire('« '+f.name+' » n’est pas un '+d.ext.join(' ou ')+' — rien n’a été déposé.');
    input.value=''; return;
  }
  if(f.size>DEPOT_MAX){
    dire('« '+f.name+' » pèse '+fTaille(f.size)+', au-delà des 14 Mo que la page accepte.');
    input.value=''; return;
  }
  if(lab){ lab.classList.add('occupe'); lab.textContent='Dépôt…'; }
  dire('');
  try{
    const enveloppe=new Blob([JSON.stringify({
      fichier:f.name, octets:f.size, type:f.type||'', base64:enBase64(await f.arrayBuffer())})],
      {type:'application/json'});
    const a=await ASSETS.upload(enveloppe,{type:'application/json'});
    const v={slot:d.cle, nom:f.name, octets:f.size, asset:a.id, enveloppe:ENVELOPPE,
             quand:new Date().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}),
             va:d.va};
    await DB.collection('depots').doc(d.cle).set(v);
    DEPOSES.set(d.cle,v);
    dire('« '+f.name+' » est déposé. Il attend la reconstruction de la balance.');
  }catch(e){
    dire('Le dépôt a échoué : '+((e&&e.message)||'raison inconnue')+'. Rien n’a été enregistré.');
  }
  input.value='';
  dessinerDepots();
}

// ───── demander une reconstruction ─────
//
// Le calcul de la balance ne se fait pas dans le navigateur : il lit quatre
// fichiers sources, applique le barème à 16 151 écritures et reprend ce que
// l'ancienne balance a appris. La page ne peut donc pas se recalculer
// elle-même. « Actualiser » enregistre la demande, horodatée et motivée ; la
// reconstruction suit, et la page est republiée avec ses données.
//
// Ce que le bouton actualise tout de suite, en revanche, c'est tout ce qui se
// calcule dans la page : les taux de provision réglés ici s'appliquent à
// l'écran sans attendre, et les tableaux se redessinent.
let DEMANDE=null;

// LES TROIS ÉTAPES D'UNE ACTUALISATION.
//
// Elles sont ce qu'elles disent, et la jauge n'avance qu'au fur et à mesure
// qu'elles s'achèvent réellement :
//   1. l'affichage de la page est refait — mesuré, de l'ordre de 70 ms sur
//      16 151 écritures ;
//   2. la demande de reconstruction est enregistrée ;
//   3. la balance est reconstruite et republiée — hors de la page : le calcul
//      lit quatre fichiers sources et reprend ce que l'ancienne balance a
//      appris.
// Une barre qui se remplirait sur une minuterie ne mesurerait rien.
const ETAPES=['Affichage actualisé','Demande transmise','Balance reconstruite'];

// LE CLIC DOIT PARTIR TOUT DE SUITE.
//
// « Je veux pouvoir actualiser quand je clique sur Actualiser, pas toutes les
// heures. » Enregistrer la demande dans la base ne prévient personne : rien
// ne lit cette base d'elle-même. Le canal qui prévient, lui, existe — c'est
// celui qu'emprunte un commentaire envoyé à Claude : la plateforme notifie
// les sessions qui suivent l'artefact, et la reconstruction part dans la
// foulée.
//
// Réservé aux personnes qui peuvent modifier l'artefact, et seulement sur un
// geste : le clic. S'il ne peut pas passer — personne à l'écoute, ou
// commentaire refusé —, la demande reste enregistrée et sera reprise au
// relevé suivant ; la page le dit plutôt que de laisser croire au départ.
let COMM=null;
