</script>
<script>
const DONNEES=JSON.parse(document.getElementById("donnees").textContent);
const E=(n)=>document.getElementById(n);
const eur=n=>(Math.round(n||0)).toLocaleString('fr-FR')+' €';
// À l'euro près : plus de « 6,67 M€ » dans les tableaux de synthèse. Un
// arrondi par cellule peut faire différer la somme des lignes du total affiché
// d'un ou deux euros ; le total, lui, reste celui du grand livre.
const eurC=n=>(n<0?'−':'')+Math.round(Math.abs(n||0)).toLocaleString('fr-FR')+' €';
let D=null, I=[], filtre=[], marques=[], sel=-1;
const col={};
// Les compléments saisis dans la page, par clé de créance.
let DB=null, peutEcrire=true;
const compl=new Map(), metaCreance=new Map(), typeDe=new Map();
// Les lignes cochées, par index. La liste est virtualisée : la sélection ne
// peut pas vivre dans le DOM, qui se refait à chaque défilement.
const selection=new Set();
// Le montant de la balance sur lequel elle a cliqué : son type ou sa
// sous-catégorie, et sa tranche. C'est un filtre à part, qui ne touche pas
// aux trois menus — ils restent disponibles par-dessus.
let zoom=null;

// ───────── l'arrêté regardé ─────────
//
// « j'aimerais pv télécharger une balance agé à date (dc pas tt la balance
//   agé, par exemple balance agé jusqu'au 30 sept) », 23/10/2026.
//
// ARRÊTER N'EST PAS FILTRER. Masquer les écritures postérieures laisserait le
// reste dû tel qu'il a été calculé aujourd'hui : l'imputation des règlements
// — lettrage, rapprochement, répartition au prorata — a été faite avec les
// paiements d'octobre sous les yeux. On obtiendrait une balance qui ressemble
// au 30 septembre sans en être une, et qui ne se justifierait devant personne.
//
// La page ne recalcule donc RIEN. Chaque date proposée est une balance refaite
// de bout en bout par la chaîne à cette date — même code, mêmes contrôles —
// et servie dans son propre fichier. Changer de date recharge la page dessus :
// le ruban, la synthèse, le détail et le téléchargement en découlent tous,
// sans qu'aucun d'eux ait à savoir qu'on a changé d'arrêté.
//
// Le fichier autonome porte ses données en lui et ne peut pas en charger
// d'autres : la liste y reste vide, et le choix ne s'affiche pas.
let ARRETES={};
const ARRETE_VU=(()=>{ try{
  return new URLSearchParams(location.search).get('arrete')||''; }catch(e){ return ''; } })();
const FICHIER_DONNEES=()=>
  (ARRETE_VU && ARRETES[ARRETE_VU]) ? 'arretes/balance-'+ARRETE_VU+'.json' : 'balance.json';
// L'empreinte vérifie que la page a reçu LES données qu'elle attend. Chaque
// arrêté porte la sienne : sans cela, charger le 30 septembre déclencherait
// l'alerte « les données ne sont pas celles de cette page » à chaque fois.
const SIGNATURE_ATTENDUE=()=>
  (ARRETE_VU && ARRETES[ARRETE_VU]) ? ARRETES[ARRETE_VU] : null;

// Le nom du classeur porte son arrêté : deux fichiers de même nom dans un
// dossier de téléchargements ne se distinguent plus une heure après.
function nomClasseur(base){
  return ARRETE_VU && ARRETES[ARRETE_VU]
    ? base.replace(/\.xlsx$/,'-'+ARRETE_VU+'.xlsx') : base;
}

// Changer d'arrêté recharge la page dessus. C'est le chemin le plus sûr : tout
// ce que la page montre et exporte vient de D, et une page rechargée ne peut
// pas se retrouver à moitié sur une date et à moitié sur l'autre.
function partirVers(d,telecharger){
  const u=new URL(location.href);
  if(d) u.searchParams.set('arrete',d); else u.searchParams.delete('arrete');
  if(telecharger) u.searchParams.set('telecharger','1'); else u.searchParams.delete('telecharger');
  location.href=u.toString();
}

// La fenêtre du téléchargement. Elle ne propose que ce qui est à l'écran :
// l'arrêté choisi au-dessus, et rien d'autre.
function ouvrirPop(){
  const p=E('pop-telech'); if(!p) return;
  const d=E('pop-date');
  if(d) d.textContent = (ARRETE_VU && ARRETES[ARRETE_VU]) ? ARRETES[ARRETE_VU].a : D.arrete;
  E('dl-note').textContent='';
  p.hidden=false;
}
function fermerPop(){ const p=E('pop-telech'); if(p) p.hidden=true; }

function choisirArrete(telecharger){
  const sel=E('arrete-select'), note=t=>{ E('arrete-note').textContent=t; };
  const v=sel.value;
  if(v==='libre'){
    const d=E('arrete-date').value;
    if(!d){ note('Choisissez une date.'); return; }
    if(ARRETES[d]) return partirVers(d,telecharger);
    return demanderArrete(d);
  }
  // Déjà sur l'arrêté demandé : rien à recharger.
  if((v||'')===(ARRETE_VU||'')){
    E('arrete').hidden=true;
    if(telecharger) envoyer('dl-xlsx', nomClasseur('Balance-agee-clients.xlsx'),
                            I, 'toutes les colonnes', 'Détail ligne à ligne');
    return;
  }
  partirVers(v,telecharger);
}

function brancherArrete(){
  const bloc=E('arrete'); if(!bloc) return;
  // La ligne du haut est la seule, et elle s'affiche toujours : c'est par elle
  // qu'on choisit ce que la page montre. Seul le bouton « Télécharger » attend
  // que le canal du cadre existe — sans lui, il ne ferait rien.
  bloc.hidden=false;
  const dates=Object.keys(ARRETES).sort().reverse();
  const sel=E('arrete-select');
  const opt=(v,t,c)=>{ const o=document.createElement('option');
    o.value=v; o.textContent=t; o.selected=!!c; sel.appendChild(o); };
  opt('','arrêtée aujourd’hui — le grand livre déposé ('+D.arrete+')',!ARRETE_VU);
  for(const d of dates)
    opt(d,'arrêtée au '+ARRETES[d].a+' — '+(ARRETES[d].n||0).toLocaleString('fr-FR')+' écritures',
        d===ARRETE_VU);
  opt('libre','à une date précise…');
  // CHOISIR UNE DATE CHANGE L'ÉCRAN, SANS ATTENDRE LE TÉLÉCHARGEMENT.
  //
  // « Qd je met ça je vois pas direct à l'ecran la balance agé », 27/10/2026.
  // Le menu ne préparait qu'un téléchargement : il fallait un second bouton
  // pour regarder. Il n'y en a plus — la page bascule sur l'arrêté dès qu'il
  // est choisi, et « Télécharger » prend alors ce qui est sous les yeux.
  sel.addEventListener('change',()=>{
    E('arrete-note').textContent='';
    if(sel.value==='libre'){ E('arrete-date').hidden=false; return; }
    E('arrete-date').hidden=true;
    if((sel.value||'')!==(ARRETE_VU||'')) partirVers(sel.value,false);
  });
  // METTRE LA DATE SUFFIT, 12/11/2026 : « ça ne s'est pas mis à jour ».
  //
  // Le menu bascule l'écran dès qu'on choisit — c'est écrit juste au-dessus,
  // et c'est ce qu'elle avait demandé le 27/10. Le champ de date, lui,
  // n'écoutait rien : il attendait « Télécharger ». On met une date, il ne se
  // passe rien, et il n'y a aucun moyen de deviner qu'il reste un bouton à
  // cliquer. Les deux font désormais la même chose.
  E('arrete-date').addEventListener('change',()=>{
    const v=E('arrete-date').value;
    if(!v) return;
    E('arrete-note').textContent='';
    if(ARRETES[v]) return partirVers(v,false);
    demanderArrete(v);
  });
  E('arrete-ok').addEventListener('click',()=>{
    // Une date précise qu'on n'a pas ne se télécharge pas : on le dit, et la
    // fenêtre ne s'ouvre pas sur un choix qui ne mènerait nulle part.
    if(sel.value==='libre'){
      const v=E('arrete-date').value;
      if(!v){ E('arrete-note').textContent='Choisissez une date.'; return; }
      if(!ARRETES[v]) return demanderArrete(v);
      return partirVers(v,true);
    }
    ouvrirPop();
  });
  E('pop-non').addEventListener('click',fermerPop);
  E('pop-telech').addEventListener('click',(ev)=>{ if(ev.target===E('pop-telech')) fermerPop(); });
  document.addEventListener('keydown',(ev)=>{ if(ev.key==='Escape') fermerPop(); });
  if(ARRETE_VU) E('arrete-date').value=ARRETE_VU;

  // LES DEUX LIBELLÉS SONT CEUX QU'ELLE A DICTÉS, ET RIEN DE PLUS.
  //
  // « je veux que ici il y ait téléchargé tt la balance ou téléchargé la
  //   selection à l'ecran », 27/10/2026. J'y avais collé « au 30/06/2026 » :
  // les deux boutons devenaient des pavés qui passaient l'un sous l'autre et
  // mangeaient le haut de la page. La date se lit déjà sur la ligne au-dessus,
  // « arrêté au … », et dans le nom du classeur qui sort.
  if(ARRETE_VU && !ARRETES[ARRETE_VU])
    E('arrete-note').textContent='Le '+ARRETE_VU+' n’est pas arrêté : voici la balance du jour.';

  // Revenue de son propre fait : la page a été rechargée POUR télécharger.
  try{
    if(new URLSearchParams(location.search).get('telecharger')==='1'){
      const u=new URL(location.href); u.searchParams.delete('telecharger');
      history.replaceState(null,'',u.toString());
      setTimeout(()=>envoyer('dl-xlsx', nomClasseur('Balance-agee-clients.xlsx'),
                             I, 'toutes les colonnes', 'Détail ligne à ligne'), 150);
    }
  }catch(e){}
}

Promise.resolve(DONNEES).then(d=>{ D=d;
  d.cols.forEach((c,i)=>col[c]=i);
  I=d.lignes.map((_,i)=>i);
  demarrer();
}).catch(()=>{ E('sous').textContent="Les données n'ont pas pu être chargées."; });

const NON_LETTRE='(non lettré)';

// Le solde NET de chaque compte client : tout son débit moins tout son crédit,
// lettrages confondus. Un compte dont le net est négatif a reçu plus que ce que
// ses factures justifient — c'est l'excédent de trésorerie, celui qu'il faut
// rembourser ou retrouver. À ne pas confondre avec un lettrage créditeur, qui
// n'est bien souvent qu'un règlement pas encore pointé sur une facture du même
// compte.
let netCompte=null;
function soldeDuCompte(cpt){
  if(!netCompte){
    netCompte=new Map();
    for(const i of I){ const c=V(i,'N° de compte'); if(!c) continue;
      netCompte.set(c,(netCompte.get(c)||0)+N(i,'Débit')-N(i,'Crédit')); }
  }
  return netCompte.get(cpt)||0;
}
const enExcedent=cpt=>soldeDuCompte(cpt)<-0.004;
const V=(li,nom)=>D.dico[D.lignes[li][col[nom]]]||'';
const N=(li,nom)=>{const s=V(li,nom).replace(/\s| |€/g,'').replace(',','.');
  const x=parseFloat(s); return isFinite(x)?x:0;};

function demarrer(){
  // Ce que chaque créance pèse, une fois pour toutes : son reste dû, sa
  // tranche, sa sous-catégorie. C'est ce qui permet à un complément de
  // déplacer un montant d'une ligne de synthèse à l'autre, à l'euro près,
  // sans recalculer une balance que personne n'aurait auditée.
  for(const i of I){
    const sc=V(i,'Type de financement');
    if(sc && !typeDe.has(sc)) typeDe.set(sc, V(i,'Type de client')||sc);
    const k=V(i,'Clé de la créance'); if(!k || metaCreance.has(k)) continue;
    // La sous-catégorie ET la tranche de la CRÉANCE : celles que la ligne
    // affiche retombent, faute de classement, sur celui de l'écriture — une
    // créance comptée dans « À classer » s'affichait « B2C-Entreprise », et le
    // complément aurait déplacé le montant depuis une ligne qui ne le portait
    // pas. Le total serait resté juste, les deux lignes touchées, fausses.
    metaCreance.set(k,{rd:N(i,'Reste dû de la créance'),
      tr:V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'),
      sc:V(i,'Type de financement de la créance')||sc,
      // Le compteur ne suit que les factures : un complément posé sur un
      // avoir ou sur une ligne sans facture déplace son montant, pas une
      // créance. Sans cette distinction, une ligne de synthèse affichait
      // « −4 créances ».
      fac:V(i,'Nature de la créance')==='Facture'});
  }
  ruban();
  E('sous').textContent=D.source+' · arrêté au '+D.arrete+' · '
    +D.lignes.length.toLocaleString('fr-FR')+' écritures, '+(D.synthese.find(s=>s.cat==='TOTAL')||{nb:0}).nb.toLocaleString('fr-FR')+' créances';
  E('pied-src').textContent='Source : '+D.source+'. Document généré le '+D.genere+'.';

  synthese();
  brancherNiveaux();
  const cats=[...new Set(I.map(i=>V(i,'Type de financement')).filter(Boolean))].sort();
  E('fcat').innerHTML+=cats.map(c=>'<option>'+c+'</option>').join('');
  const trs=[...new Set(I.map(i=>V(i,'Tranche d’ancienneté')).filter(Boolean))];
  E('ftr').innerHTML+=trs.map(c=>'<option>'+c+'</option>').join('');
  ['q','fcat','ftr','fac','ffiab','frap'].forEach(id=>E(id).addEventListener('input',()=>appliquer()));
  for(const id of ['q','fcat','ftr','fac'])
    E(id).addEventListener('input',()=>{ if(zoom){ zoom=null; E('zoom').hidden=true; } });
  E('zoom-non').addEventListener('click',fermerZoom);
  E('lot-disp').addEventListener('change',barre);
  E('lot-ok').addEventListener('click',completerLot);
  E('lot-non').addEventListener('click',()=>{selection.clear();dessiner();barre();});
  E('coche-tout').addEventListener('change',e=>{
    const dispo=[...new Set(filtre)].filter(cochable);
    if(e.target.checked) for(const i of dispo) selection.add(i);
    else for(const i of dispo) selection.delete(i);
    dessiner(); barre(); });
  // NE PAS REDESSINER CE QUI N'A PAS CHANGÉ.
  //
  // Le défilement rappelait dessiner() à chaque événement, même quand la
  // fenêtre affichée n'avait pas bougé d'une ligne — et dessiner() réécrit
  // tout l'innerHTML. Tant que le tableau ne contenait aucun élément pouvant
  // recevoir le focus, cela ne se voyait pas. Depuis que le N° de facture est
  // une ancre, l'élément focalisé est détruit en plein vol : le focus retombe
  // sur le corps de la page, Entrée n'ouvre plus rien, et la tabulation ne
  // sort plus du tableau. Mesuré : un scroll de ZÉRO pixel suffisait.
  //
  // On ne redessine donc que lorsque la première ligne visible change. Les
  // autres appels à dessiner() — filtre, tri, sélection, fiche — passent par
  // la fonction directement et ne sont pas concernés.
  { let derniereFenetre=-1;
    E('viewport').addEventListener('scroll',()=>{
      const d=Math.max(0,Math.floor(E('viewport').scrollTop/30)-3);
      if(d===derniereFenetre) return;
      derniereFenetre=d; dessiner(); }); }
  brancherTri();
  appliquer();
  E("arrete-ok").hidden=false;
  brancherArrete();
  brancherParametres();
  parametres();
  ouvrirBase();
}

// Le ruban, redessiné à chaque complément : seule la tuile « type de
// financement à compléter »
// bouge, et c'est bien le seul chiffre qu'un complément change au total.
function ruban(){
  const t=D.synthese.find(s=>s.cat==='TOTAL')||{total:0,echu:0,nonEchu:0,nb:0,crediteur:0};
  const aC=I.filter(i=>V(i,'Type de financement : à compléter')&&!compl.has(cleLigne(i))).length;
  const tuiles=[
    ['Reste dû',eur(t.total),'solde des comptes clients'],
    ['Échu',eur(t.echu),Math.round(t.echu/t.total*100)+' % du reste dû'],
    ['Non échu',eur(t.nonEchu),'pas encore exigible'],
    // Le trop-perçu n'est plus une tuile : elle l'a retirée du tableau de bord
    // le 16/10/2026. Il reste accessible par le filtre « comptes en excédent
    // de trésorerie », qui en donne les écritures compte par compte.
  ];
  // Zéro écriture à compléter : la tuile n'a plus rien à dire et quitte le
  // tableau de bord. Ce qui a été complété se lit dans le filtre et dans la
  // colonne « Origine du classement ».
  if(aC) tuiles.push(['Type de financement : à compléter',aC.toLocaleString('fr-FR')+' écritures',
    compl.size?(compl.size.toLocaleString('fr-FR')+' complétée'+(compl.size>1?'s':'')+' par vous'):"dont on n'est pas sûr"]);
  // La provision, telle que le barème du groupe la calcule sur cette balance.
  // Tant que le rattachement des financements aux trois familles n'est pas
  // confirmé, la tuile le dit : un montant à provisionner qui repose sur une
  // supposition doit se présenter comme tel.
  const pv=provisions();
  if(pv.total) tuiles.push(['À provisionner',eur(pv.total),
    PROV.confirme
      ? Math.round(pv.total/t.total*100)+' % du reste dû'
      : 'barème appliqué, rattachement à confirmer',
    // Sa demande du 20/10/2026 : le périmètre d'imputation se lit sous le
    // pourcentage, en petit. Sans lui, deux chiffres également défendables
    // se ressemblent — 4 654 820 € au lettrage, 4 436 014 € au compte.
    //
    // Et il DIT DE QUELLE IMPUTATION il parle, 21/10/2026 : il y en a deux
    // désormais, celle du règlement sur les factures qu'il nomme, et celle-ci,
    // qui ne sert qu'à l'assiette de la provision.
    'imputation pour provision : par compte client']);
  E('ruban').innerHTML=tuiles.map(([e,v,n,bas])=>
    '<div class="tuile"><div class="etiq">'+e+'</div><div class="val">'+v+'</div>'
    +'<div class="note">'+n+'</div>'
    +(bas?'<div class="sous-note">'+bas+'</div>':'')+'</div>').join('');
}

// Un complément ne recalcule pas la balance : il déplace exactement le reste
// dû de SA créance d'une ligne de synthèse à l'autre. Le total est conservé
// par construction — ce qui sort de « À classer » entre ailleurs.
function avecComplements(rows, niveau){
  if(!compl.size) return rows;
  const out=rows.map(r=>({...r, buckets:r.buckets.slice()}));
  const par=new Map(out.map(r=>[r.cat,r]));
  const ligneNeuve=cat=>{const r={cat, total:0, echu:0, nonEchu:0, nb:0,
    buckets:D.tranches.map(()=>0)}; out.splice(out.length-1,0,r); par.set(cat,r); return r;};
  const faites=new Set();
  for(const [k,v] of compl){
    const m=metaCreance.get(k); if(!m||!m.rd||faites.has(k)) continue;
    faites.add(k);
    // Un complément se déplace au niveau où l'on lit : d'un type de client à
    // l'autre quand on lit par type de client, d'un type de financement à
    // l'autre quand on lit par financement.
    const cible=niveau==='cat'
      ? (catDuDispositif(v.dispositif)||typeDe.get(v.dispositif)||v.dispositif)
      : v.dispositif;
    const depart=niveau==='cat'
      ? (catDuDispositif(m.sc)||typeDe.get(m.sc)||m.sc)
      : m.sc;
    if(cible===depart) continue;
    const de=par.get(depart), vers=par.get(cible)||ligneNeuve(cible);
    const j=D.tranches.indexOf(m.tr);
    const bouger=(r,s)=>{ r.total+=s*m.rd; if(m.fac) r.nb+=s;
      if(m.tr==='Non échu') r.nonEchu+=s*m.rd; else r.echu+=s*m.rd;
      if(j>=0) r.buckets[j]+=s*m.rd; };
    if(de) bouger(de,-1);
    bouger(vers,1);
  }
  return out;
}

// Deux lectures du même reste dû : par type de client — B2C, Entreprise, OPCO,
// POEI, ETAT, Alternance, Interco — ou par type de financement, qui les
// détaille. Le total est le même des deux côtés ; seul le niveau de lecture
// change.
let niveau='cat';
function synthese(){
  const tr=D.tranches;
  if(!D.syntheseCat){ niveau='sous'; if(E('niveaux')) E('niveaux').hidden=true; }
  // La troisième lecture ne range pas le reste dû : elle montre comment les
  // types de financement se répartissent dans chaque type de client, pour le
  // montant à provisionner. Le tableau lui cède la place.
  const ceTitre=E('titre-synth'), bT=E('bloc-synth'), bP=E('bloc-prov');
  if(bT) bT.hidden = niveau==='prov';
  if(bP) bP.hidden = niveau!=='prov';
  if(ceTitre) ceTitre.textContent = niveau==='prov'
    ? 'Montant à provisionner' : 'Reste dû par ancienneté';
  if(niveau==='prov'){ vueProvision(); return; }
  // ENLEVER LA LIGNE SI ELLE EST À ZÉRO, 12/11/2026 : « enlève la ligne si 0 ».
  //
  // « À classer » ne sortait que si elle ne comptait AUCUNE créance en plus
  // d'être à zéro : une créance soldée y restait, et la ligne s'affichait à
  // 0 € sans rien dire. Les autres types, eux, restaient affichés à zéro par
  // principe — au motif que leur absence se lirait comme un oubli. Une ligne
  // qui ne porte aucun montant n'apprend rien ; elle sort, et elle revient
  // d'elle-même dès qu'un euro y reparaît. Le total reste toujours là.
  const sansMontant=s=>Math.abs(s.total||0)<0.005 && Math.abs(s.echu||0)<0.005
    && Math.abs(s.nonEchu||0)<0.005;
  const rows=avecComplements((niveau==='cat'?D.syntheseCat:D.synthese)||D.synthese, niveau)
    .filter(s=>s.cat==='TOTAL' || !sansMontant(s));
  let h='<thead><tr><th>'+(niveau==='cat'?'Type de client':'Type de financement')
    +'</th><th class="n">Reste dû</th><th class="n">Échu</th>'
    +'<th class="n">À provisionner</th>'
    +tr.map(x=>'<th class="n">'+x+'</th>').join('')
    +'<th class="n">Non échu</th><th class="n">Créances</th>'
    +'<th class="n">Part</th></tr></thead><tbody>';
  // Le montant à provisionner de chaque ligne, à sa demande du 16/10/2026.
  const prov=provisionParCategorie(niveau);
  const provTotal=[...prov.values()].reduce((a,b)=>a+b,0);
  // La part du NOMBRE de créances, pas du montant : sa règle, le 16/10/2026,
  // « 3 324 créances en B2C : 3 324 / 5 525 ». Le dénominateur est le total
  // affiché, compléments compris, pour que la colonne somme bien à 100 %.
  const totalNb=rows.reduce((n,s)=>s.cat==='TOTAL'?n:n+s.nb,0);
  const part=n=>!totalNb?'·':(n/totalNb*100).toLocaleString('fr-FR',
    {minimumFractionDigits:1,maximumFractionDigits:1})+' %';
  // Chaque montant porte ce qu'il faut pour retrouver ses lignes : la
  // catégorie et la tranche. Un clic ouvre le détail dessus.
  const cell=(v,cat,tr,txt)=>'<td class="n ouvrable" data-cat="'+esc(cat)+'" data-tr="'+esc(tr)
    +'" title="Voir les lignes">'+txt+'</td>';
  for(const s of rows){
    const cat=s.cat==='TOTAL'?'':s.cat;
    h+='<tr'+(s.cat==='TOTAL'?' class="total"':'')+'><td>'+s.cat+'</td>'
      +cell(s.total,cat,'',eurC(s.total))
      +cell(s.echu,cat,'(échu)',eurC(s.echu))
      +'<td class="n prov" title="Barème de provision du groupe — voir Paramètres, en bas de page">'
        +(()=>{ const v=s.cat==='TOTAL'?provTotal:(prov.get(s.cat)||0);
                return v?eurC(v):'·'; })()+'</td>'
      +s.buckets.map((b,j)=>cell(b,cat,tr[j],b?eurC(b):'·')).join('')
      +cell(s.nonEchu,cat,'(non échu)',eurC(s.nonEchu))
      +cell(s.nb,cat,'',s.nb.toLocaleString('fr-FR'))
      +'<td class="n" title="'+s.nb.toLocaleString('fr-FR')+' créances sur '
        +totalNb.toLocaleString('fr-FR')+'">'
        +(s.cat==='TOTAL'?part(totalNb):part(s.nb))+'</td></tr>';
  }
  E('synthese').innerHTML=h+'</tbody>';
  for(const td of E('synthese').querySelectorAll('td.ouvrable'))
    td.addEventListener('click',()=>ouvrir(td.dataset.cat,td.dataset.tr));
}

const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

// Ouvrir un montant de la balance : le détail ne garde que les écritures des
// créances qui le composent. Le compte rendu redonne le montant et le nombre
// de créances — s'il ne retombe pas sur la case cliquée, c'est que le filtre
// est faux, et cela doit se voir.
// Le niveau est passé explicitement depuis la vue « à provisionner », qui lit
// par type de financement quel que soit l'onglet actif. `prov` restreint aux
// créances qui portent réellement une provision : cliquer un montant à
// provisionner doit rendre les lignes qui le composent, et elles seules.
function ouvrir(cat,tr,niv,prov){
  zoom={niveau:niv||niveau, cat:cat||'', tr:tr||'', prov:!!prov};
  E('fac').value=''; E('fcat').value=''; E('ftr').value='';
  E('ffiab').value=''; E('ffiab').hidden=true;
  E('frap').value=''; E('frap').hidden=true;
  appliquer();
  E('viewport').scrollIntoView({behavior:'smooth',block:'center'});
}
function fermerZoom(){ zoom=null; appliquer(); }

// La sous-catégorie d'une créance, complément compris, et le type de client
// qui la porte.
// La catégorie à laquelle chaque dispositif appartient, telle que les règles
// livrées l'écrivent. Elle ne sert qu'à une ligne qu'elle vient de compléter à
// la main : celle-là n'a pas encore de catégorie calculée.
//
// Construite à la première demande, et non au chargement du script : D n'est
// rempli qu'une fois les données lues, et la lire trop tôt cassait le bouton
// de téléchargement sans rien dire à l'écran.
let catDeRegle=null;
const catDuDispositif=disp=>{
  if(!catDeRegle) catDeRegle=new Map(((D&&D.regles)||[]).map(r=>[r.dispositif, r.type||r.dispositif]));
  return catDeRegle.get(disp);
};
// Le type de financement de la créance, celui qui reste écrit sur chaque
// ligne. Chacun garde son nom : B2B et B2C-Entreprise ne sont pas réunis, OPCO
// et OPCO - Alternance non plus. Sa règle, le 16/10/2026 : « de fusionner
// B2C-Entreprise et B2B, j'aimerais que tu reviennes en arrière, pareil pour
// OPCO ».
const sousVraie=i=>{ const c=compl.get(cleLigne(i));
  return c?c.dispositif:(V(i,'Type de financement de la créance')||''); };
function categorieDe(i,niv){
  const sc=sousVraie(i);
  const c=compl.get(cleLigne(i));
  if(niv!=='cat') return sc;
  // Une créance porte sa propre catégorie : c'est elle qui fait foi. La
  // déduire de sa sous-catégorie rangeait les 31 créances « ETAT » sous une
  // seule des deux catégories qu'elles portent — la balance par catégorie
  // s'écartait alors de celle par sous-catégorie, sur les mêmes créances.
  if(!c){ const propre=V(i,'Type de client de la créance'); if(propre) return propre; }
  return catDuDispositif(sc)||typeDe.get(sc)||sc;
}

function brancherNiveaux(){
  for(const b of document.querySelectorAll('#niveaux button'))
    b.addEventListener('click',()=>{
      for(const x of document.querySelectorAll('#niveaux button')) x.classList.remove('actif');
      b.classList.add('actif'); niveau=b.dataset.niveau; synthese(); });
}

// ───────── trier la liste ─────────
//
// « Il faut une possibilité de trier les dates d'échéance, etc. », 22/10/2026.
// Chaque en-tête trie sa colonne : un clic croissant, deux décroissant, trois
// et l'ordre du grand livre revient — c'est lui qui fait foi, et on doit
// pouvoir y retourner.
//
// Le tri s'applique AVANT les deux vues qui regroupent (rapprochement et
// excédent) : elles rangent par couple ou par compte, et trier après les
// démonterait. Elles héritent donc de l'ordre choisi sans le contredire.
let TRI={col:'',sens:1};
const COLS_TRI={
  facture:{col:'N° de facture', type:'txt'},
  compte:{col:'N° de compte', type:'txt'},
  client:{col:'Tiers', type:'txt'},
  debit:{col:'Débit', type:'num'},
  credit:{col:'Crédit', type:'num'},
  echeance:{col:'Date d’échéance recalculée', type:'date'},
  financement:{col:'Type de financement', type:'fin'},
  // La provision n'est pas une colonne du grand livre : elle se calcule. Le
  // tri l'appelle comme les autres, et les créances sans provision — dont le
  // montant vaut zéro — passent en fin de liste dans les deux sens, comme une
  // date absente : zéro n'est pas « le plus petit », c'est « rien à couvrir ».
  prov:{col:'', type:'prov'},
};
// Une date jj/mm/aaaa se compare en nombre ; une date absente passe en
// dernier, dans les deux sens — une case vide n'est pas une date ancienne.
const JJ=/^(\d{2})\/(\d{2})\/(\d{4})$/;
function valTri(i,k){
  const d=COLS_TRI[k]; if(!d) return '';
  if(d.type==='num') return N(i,d.col);
  if(d.type==='date'){ const m=JJ.exec(String(V(i,d.col)||'').trim());
    return m?(+m[3]*10000+ +m[2]*100+ +m[1]):null; }
  // Le financement affiché est celui que la ligne MONTRE : un complément posé
  // à la main prime, comme dans la liste.
  if(d.type==='fin'){ const c=compl.get(cleLigne(i)); return (c?c.dispositif:V(i,d.col))||''; }
  if(d.type==='prov'){ const p=provLigne(i).prov; return p>0?p:null; }
  return String(V(i,d.col)||'');
}
function trier(liste){
  const k=TRI.col; if(!k||!COLS_TRI[k]) return liste;
  const num=COLS_TRI[k].type==='num'||COLS_TRI[k].type==='date'
    ||COLS_TRI[k].type==='prov';
  return liste.slice().sort((a,b)=>{
    const x=valTri(a,k), y=valTri(b,k);
    const vx=(x===null||x===''), vy=(y===null||y==='');
    if(vx&&vy) return a-b;
    if(vx) return 1;              // les vides toujours à la fin
    if(vy) return -1;
    const c=num?(x-y):String(x).localeCompare(String(y),'fr');
    return c?c*TRI.sens:(a-b);    // à égalité, l'ordre du grand livre
  });
}
function marquerTri(){
  document.querySelectorAll('.ent>div[data-tri]').forEach(d=>{
    const a=d.dataset.tri===TRI.col;
    d.classList.toggle('trie',a);
    const i=d.querySelector('i'); if(i) i.textContent=a?(TRI.sens>0?'▲':'▼'):'';
  });
}
function brancherTri(){
  document.querySelectorAll('.ent>div[data-tri]').forEach(d=>{
    d.addEventListener('click',e=>{
      if(e.target&&e.target.id==='coche-tout') return;   // la case n'est pas un tri
      const k=d.dataset.tri;
      if(TRI.col!==k) TRI={col:k,sens:1};
      else if(TRI.sens>0) TRI={col:k,sens:-1};
      else TRI={col:'',sens:1};                          // retour à l'ordre du grand livre
      marquerTri(); appliquer();
    });
  });
  marquerTri();
}

function appliquer(garderPlace){
  const q=E('q').value.trim().toLowerCase(), c=E('fcat').value, t=E('ftr').value, a=E('fac').value;
  // LE DEGRÉ DE FIABILITÉ, quand on ne regarde que les propositions.
  //
  // « Lorsque je mets seulement les propositions de rapprochement, j'aimerais
  // avoir un nouveau filtre qui apparaît avec le degré de fiabilité »,
  // 22/10/2026. Il n'a de sens que là : ailleurs la colonne est vide sur neuf
  // lignes sur dix, et un filtre qui ne garde rien n'est pas un filtre. Il
  // apparaît donc avec la vue, et se vide quand on la quitte.
  const vf=E('ffiab');
  if(a!=='rappro'){ if(!vf.hidden){ vf.hidden=true; vf.value=''; } }
  else if(vf.hidden) vf.hidden=false;
  const fi=a==='rappro'?vf.value:'';
  // UNE PROPOSITION À LA FOIS, PAR SON NUMÉRO.
  //
  // Le numéro de rapprochement est le seul lien entre la facture et le
  // règlement qu'on lui propose : le saisir ici isole le couple, et lui seul.
  // Comme le filtre de fiabilité, le champ n'existe que dans cette vue.
  const vr=E('frap');
  if(a!=='rappro'){ if(!vr.hidden){ vr.hidden=true; vr.value=''; } }
  else if(vr.hidden) vr.hidden=false;
  const nrap=a==='rappro'?vr.value.trim():'';
  // Changer de vue vide la sélection : une case cochée hors de l'écran, qu'on
  // compléterait sans la voir, serait pire que de devoir recocher.
  if(!garderPlace&&selection.size){ selection.clear(); }
  filtre=I.filter(i=>{
    // Le montant ouvert : seules les écritures des créances qui le composent.
    if(zoom){
      if(!V(i,'Clé de la créance')) return false;
      // Un lot soldé ne pèse rien dans la case cliquée : ses écritures portent
      // bien une créance et une sous-catégorie, mais un reste dû nul. Les
      // garder gonflait le compte — 5 335 créances annoncées pour 5 225.
      if(Math.abs(N(i,'Reste dû de la créance'))<0.005) return false;
      if(zoom.cat && categorieDe(i,zoom.niveau)!==zoom.cat) return false;
      const trc=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
      if(zoom.tr==='(échu)'){ if(trc==='Non échu'||!trc) return false; }
      else if(zoom.tr==='(non échu)'){ if(trc!=='Non échu') return false; }
      else if(zoom.tr && trc!==zoom.tr) return false;
      if(zoom.prov){
        const q=provisionDe(N(i,'Reste dû de la créance'),sousVraie(i),trc,
                            V(i,'Clé de la créance'));
        // EN DOCTRINE CAC, UNE CRÉANCE CRÉDITRICE COMPOSE LE MONTANT.
        // Elle y provisionne négativement : l'écarter du dépliage donnait
        // 6 259 861 € déplié sous une case de 1 168 570 €, parce que les
        // 3 005 créances négatives du financement manquaient. Ailleurs, une
        // créance créditrice ne provisionne rien et n'a rien à y faire.
        if(CAC()? !q : !(q>0)) return false;
      }
    }
    if(c && V(i,'Type de financement')!==c) return false;
    if(t && V(i,'Tranche d’ancienneté')!==t) return false;
    const ac=!!V(i,'Type de financement : à compléter') && !compl.has(cleLigne(i));
    if(a==='oui'&&!ac) return false;
    if(a==='non'&&ac) return false;
    // « Lignes non lettrées » : l'écriture ne porte aucun code de lettrage,
    // au débit comme au crédit. Les deux côtés font le même travail — une
    // facture que rien ne solde et un encaissement que rien ne rattache sont
    // les deux moitiés du même lettrage à faire. Ne montrer que le crédit, ce
    // qu'il faisait jusqu'au 14/10, cachait la facture d'en face.
    if(a==='credit'){ const L=V(i,'Let.').trim();
      if(L && L!==NON_LETTRE) return false;
      if(N(i,'Débit')<0.009 && N(i,'Crédit')<0.009) return false; }
    // Le moteur comptable a proposé une facture pour ce règlement non lettré.
    //
    // ET SEULEMENT LE RÈGLEMENT. « Comment cela se fait qu'il n'y a que des
    // montants au débit ? », 22/10/2026 : depuis que la facture d'en face
    // porte elle aussi la proposition, elle entrait dans le filtre — puis le
    // regroupement par couple, plus bas, la rajoutait une seconde fois. Chaque
    // facture apparaissait donc en double, et les quatorze factures d'un compte
    // passaient avant son premier règlement. La proposition naît sur le
    // règlement, qui est toujours au crédit : c'est lui qu'on filtre, et le
    // couple va chercher ses factures.
    if(a==='rappro'&&!(V(i,'Proposition de rapprochement')&&N(i,'Crédit')>0.009)) return false;
    // Le numéro saisi, comparé aux numéros que la ligne porte — elle peut en
    // porter plusieurs : « 3 · 4 ».
    if(nrap && !V(i,'N° de rapprochement').split('·').map(x=>x.trim()).includes(nrap))
      return false;
    // La fiabilité est portée par le RÈGLEMENT ; la facture d'en face la
    // reprend préfixée de son numéro de couple. On cherche donc le mot.
    if(fi&&!new RegExp('(^|\\W)'+fi.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\W|$)','i')
        .test(V(i,'Fiabilité du rapprochement'))) return false;
    // Toutes les écritures des comptes qui ont reçu plus qu'ils ne doivent :
    // c'est là que se trouve, ligne par ligne, l'excédent de trésorerie.
    if(a==='excedent'&&!enExcedent(V(i,'N° de compte'))) return false;
    // Les deux exceptions au barème, demandées le 16/10/2026 : le mandat de
    // prélèvement, qui annule le délai, et la refacturation après formation,
    // qui le fait courir depuis l'émission. Toutes deux sont écrites noir sur
    // blanc dans « Règle de datation appliquée » : le filtre n'invente rien, il lit.
    // Le filtre lit le MOTIF, pas une étiquette figée : les deux libellés ont
    // été réécrits le 20/10/2026 (« Exception · mandat de prélèvement
    // GoCardless », « Exception · facture émise après la fin de formation ») et
    // les deux filtres ne gardaient plus rien — 1 335 écritures devenues
    // inatteignables sans qu'un écran vide ne se distingue d'un écran sans
    // résultat. On compare désormais sur ce qui ne bouge pas.
    if(a==='mandat'&&!/mandat de pr/i.test(V(i,'Règle de datation appliquée'))) return false;
    if(a==='posterieure'&&!/post[ée]rieure|apr[èe]s la fin/i.test(V(i,'Règle de datation appliquée'))) return false;
    if(q){ const s=(V(i,'N° de facture')+' '+V(i,'Tiers')+' '+V(i,'N° de compte')+' '
        +V(i,'Libellé de compte')+' '+V(i,'Libellé de ligne')).toLowerCase();
      if(!s.includes(q)) return false; }
    return true;
  });
  // Le tri choisi s'applique ici, avant tout regroupement.
  filtre=trier(filtre);
  // Une proposition ne se juge pas sur le seul règlement : on affiche le
  // couple — la facture au débit, puis le règlement au crédit qui la
  // solderait. Les deux lignes portent le même numéro de rapprochement.
  marques=filtre.map(()=>'');
  let nbProp=0, nbCpt=0, mtCpt=0;
  if(a==='rappro'){
    const ix=indexRappro(), out=[], mk=[];
    for(const i of filtre){
      nbProp++;
      for(const n of V(i,'N° de rapprochement').split('·')){
        const e=ix.get(n.trim()); if(!e) continue;
        for(const j of e.deb){ out.push(j); mk.push('facture'); }
      }
      out.push(i); mk.push('couple');
    }
    filtre=out; marques=mk;
  }
  // L'excédent se lit par CLIENT : on range les écritures compte par compte,
  // du plus gros excédent au plus petit, et on sépare chaque compte du
  // suivant. Une liste à plat mélangerait les 213 comptes et ne dirait pas
  // lequel pèse combien.
  if(a==='excedent'){
    const par=new Map();
    for(const i of filtre){ const c=V(i,'N° de compte');
      if(!par.has(c)) par.set(c,[]); par.get(c).push(i); }
    const ordre=[...par.keys()].sort((x,y)=>soldeDuCompte(x)-soldeDuCompte(y));
    const out=[], mk=[];
    for(const c of ordre){
      const l=par.get(c).sort((x,y)=>V(x,'Date')<V(y,'Date')?-1:1);
      l.forEach((i,n)=>{ out.push(i); mk.push(n===l.length-1?'couple':''); });
    }
    filtre=out; marques=mk;
    nbCpt=ordre.length; mtCpt=ordre.reduce((s,c)=>s+soldeDuCompte(c),0);
  }
  let d=0,cr=0; const vus=new Set();
  for(const i of filtre){ if(vus.has(i)) continue; vus.add(i); d+=N(i,'Débit'); cr+=N(i,'Crédit'); }
  // Le débit ET le crédit, pas leur différence. Sa question du 16/10/2026 :
  // « 2 711 écritures · 258 833 €, cela veut dire que ce montant est au
  // crédit ? » — un solde net ne dit pas de quoi il est fait, et un net
  // négatif se lisait comme un crédit pur.
  const deuxSens=d.toLocaleString('fr-FR',{maximumFractionDigits:0})+' € au débit · '
    +cr.toLocaleString('fr-FR',{maximumFractionDigits:0})+' € au crédit · solde '+eur(d-cr);
  E('cpt').textContent=(a==='rappro'
    ? nbProp.toLocaleString('fr-FR')+' propositions · '+vus.size.toLocaleString('fr-FR')
      +' lignes · '+deuxSens
    : a==='excedent'
    ? nbCpt.toLocaleString('fr-FR')+' comptes · excédent '+eurC(mtCpt)+' · '
      +filtre.length.toLocaleString('fr-FR')+' écritures · '+deuxSens
    : filtre.length.toLocaleString('fr-FR')+' écritures · '+deuxSens);
  // Ce que pèsent les créances ouvertes : la somme doit retomber sur la case
  // cliquée, sans quoi le rapprochement entre la synthèse et le détail est faux.
  E('zoom').hidden=!zoom;
  if(zoom){
    const vues=new Set(); let euros=0, prov=0;
    for(const i of filtre){ const k=V(i,'Clé de la créance');
      if(!k||vues.has(k)) continue; vues.add(k);
      const rd=N(i,'Reste dû de la créance'); euros+=rd;
      if(zoom.prov) prov+=provisionDe(rd,sousVraie(i),
        V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'), k); }
    E('zoom-quoi').textContent=(zoom.prov?'À provisionner · ':'')
      +(zoom.cat||'Toute la balance')
      +(zoom.tr?' · '+(zoom.tr==='(échu)'?'échu':zoom.tr==='(non échu)'?'non échu':zoom.tr):'');
    E('zoom-montant').textContent=(zoom.prov?eur(prov)+' provisionnés sur ':'')
      +eur(euros)+' · '+vues.size.toLocaleString('fr-FR')
      +(vues.size>1?' créances':' créance');
  }
  E('cale').style.height=(filtre.length*30)+'px';
  if(!garderPlace) E('viewport').scrollTop=0;
  dessiner();
  barre();
}

// Le numéro de facture, et son lien vers Pennylane quand on l'a.
//
// Le lien ne se pose QUE si la colonne porte une adresse. Les arrêtés
// construits avant elle n'ont que 55 colonnes : V() y rend la chaîne vide, et
// un <a href=""> rechargerait la page courante au lieu d'ouvrir Pennylane —
// une panne silencieuse, de celles qui ressemblent à un clic raté.
// rel="noopener" parce que target="_blank" laisse sinon la page ouverte
// atteindre window.opener.
const numFacture=i=>{
  const n=V(i,'N° de facture'); if(!n) return '·';
  const u=V(i,'Lien Pennylane');
  return u?'<a class="lien-fact" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(n)+'</a>':esc(n);
};

function dessiner(){
  const vp=E('viewport'), H=30, haut=vp.scrollTop, n=Math.ceil(vp.clientHeight/H)+6;
  const d=Math.max(0,Math.floor(haut/H)-3), f=Math.min(filtre.length,d+n);
  let h='';
  for(let k=d;k<f;k++){
    const i=filtre[k], c=compl.get(cleLigne(i)), ac=V(i,'Type de financement : à compléter')&&!c;
    h+='<div class="lig'+(sel===i?' sel':'')+(marques[k]==='couple'?' couple':'')
      +'" style="top:'+(k*H)+'px;height:'+H+'px" data-i="'+i+'" data-k="'+k+'">'
      +'<div class="mono">'+(cochable(i)
          ?'<input type="checkbox" class="coche" data-i="'+i+'"'+(selection.has(i)?' checked':'')+'>':'')
        +numFacture(i)+'</div>'
      +'<div class="mono">'+V(i,'N° de compte')+'</div>'
      +'<div>'+V(i,'Tiers')
        +(ac?' <span class="puce sig">type de financement : à compléter</span>':'')
        +(c?' <span class="puce ok">complété</span>':'')+'</div>'
      +'<div class="num">'+(N(i,'Débit')?eur(N(i,'Débit')):'')+'</div>'
      +'<div class="num">'+(N(i,'Crédit')?eur(N(i,'Crédit')):'')+'</div>'
      +'<div class="num prov">'+(provLigne(i).prov?eur(provLigne(i).prov):'·')+'</div>'
      +'<div class="mono">'+V(i,'Date d’échéance recalculée')+'</div>'
      +'<div>'+(c?c.dispositif:V(i,'Type de financement'))+'</div></div>';
  }
  // RENDRE LE FOCUS À L'ÉLÉMENT QUI L'AVAIT. Quand la fenêtre change pour de
  // bon, la réécriture détruit l'ancre focalisée : on note sur quelle ligne
  // elle était, et on le lui rend si elle est encore dessinée. Sans cela, un
  // défilement au clavier éjecte le focus hors du tableau à chaque fois.
  const avait=document.activeElement;
  const rendreA=(avait && avait.classList && avait.classList.contains('lien-fact')
    && avait.closest('.lig')) ? avait.closest('.lig').dataset.i : null;

  E('cale').innerHTML=h;
  E('cale').querySelectorAll('.lig').forEach(el=>
    el.addEventListener('click',()=>{sel=+el.dataset.i;dessiner();fiche(sel);}));
  // Le lien vers Pennylane non plus. Sans cela le clic remonte jusqu'à la
  // ligne, dont le gestionnaire rappelle dessiner() : l'ancre est détruite au
  // milieu de sa propre navigation, et le symptôme n'est pas « la fiche s'ouvre
  // en trop » mais « le lien ne marche pas ». stopPropagation SEULEMENT — un
  // preventDefault tuerait le lien. Ici, et pas ailleurs : le tableau est
  // virtualisé, innerHTML est réécrit à chaque défilement, et tout écouteur
  // posé hors de dessiner() disparaîtrait au premier scroll.
  E('cale').querySelectorAll('.lien-fact').forEach(a=>
    a.addEventListener('click',e=>e.stopPropagation()));
  if(rendreA!=null){
    const a=E('cale').querySelector('.lig[data-i="'+rendreA+'"] .lien-fact');
    if(a) a.focus({preventScroll:true});
  }
  // La case ne doit pas ouvrir la fiche : on arrête le clic avant la ligne.
  E('cale').querySelectorAll('.coche').forEach(c=>{
    c.addEventListener('click',e=>e.stopPropagation());
    c.addEventListener('change',()=>{ const i=+c.dataset.i;
      if(c.checked) selection.add(i); else selection.delete(i); barre(); });
  });
}

// ── Le classeur téléchargé ──
//
// Six onglets, dans l'ordre où on les lit : le sommaire, les règles, la
// balance par type de client, la même par dispositif, le montant à
// provisionner, puis le détail. Les deux
// synthèses sont celles de l'écran — vos compléments compris, et sans la ligne
// « À classer » quand elle est vide : un classeur qui contredirait la page
// qu'on vient de lire ne servirait à rien.
// Le logo, en base64 : le gabarit y met l'image, dans le fichier autonome
// comme dans l'artefact, pour que le classeur sorte signé des deux côtés.
const LOGO_XLSX='{{LOGO_B64}}';
// Les couleurs Liora, reprises du modèle de présentation.
const BLEU='FF373771', DOUX='FFE9E9F7', PALE='FFF5F4F0', ENCRE3='FF8A8AA6', TRAIT='FFE2E1EC';
const CORAIL='FFD4472A';
const EUROS='#,##0 "€";[Red]-#,##0 "€"';
// LE MÊME FORMAT, SANS LE ROUGE SUR LES NÉGATIFS, 04/11/2026 : « dans la
// balance agé liora il faut juste retirer la mise en forme conditionnelle sur
// les 3 onglets qui font que les chiffres négatifs sont en rouge ».
//
// En doctrine CAC un solde créditeur est une ligne de la balance comme une
// autre — il vieillit à sa date et provisionne négativement. Le peindre en
// rouge le donnait à lire comme une anomalie alors que c'est la doctrine. Les
// trois onglets de tableaux s'en passent donc ; le reste du classeur garde le
// rouge, qui y signale encore ce qui sort de l'ordinaire.
const EUROS_NOIR='#,##0 "€";-#,##0 "€"';
const EURO=()=>CAC()?EUROS_NOIR:EUROS;
const ENTIER='#,##0';
const MONNAIE=new Set(['Débit','Crédit','Solde','Reste dû de la créance','Montant facture',
  'Débit en devise d’origine','Crédit en devise d’origine']);

  return avecComplements((niv==='cat'?D.syntheseCat:D.synthese)||D.synthese,niv)
    .filter(s=>!(s.cat==='À classer' && !s.nb && Math.abs(s.total)<0.005));
}
// AUCUN VOLET FIGÉ, 04/11/2026 : « tu peux faire en sorte que tt les onglet
// défigé stp ? ». L'entête restait figée en haut de chaque feuille ; elle ne
// l'est plus nulle part. La feuille s'ouvre entière, et le lecteur fige ce
// qu'il veut, quand il le veut.
function poserEntete(ws,l){
  l.font={bold:true,color:{argb:'FFFFFFFF'},size:11};
  l.alignment={vertical:'middle',wrapText:true};
  l.height=26;
  l.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BLEU}};
    c.border={bottom:{style:'thin',color:{argb:TRAIT}}}; });
}
// PEINDRE UNE LIGNE ENTIÈRE, ET NON SES SEULES CELLULES REMPLIES.
//
// « les cellules ne st pas coloré de manière uniforme », 02/11/2026. La
// bibliothèque n'itère que sur les cellules QUI PORTENT UNE VALEUR : une
// ligne dont deux tranches étaient vides perdait sa couleur en plein
// milieu, et le rayage alternait par morceaux. On parcourt donc les
// colonnes de la feuille, pas les cellules de la ligne. Le nom « peindre »
// est déjà pris par l'attente d'un rendu du navigateur : celui-ci dit ce
// qu'il fait, remplir une ligne du classeur.
function remplirLigne(ws,l,couleur){
  const n=(ws.columns&&ws.columns.length)||ws.columnCount||1;
  for(let c=1;c<=n;c++)
    l.getCell(c).fill={type:'pattern',pattern:'solid',fgColor:{argb:couleur}};
}
function poserTotal(l,ws){
  l.font={bold:true};
  if(ws) remplirLigne(ws,l,DOUX);
  const n=ws?((ws.columns&&ws.columns.length)||ws.columnCount||1):0;
  if(n){ for(let c=1;c<=n;c++){ const x=l.getCell(c);
      x.border={top:{style:'thin',color:{argb:BLEU}}}; } }
  else l.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:DOUX}};
    c.border={top:{style:'thin',color:{argb:BLEU}}}; });
}

// Ce que le lecteur a sous les yeux au moment où il télécharge : sans cette
// ligne, un classeur de sélection ressemble à s'y méprendre à un classeur
// complet dont il manquerait des lignes.
function filtresEnCours(){
  const p=[];
  if(zoom) p.push((zoom.prov?'montant à provisionner ouvert : ':'montant ouvert : ')
    +(zoom.cat||'toute la balance')
    +(zoom.tr?' · '+(zoom.tr==='(échu)'?'échu':zoom.tr==='(non échu)'?'non échu':zoom.tr):''));
  const q=E('q').value.trim(); if(q) p.push('recherche « '+q+' »');
  if(E('fcat').value) p.push('type de financement : '+E('fcat').value);
  if(E('ftr').value) p.push('tranche : '+E('ftr').value);
  const a=E('fac'); if(a.value) p.push(a.options[a.selectedIndex].textContent.trim());
  return p.length?p.join('  ·  '):'aucun filtre — toute la balance';
}

// La répartition au prorata, écrite là où se lisent les autres règles.
// Un texte qui court sur toute la largeur de la feuille plutôt que de
// s'entasser dans la première colonne : sans cela une phrase de trois lignes
// devenait une cellule de douze, et la feuille n'était plus lisible.
// « Enlève-moi ce type de phrase de l'export », 22/10/2026 : les paragraphes
// qui expliquaient comment lire une feuille ou comment la méthode fonctionne
// sont partis. Il ne reste que des titres, des en-têtes et des tableaux — un
// fait se dit dans une cellule, pas dans une phrase.
// UNE BANDE DE TITRE AUSSI LARGE QUE SON TABLEAU, ET ASSEZ HAUTE POUR SON
// TEXTE, 04/11/2026 : « les cellules st mal cadré, regarde la ligne Barème
// appliqué ».
//
// Deux défauts d'un coup. La fusion s'arrêtait à la colonne 8 quelle que soit
// la largeur du tableau au-dessous : sous un récap de six colonnes, la bande
// en débordait de deux. Et la hauteur ne tenait compte que de la LONGUEUR du
// texte, jamais de sa TAILLE : « Barème appliqué » en 12 points tenait dans
// 19 points de hauteur, et ses jambages étaient coupés.
//
// La hauteur se calcule donc sur la police, et aCol dit où la bande s'arrête.
function bande(ws,texte,police,deCol,aCol){
  const d=deCol||1;
  const f=Math.max(d, aCol||8);
  const r=ws.addRow(Array(d-1).fill('').concat([texte]));
  if(f>d) ws.mergeCells(r.number,d,r.number,f);
  r.getCell(d).alignment={vertical:'middle',wrapText:true};
  if(police) r.getCell(d).font=police;
  const taille=(police&&police.size)||11;
  r.height=Math.max(22, Math.ceil(String(texte||'').length/150)*15+4,
                    Math.round(taille*1.8));
  return r;
}
