</script>
<script>
const DONNEES=JSON.parse(document.getElementById("donnees").textContent);
const E=(n)=>document.getElementById(n);
const eur=n=>(Math.round(n||0)).toLocaleString('fr-FR')+' €';
// À l'euro près : plus de « 6,67 M€ » dans les tableaux de synthèse. Un
// arrondi par cellule peut faire différer la somme des lignes du total affiché
// d'un ou deux euros ; le total, lui, reste celui du grand livre.
const eurC=n=>(n<0?'−':'')+Math.round(Math.abs(n||0)).toLocaleString('fr-FR')+' €';
let D=null, I=[], filtre=[], marques=[], sel=-1;
const col={};
// Les compléments saisis dans la page, par clé de créance.
let DB=null, peutEcrire=true;
const compl=new Map(), metaCreance=new Map(), typeDe=new Map();
// Les lignes cochées, par index. La liste est virtualisée : la sélection ne
// peut pas vivre dans le DOM, qui se refait à chaque défilement.
const selection=new Set();
// Le montant de la balance sur lequel elle a cliqué : son type ou sa
// sous-catégorie, et sa tranche. C'est un filtre à part, qui ne touche pas
// aux trois menus — ils restent disponibles par-dessus.
let zoom=null;

Promise.resolve(DONNEES).then(d=>{ D=d;
  d.cols.forEach((c,i)=>col[c]=i);
  I=d.lignes.map((_,i)=>i);
  demarrer();
}).catch(()=>{ E('sous').textContent="Les données n'ont pas pu être chargées."; });

const NON_LETTRE='(non lettré)';

// Le solde NET de chaque compte client : tout son débit moins tout son crédit,
// lettrages confondus. Un compte dont le net est négatif a reçu plus que ce que
// ses factures justifient — c'est l'excédent de trésorerie, celui qu'il faut
// rembourser ou retrouver. À ne pas confondre avec un lettrage créditeur, qui
// n'est bien souvent qu'un règlement pas encore pointé sur une facture du même
// compte.
let netCompte=null;
function soldeDuCompte(cpt){
  if(!netCompte){
    netCompte=new Map();
    for(const i of I){ const c=V(i,'N° de compte'); if(!c) continue;
      netCompte.set(c,(netCompte.get(c)||0)+N(i,'Débit')-N(i,'Crédit')); }
  }
  return netCompte.get(cpt)||0;
}
const enExcedent=cpt=>soldeDuCompte(cpt)<-0.004;
const V=(li,nom)=>D.dico[D.lignes[li][col[nom]]]||'';
const N=(li,nom)=>{const s=V(li,nom).replace(/\s| |€/g,'').replace(',','.');
  const x=parseFloat(s); return isFinite(x)?x:0;};

function demarrer(){
  // Ce que chaque créance pèse, une fois pour toutes : son reste dû, sa
  // tranche, sa sous-catégorie. C'est ce qui permet à un complément de
  // déplacer un montant d'une ligne de synthèse à l'autre, à l'euro près,
  // sans recalculer une balance que personne n'aurait auditée.
  for(const i of I){
    const sc=V(i,'Sous catégorie de type de client');
    if(sc && !typeDe.has(sc)) typeDe.set(sc, V(i,'Type de client')||sc);
    const k=V(i,'Clé de la créance'); if(!k || metaCreance.has(k)) continue;
    // La sous-catégorie ET la tranche de la CRÉANCE : celles que la ligne
    // affiche retombent, faute de classement, sur celui de l'écriture — une
    // créance comptée dans « À classer » s'affichait « B2C-Entreprise », et le
    // complément aurait déplacé le montant depuis une ligne qui ne le portait
    // pas. Le total serait resté juste, les deux lignes touchées, fausses.
    metaCreance.set(k,{rd:N(i,'Reste dû de la créance'),
      tr:V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'),
      sc:V(i,'Sous-catégorie de la créance')||sc});
  }
  ruban();
  E('sous').textContent=D.source+' · arrêté au '+D.arrete+' · '
    +D.lignes.length.toLocaleString('fr-FR')+' écritures, '+(D.synthese.find(s=>s.cat==='TOTAL')||{nb:0}).nb.toLocaleString('fr-FR')+' créances';
  E('pied-src').textContent='Source : '+D.source+'. Document généré le '+D.genere+'.';

  synthese();
  brancherNiveaux();
  const cats=[...new Set(I.map(i=>V(i,'Sous catégorie de type de client')).filter(Boolean))].sort();
  E('fcat').innerHTML+=cats.map(c=>'<option>'+c+'</option>').join('');
  const trs=[...new Set(I.map(i=>V(i,'Tranche d’ancienneté')).filter(Boolean))];
  E('ftr').innerHTML+=trs.map(c=>'<option>'+c+'</option>').join('');
  ['q','fcat','ftr','fac'].forEach(id=>E(id).addEventListener('input',()=>appliquer()));
  for(const id of ['q','fcat','ftr','fac'])
    E(id).addEventListener('input',()=>{ if(zoom){ zoom=null; E('zoom').hidden=true; } });
  E('zoom-non').addEventListener('click',fermerZoom);
  E('lot-disp').addEventListener('change',barre);
  E('lot-ok').addEventListener('click',completerLot);
  E('lot-non').addEventListener('click',()=>{selection.clear();dessiner();barre();});
  E('coche-tout').addEventListener('change',e=>{
    const dispo=[...new Set(filtre)].filter(cochable);
    if(e.target.checked) for(const i of dispo) selection.add(i);
    else for(const i of dispo) selection.delete(i);
    dessiner(); barre(); });
  E('viewport').addEventListener('scroll',dessiner);
  appliquer();
  E("telech").hidden=false;
  ouvrirBase();
}

// Le ruban, redessiné à chaque complément : seule la tuile « à compléter »
// bouge, et c'est bien le seul chiffre qu'un complément change au total.
function ruban(){
  const t=D.synthese.find(s=>s.cat==='TOTAL')||{total:0,echu:0,nonEchu:0,nb:0,crediteur:0};
  const aC=I.filter(i=>V(i,'À compléter')&&!compl.has(cleLigne(i))).length;
  const tuiles=[
    ['Reste dû',eur(t.total),'solde des comptes clients'],
    ['Échu',eur(t.echu),Math.round(t.echu/t.total*100)+' % du reste dû'],
    ['Non échu',eur(t.nonEchu),'pas encore exigible'],
    // Le trop-perçu, lu par client et non par lettrage : l'argent qu'aucune
    // facture du compte ne justifie, donc celui qu'il faut rembourser ou
    // retrouver. Le filtre « comptes en excédent de trésorerie » en donne
    // les écritures, compte par compte.
    ['Trop-perçu clients',eur((D.excedent||{}).montant||0),
      ((D.excedent||{}).comptes||0).toLocaleString('fr-FR')
      +' comptes ont reçu plus que leurs factures'],
  ];
  // Zéro écriture à compléter : la tuile n'a plus rien à dire et quitte le
  // tableau de bord. Ce qui a été complété se lit dans le filtre et dans la
  // colonne « Classé par ».
  if(aC) tuiles.push(['À compléter',aC.toLocaleString('fr-FR')+' écritures',
    compl.size?(compl.size.toLocaleString('fr-FR')+' complétée'+(compl.size>1?'s':'')+' par vous'):"dont on n'est pas sûr"]);
  E('ruban').innerHTML=tuiles.map(([e,v,n])=>
    '<div class="tuile"><div class="etiq">'+e+'</div><div class="val">'+v+'</div><div class="note">'+n+'</div></div>').join('');
}

// Un complément ne recalcule pas la balance : il déplace exactement le reste
// dû de SA créance d'une ligne de synthèse à l'autre. Le total est conservé
// par construction — ce qui sort de « À classer » entre ailleurs.
function avecComplements(rows, niveau){
  if(!compl.size) return rows;
  const out=rows.map(r=>({...r, buckets:r.buckets.slice()}));
  const par=new Map(out.map(r=>[r.cat,r]));
  const ligneNeuve=cat=>{const r={cat, total:0, echu:0, nonEchu:0, nb:0,
    buckets:D.tranches.map(()=>0)}; out.splice(out.length-1,0,r); par.set(cat,r); return r;};
  const faites=new Set();
  for(const [k,v] of compl){
    const m=metaCreance.get(k); if(!m||!m.rd||faites.has(k)) continue;
    faites.add(k);
    // Un complément doit traverser le regroupement comme n'importe quelle
    // créance : sans cela, sa décision « B2B » sur Stellantis créait une
    // quatorzième ligne « B2B » de 29 123 € à côté d'« Entreprise », alors
    // que c'est la même chose.
    const vers1=niveau==='cat'?(catDuDispositif(v.dispositif)||typeDe.get(v.dispositif)||v.dispositif)
      :(REGROUPE()[v.dispositif]||v.dispositif);
    const de1=niveau==='cat'?(catDuDispositif(m.sc)||typeDe.get(m.sc)||m.sc)
      :(REGROUPE()[m.sc]||m.sc);
    const cible=vers1, depart=de1;
    if(cible===depart) continue;
    const de=par.get(depart), vers=par.get(cible)||ligneNeuve(cible);
    const j=D.tranches.indexOf(m.tr);
    const bouger=(r,s)=>{ r.total+=s*m.rd; r.nb+=s;
      if(m.tr==='Non échu') r.nonEchu+=s*m.rd; else r.echu+=s*m.rd;
      if(j>=0) r.buckets[j]+=s*m.rd; };
    if(de) bouger(de,-1);
    bouger(vers,1);
  }
  return out;
}

// Deux lectures du même reste dû : par type de client — B2C, B2C - Entreprise,
// B2B, POEI, Alternance, Interco — ou par dispositif. Le total est le même des
// deux côtés ; seul le regroupement change.
let niveau='cat';
function synthese(){
  const tr=D.tranches;
  if(!D.syntheseCat){ niveau='sous'; if(E('niveaux')) E('niveaux').hidden=true; }
  // Une ligne « À classer » vide ne dit rien : quand il n'y a plus rien à
  // classer, elle sort du tableau — et elle revient d'elle-même si un
  // complément est retiré. Les six types de client, eux, restent affichés à
  // zéro : leur absence se lirait comme un oubli, pas comme un fait.
  const rows=avecComplements((niveau==='cat'?D.syntheseCat:D.synthese)||D.synthese, niveau)
    .filter(s=>!(s.cat==='À classer' && !s.nb && Math.abs(s.total)<0.005));
  let h='<thead><tr><th>'+(niveau==='cat'?'Type de client':'Sous-catégorie')
    +'</th><th class="n">Reste dû</th><th class="n">Échu</th>'
    +tr.map(x=>'<th class="n">'+x+'</th>').join('')
    +'<th class="n">Non échu</th><th class="n">Créances</th></tr></thead><tbody>';
  // Chaque montant porte ce qu'il faut pour retrouver ses lignes : la
  // catégorie et la tranche. Un clic ouvre le détail dessus.
  const cell=(v,cat,tr,txt)=>'<td class="n ouvrable" data-cat="'+esc(cat)+'" data-tr="'+esc(tr)
    +'" title="Voir les lignes">'+txt+'</td>';
  for(const s of rows){
    const cat=s.cat==='TOTAL'?'':s.cat;
    h+='<tr'+(s.cat==='TOTAL'?' class="total"':'')+'><td>'+s.cat+'</td>'
      +cell(s.total,cat,'',eurC(s.total))
      +cell(s.echu,cat,'(échu)',eurC(s.echu))
      +s.buckets.map((b,j)=>cell(b,cat,tr[j],b?eurC(b):'·')).join('')
      +cell(s.nonEchu,cat,'(non échu)',eurC(s.nonEchu))
      +cell(s.nb,cat,'',s.nb.toLocaleString('fr-FR'))+'</tr>';
  }
  E('synthese').innerHTML=h+'</tbody>';
  for(const td of E('synthese').querySelectorAll('td.ouvrable'))
    td.addEventListener('click',()=>ouvrir(td.dataset.cat,td.dataset.tr));
}

const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

// Ouvrir un montant de la balance : le détail ne garde que les écritures des
// créances qui le composent. Le compte rendu redonne le montant et le nombre
// de créances — s'il ne retombe pas sur la case cliquée, c'est que le filtre
// est faux, et cela doit se voir.
function ouvrir(cat,tr){
  zoom={niveau:niveau, cat:cat||'', tr:tr||''};
  E('fac').value=''; E('fcat').value=''; E('ftr').value='';
  appliquer();
  E('viewport').scrollIntoView({behavior:'smooth',block:'center'});
}
function fermerZoom(){ zoom=null; appliquer(); }

// La sous-catégorie d'une créance, complément compris, et le type de client
// qui la porte.
// La catégorie à laquelle chaque dispositif appartient, telle que les règles
// livrées l'écrivent. Elle ne sert qu'à une ligne qu'elle vient de compléter à
// la main : celle-là n'a pas encore de catégorie calculée.
//
// Construite à la première demande, et non au chargement du script : D n'est
// rempli qu'une fois les données lues, et la lire trop tôt cassait le bouton
// de téléchargement sans rien dire à l'écran.
let catDeRegle=null;
const catDuDispositif=disp=>{
  if(!catDeRegle) catDeRegle=new Map(((D&&D.regles)||[]).map(r=>[r.dispositif, r.type||r.dispositif]));
  return catDeRegle.get(disp);
};
// La sous-catégorie VRAIE de la créance, celle qui reste écrite sur chaque
// ligne. Le tableau de tête en regroupe deux paires sous « Entreprise » et
// « OPCO » ; le détail, lui, continue de les nommer.
const sousVraie=i=>{ const c=compl.get(cleLigne(i));
  return c?c.dispositif:(V(i,'Sous-catégorie de la créance')||''); };
const REGROUPE=()=>(D&&D.regroupe)||{};
function categorieDe(i,niv){
  const sc=sousVraie(i);
  const c=compl.get(cleLigne(i));
  if(niv!=='cat') return REGROUPE()[sc]||sc;
  // Une créance porte sa propre catégorie : c'est elle qui fait foi. La
  // déduire de sa sous-catégorie rangeait les 31 créances « ETAT » sous une
  // seule des deux catégories qu'elles portent — la balance par catégorie
  // s'écartait alors de celle par sous-catégorie, sur les mêmes créances.
  if(!c){ const propre=V(i,'Catégorie de la créance'); if(propre) return propre; }
  return catDuDispositif(sc)||typeDe.get(sc)||sc;
}

function brancherNiveaux(){
  for(const b of document.querySelectorAll('#niveaux button'))
    b.addEventListener('click',()=>{
      for(const x of document.querySelectorAll('#niveaux button')) x.classList.remove('actif');
      b.classList.add('actif'); niveau=b.dataset.niveau; synthese(); });
}

function appliquer(garderPlace){
  const q=E('q').value.trim().toLowerCase(), c=E('fcat').value, t=E('ftr').value, a=E('fac').value;
  // Changer de vue vide la sélection : une case cochée hors de l'écran, qu'on
  // compléterait sans la voir, serait pire que de devoir recocher.
  if(!garderPlace&&selection.size){ selection.clear(); }
  filtre=I.filter(i=>{
    // Le montant ouvert : seules les écritures des créances qui le composent.
    if(zoom){
      if(!V(i,'Clé de la créance')) return false;
      // Un lot soldé ne pèse rien dans la case cliquée : ses écritures portent
      // bien une créance et une sous-catégorie, mais un reste dû nul. Les
      // garder gonflait le compte — 5 335 créances annoncées pour 5 225.
      if(Math.abs(N(i,'Reste dû de la créance'))<0.005) return false;
      if(zoom.cat && categorieDe(i,zoom.niveau)!==zoom.cat) return false;
      const trc=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
      if(zoom.tr==='(échu)'){ if(trc==='Non échu'||!trc) return false; }
      else if(zoom.tr==='(non échu)'){ if(trc!=='Non échu') return false; }
      else if(zoom.tr && trc!==zoom.tr) return false;
    }
    if(c && V(i,'Sous catégorie de type de client')!==c) return false;
    if(t && V(i,'Tranche d’ancienneté')!==t) return false;
    const ac=!!V(i,'À compléter') && !compl.has(cleLigne(i));
    if(a==='oui'&&!ac) return false;
    if(a==='non'&&ac) return false;
    // « Lignes non lettrées » : l'écriture ne porte aucun code de lettrage,
    // au débit comme au crédit. Les deux côtés font le même travail — une
    // facture que rien ne solde et un encaissement que rien ne rattache sont
    // les deux moitiés du même lettrage à faire. Ne montrer que le crédit, ce
    // qu'il faisait jusqu'au 14/10, cachait la facture d'en face.
    if(a==='credit'){ const L=V(i,'Let.').trim();
      if(L && L!==NON_LETTRE) return false;
      if(N(i,'Débit')<0.009 && N(i,'Crédit')<0.009) return false; }
    // Le moteur comptable a proposé une facture pour ce règlement non lettré.
    if(a==='rappro'&&!V(i,'Proposition de rapprochement')) return false;
    // Toutes les écritures des comptes qui ont reçu plus qu'ils ne doivent :
    // c'est là que se trouve, ligne par ligne, l'excédent de trésorerie.
    if(a==='excedent'&&!enExcedent(V(i,'N° de compte'))) return false;
    if(q){ const s=(V(i,'N° de facture')+' '+V(i,'Tiers')+' '+V(i,'N° de compte')+' '
        +V(i,'Libellé de compte')+' '+V(i,'Libellé de ligne')).toLowerCase();
      if(!s.includes(q)) return false; }
    return true;
  });
  // Une proposition ne se juge pas sur le seul règlement : on affiche le
  // couple — la facture au débit, puis le règlement au crédit qui la
  // solderait. Les deux lignes portent le même numéro de rapprochement.
  marques=filtre.map(()=>'');
  let nbProp=0, nbCpt=0, mtCpt=0;
  if(a==='rappro'){
    const ix=indexRappro(), out=[], mk=[];
    for(const i of filtre){
      nbProp++;
      for(const n of V(i,'N° de rapprochement').split('·')){
        const e=ix.get(n.trim()); if(!e) continue;
        for(const j of e.deb){ out.push(j); mk.push('facture'); }
      }
      out.push(i); mk.push('couple');
    }
    filtre=out; marques=mk;
  }
  // L'excédent se lit par CLIENT : on range les écritures compte par compte,
  // du plus gros excédent au plus petit, et on sépare chaque compte du
  // suivant. Une liste à plat mélangerait les 213 comptes et ne dirait pas
  // lequel pèse combien.
  if(a==='excedent'){
    const par=new Map();
    for(const i of filtre){ const c=V(i,'N° de compte');
      if(!par.has(c)) par.set(c,[]); par.get(c).push(i); }
    const ordre=[...par.keys()].sort((x,y)=>soldeDuCompte(x)-soldeDuCompte(y));
    const out=[], mk=[];
    for(const c of ordre){
      const l=par.get(c).sort((x,y)=>V(x,'Date')<V(y,'Date')?-1:1);
      l.forEach((i,n)=>{ out.push(i); mk.push(n===l.length-1?'couple':''); });
    }
    filtre=out; marques=mk;
    nbCpt=ordre.length; mtCpt=ordre.reduce((s,c)=>s+soldeDuCompte(c),0);
  }
  let d=0,cr=0; const vus=new Set();
  for(const i of filtre){ if(vus.has(i)) continue; vus.add(i); d+=N(i,'Débit'); cr+=N(i,'Crédit'); }
  E('cpt').textContent=(a==='rappro'
    ? nbProp.toLocaleString('fr-FR')+' propositions · '+vus.size.toLocaleString('fr-FR')+' lignes · '+eur(d-cr)
    : a==='excedent'
    ? nbCpt.toLocaleString('fr-FR')+' comptes · excédent '+eurC(mtCpt)+' · '
      +filtre.length.toLocaleString('fr-FR')+' écritures'
    : filtre.length.toLocaleString('fr-FR')+' écritures · '+eur(d-cr));
  // Ce que pèsent les créances ouvertes : la somme doit retomber sur la case
  // cliquée, sans quoi le rapprochement entre la synthèse et le détail est faux.
  E('zoom').hidden=!zoom;
  if(zoom){
    const vues=new Set(); let euros=0;
    for(const i of filtre){ const k=V(i,'Clé de la créance');
      if(!k||vues.has(k)) continue; vues.add(k); euros+=N(i,'Reste dû de la créance'); }
    E('zoom-quoi').textContent=(zoom.cat||'Toute la balance')
      +(zoom.tr?' · '+(zoom.tr==='(échu)'?'échu':zoom.tr==='(non échu)'?'non échu':zoom.tr):'');
    E('zoom-montant').textContent=eur(euros)+' · '+vues.size.toLocaleString('fr-FR')
      +(vues.size>1?' créances':' créance');
  }
  E('cale').style.height=(filtre.length*30)+'px';
  if(!garderPlace) E('viewport').scrollTop=0;
  dessiner();
  barre();
}

function dessiner(){
  const vp=E('viewport'), H=30, haut=vp.scrollTop, n=Math.ceil(vp.clientHeight/H)+6;
  const d=Math.max(0,Math.floor(haut/H)-3), f=Math.min(filtre.length,d+n);
  let h='';
  for(let k=d;k<f;k++){
    const i=filtre[k], c=compl.get(cleLigne(i)), ac=V(i,'À compléter')&&!c;
    h+='<div class="lig'+(sel===i?' sel':'')+(marques[k]==='couple'?' couple':'')
      +'" style="top:'+(k*H)+'px;height:'+H+'px" data-i="'+i+'" data-k="'+k+'">'
      +'<div class="mono">'+(cochable(i)
          ?'<input type="checkbox" class="coche" data-i="'+i+'"'+(selection.has(i)?' checked':'')+'>':'')
        +(V(i,'N° de facture')||'·')+'</div>'
      +'<div class="mono">'+V(i,'N° de compte')+'</div>'
      +'<div>'+V(i,'Tiers')
        +(ac?' <span class="puce sig">à compléter</span>':'')
        +(c?' <span class="puce ok">complété</span>':'')+'</div>'
      +'<div class="num">'+(N(i,'Débit')?eur(N(i,'Débit')):'')+'</div>'
      +'<div class="num">'+(N(i,'Crédit')?eur(N(i,'Crédit')):'')+'</div>'
      +'<div class="mono">'+V(i,"Date d'échéance recalculée")+'</div>'
      +'<div>'+(c?c.dispositif:V(i,'Sous catégorie de type de client'))+'</div></div>';
  }
  E('cale').innerHTML=h;
  E('cale').querySelectorAll('.lig').forEach(el=>
    el.addEventListener('click',()=>{sel=+el.dataset.i;dessiner();fiche(sel);}));
  // La case ne doit pas ouvrir la fiche : on arrête le clic avant la ligne.
  E('cale').querySelectorAll('.coche').forEach(c=>{
    c.addEventListener('click',e=>e.stopPropagation());
    c.addEventListener('change',()=>{ const i=+c.dataset.i;
      if(c.checked) selection.add(i); else selection.delete(i); barre(); });
  });
}

// ── Le classeur téléchargé ──
//
// Cinq onglets, dans l'ordre où on les lit : le sommaire, les règles, la
// balance par type de client, la même par dispositif, puis le détail. Les deux
// synthèses sont celles de l'écran — vos compléments compris, et sans la ligne
// « À classer » quand elle est vide : un classeur qui contredirait la page
// qu'on vient de lire ne servirait à rien.
const BLEU='FF27496D', DOUX='FFEAF0F7', PALE='FFF6F7F9', ENCRE3='FF8B94A3', TRAIT='FFDFE3EA';
const EUROS='#,##0 "€";[Red]-#,##0 "€"';
const ENTIER='#,##0';
const MONNAIE=new Set(['Débit','Crédit','Solde','Reste dû de la créance','Montant facture',
  'Débit en devise d’origine','Crédit en devise d’origine']);
const NOMBRE=/^-?\d+(?:[.]\d+)?$/;

function synthRows(niv){
  return avecComplements((niv==='cat'?D.syntheseCat:D.synthese)||D.synthese,niv)
    .filter(s=>!(s.cat==='À classer' && !s.nb && Math.abs(s.total)<0.005));
}
function poserEntete(ws,l,figer){
  l.font={bold:true,color:{argb:'FFFFFFFF'},size:11};
  l.alignment={vertical:'middle',wrapText:true};
  l.height=26;
  l.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BLEU}};
    c.border={bottom:{style:'thin',color:{argb:TRAIT}}}; });
  if(figer!==false) ws.views=[{state:'frozen',ySplit:l.number}];
}
function poserTotal(l){
  l.font={bold:true};
  l.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:DOUX}};
    c.border={top:{style:'thin',color:{argb:BLEU}}}; });
}

// Ce que le lecteur a sous les yeux au moment où il télécharge : sans cette
// ligne, un classeur de sélection ressemble à s'y méprendre à un classeur
// complet dont il manquerait des lignes.
function filtresEnCours(){
  const p=[];
  if(zoom) p.push('montant ouvert : '+(zoom.cat||'toute la balance')
    +(zoom.tr?' · '+(zoom.tr==='(échu)'?'échu':zoom.tr==='(non échu)'?'non échu':zoom.tr):''));
  const q=E('q').value.trim(); if(q) p.push('recherche « '+q+' »');
  if(E('fcat').value) p.push('sous-catégorie : '+E('fcat').value);
  if(E('ftr').value) p.push('tranche : '+E('ftr').value);
  const a=E('fac'); if(a.value) p.push(a.options[a.selectedIndex].textContent.trim());
  return p.length?p.join('  ·  '):'aucun filtre — toute la balance';
}

  ws.addRow(['',D.source]).getCell(2).font={size:11,color:{argb:ENCRE3}};
  const dat=ws.addRow(['','Arrêté au '+D.arrete,'','Édition du '+D.genere]);
  dat.getCell(2).font={size:10,color:{argb:ENCRE3}};
  dat.getCell(4).font={size:10,color:{argb:ENCRE3}};

    s1.getCell(3).font={color:{argb:'FF9A6A12'}};
    s1.getCell(4).font={size:10,color:{argb:'FF9A6A12'}};
    s1.getCell(4).alignment={wrapText:true,vertical:'top'}; s1.height=30;
    ws.addRow(['','','','Les deux synthèses portent la balance entière.'])
      .getCell(4).font={size:10,italic:true,color:{argb:ENCRE3}};
    ws.addRow([]);
  }

  const h1=ws.addRow(['','CHIFFRES CLÉS']);
  h1.getCell(2).font={bold:true,size:11,color:{argb:BLEU}};
  for(const c of [2,3,4]) h1.getCell(c).border={bottom:{style:'thin',color:{argb:BLEU}}};
  const T=(D.syntheseCat||D.synthese).find(s=>s.cat==='TOTAL')||{};
  const X=D.excedent||{};
  for(const [k,v,fmt,n] of [
    ['Reste dû',T.total,EUROS,'Solde des comptes clients à la date d’arrêté'],

    ['Écritures',D.lignes.length,ENTIER,'Lignes du grand livre'],
  ]){
    const r=ws.addRow(['',k,v,n]);
    r.getCell(2).font={bold:true};

    r.getCell(4).font={size:10,color:{argb:ENCRE3}};
    r.height=18;
  }
  ws.addRow([]);

  const h2=ws.addRow(['','COMPOSITION DU CLASSEUR']);
  h2.getCell(2).font={bold:true,size:11,color:{argb:BLEU}};
  for(const c of [2,3,4]) h2.getCell(c).border={bottom:{style:'thin',color:{argb:BLEU}}};
  // Les onglets se numérotent d'après la liste elle-même : en retirer un ne
  // laisse plus de trou dans la numérotation, comme le « 5 » manquant qu'elle
  // a vu le 14/10.
  [['Sommaire','Chiffres clés et composition du classeur'],
   ['Règles','Ordre de détermination des échéances et barème de chaque dispositif'],
   ['Balance âgée','Reste dû par type de client et par tranche d’ancienneté. '
     +'Chaque ligne se déplie sur les comptes, puis sur leurs écritures.'],
   ['Par sous-catégorie','Même ventilation, dispositif par dispositif'],
   [nomDetail,idx.length.toLocaleString('fr-FR')+' écritures, '+D.cols.length

  pied.getCell(4).alignment={wrapText:true,vertical:'top'};
}

    +'sur la base indiquée, ou sur le repli lorsque cette base est absente.'])
    .font={color:{argb:ENCRE3},size:10};
  ws.addRow([]);
  poserEntete(ws,ws.addRow(['Sous-catégorie','Type de client','Périmètre','Base de l’échéance',
    'Délai (jours)','Repli si la base manque','Règle','Mots reconnus']));

  for(const r of (D.regles||[])){

    l.getCell(1).font={bold:true};
    l.alignment={vertical:'top',wrapText:true};
    if(z++%2) l.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PALE}};});
  }
  lexique(ws);
}

// Posé en colonne A, en bas de la feuille : à sa demande du 16/10/2026, et
// parce qu'un bloc décalé en colonne F se lit mal — on ne le voit qu'en
// faisant défiler vers la droite.
function lexique(ws){
  ws.addRow([]); ws.addRow([]);
  const t=ws.addRow(['CE QUE VEULENT DIRE LES EXPRESSIONS DES COLONNES D’AUDIT']);
  t.getCell(1).font={bold:true,size:13,color:{argb:BLEU}}; t.height=24;
  const s=ws.addRow(['Ces colonnes se lisent sur chaque ligne du détail. '
    +'Elles disent comment la ligne a été classée, et comment sa date a été obtenue.']);
  s.getCell(1).font={size:10,color:{argb:ENCRE3}};
  ws.mergeCells(s.number,1,s.number,5);
  ws.addRow([]);
  for(const [expr,quoi] of LEXIQUE){
    if(expr===null){ ws.addRow([]); continue; }
    const l=ws.addRow([expr,quoi||'']);
    if(quoi===null){
      l.getCell(1).font={bold:true,size:11,color:{argb:BLEU}};
      for(let c=1;c<=5;c++) l.getCell(c).border={bottom:{style:'thin',color:{argb:BLEU}}};
      l.height=20;
    } else {
      l.getCell(1).font={bold:true};
      l.getCell(1).alignment={wrapText:true,vertical:'top'};
      l.getCell(2).font={size:10,color:{argb:ENCRE3}};
      l.getCell(2).alignment={wrapText:true,vertical:'top'};
      ws.mergeCells(l.number,2,l.number,5);
      l.height=Math.max(28,Math.ceil(quoi.length/88)*14+14);
    }
  }
}

function feuilleBalance(wb,niv,idx){
  const nom=niv==='cat'?'Balance âgée':'Par sous-catégorie';
  const tete=niv==='cat'?'Type de client':'Sous-catégorie';
  const autre='Sous-catégorie';
  const nT=D.tranches.length;
  // Une seule colonne ajoutée à la balance : celle de l'autre lecture — la
  // sous-catégorie quand on lit par type de client, le type de client quand on
  // lit par sous-catégorie. Tout le reste — le compte, la facture, la date —
  // tient dans la première colonne, par l'indentation. Une écriture ventile son
  // montant dans les MÊMES colonnes d'ancienneté que la balance : c'est ce qui
  // permet de lire, tranche par tranche, ce qui compose un montant.
  const P={lib:0, total:1, echu:2, tranche:3, nonEchu:3+nT, nb:4+nT, ecart:5+nT, autre:6+nT};
  const LARGE=7+nT;
  const ws=wb.addWorksheet(nom);
  // Le niveau visible à l'ouverture : 1. Les comptes sont donc repliés, et
  // déplier une catégorie ne déplie PAS les écritures qu'elle contient.
  ws.properties.outlineLevelRow=1;
  ws.properties.outlineProperties={summaryBelow:false,summaryRight:false};
  ws.columns=[{width:48},{width:15},{width:15},...D.tranches.map(()=>({width:14})),
    {width:15},{width:10},{width:10},{width:30}];
  const t=ws.addRow([niv==='cat'?'RESTE DÛ PAR TYPE DE CLIENT ET PAR ANCIENNETÉ'
    :'RESTE DÛ PAR DISPOSITIF ET PAR ANCIENNETÉ']);
  t.font={bold:true,size:14,color:{argb:BLEU}}; t.height=24;
  ws.addRow(['Le « + » de la marge ouvre les comptes clients, puis leurs écritures.'])
    .font={color:{argb:ENCRE3},size:10};
  ws.addRow(['La ligne du compte fait foi. Les écritures qui s’y rattachent peuvent différer '
    +'d’une tranche à l’autre : un règlement s’impute sur une facture, le solde d’un lettrage '
    +'se répartit au prorata.'])
    .font={color:{argb:'FF9A6A12'},size:10};
  ws.addRow([]);
  const ent=new Array(LARGE).fill('');
  ent[P.lib]=tete; ent[P.total]='Restant dû'; ent[P.echu]='Échu';
  D.tranches.forEach((x,j)=>{ ent[P.tranche+j]=x; });
  ent[P.nonEchu]='Non échu'; ent[P.nb]='Créances'; ent[P.ecart]='Écart'; ent[P.autre]=autre;
  poserEntete(ws,ws.addRow(ent));
  for(let c=P.total+1;c<=P.nonEchu+1;c++) ws.getColumn(c).numFmt=EUROS;
  ws.getColumn(P.nb+1).numFmt=ENTIER; ws.getColumn(P.ecart+1).numFmt=EUROS;

  const rang=new Map(D.tranches.map((x,j)=>[x,j]));
  const info=new Map(), par=new Map();
  for(const i of idx){
    const k=V(i,'Clé de la créance'); if(!k||info.has(k)) continue;
    const rd=N(i,'Reste dû de la créance'); if(Math.abs(rd)<0.005) continue;
    info.set(k,{cat:categorieDe(i,niv), cpt:V(i,'N° de compte'), rd:rd,
      // L'autre lecture de la MÊME créance : sa sous-catégorie quand on lit
      // par type de client, son type de client quand on lit par
      // sous-catégorie. Prise sur la créance, pas sur l'écriture : les deux
      // diffèrent dès que la créance n'est pas classée.
      autre:sousVraie(i)||'',
      tr:V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté')});
  }
  for(const i of idx){
    const k=V(i,'Clé de la créance'); const e=k&&info.get(k); if(!e) continue;
    if(!par.has(e.cat)) par.set(e.cat,new Map());
    const m=par.get(e.cat);
    let g=m.get(e.cpt);
    if(!g){ g={cpt:e.cpt, client:V(i,'Libellé de compte')||V(i,'Tiers'), total:0, echu:0,
      nonEchu:0, nb:0, buckets:D.tranches.map(()=>0), lignes:[], vues:new Set(),
      autres:new Set()}; m.set(e.cpt,g); }
    g.lignes.push(i);
    if(!g.vues.has(k)){ g.vues.add(k); g.nb++; g.total+=e.rd;
      // Un compte peut porter deux dispositifs : on les nomme tous les deux
      // plutôt que d'en élire un.
      if(e.autre) g.autres.add(e.autre);
      if(e.tr==='Non échu') g.nonEchu+=e.rd;
      else { g.echu+=e.rd; if(rang.has(e.tr)) g.buckets[rang.get(e.tr)]+=e.rd; } }
  }
  const ar2=x=>Math.round(x*100)/100;
  const tri=i=>V(i,'Clé de la créance')+'|'+V(i,'Date');

  let z=0;
  for(const s of synthRows(niv)){
    const l=ws.addRow([s.cat,s.total,s.echu,...s.buckets,s.nonEchu,s.nb,
      ar2(s.total-(s.echu+s.nonEchu)),'']);
    l.getCell(1).font={bold:true};
    if(s.cat==='TOTAL'){ poserTotal(l); continue; }
    if(z++%2) l.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PALE}};});
    for(const g of [...(par.get(s.cat)||new Map()).values()].sort((a,b)=>a.cpt<b.cpt?-1:1)){
      const lr=ws.addRow(['    '+g.cpt+' - '+g.client, ar2(g.total), ar2(g.echu),
        ...g.buckets.map(ar2), ar2(g.nonEchu), g.nb, ar2(g.total-(g.echu+g.nonEchu)),
        [...g.autres].sort().join(' · ')]);
      lr.outlineLevel=1; lr.hidden=true; lr.getCell(1).font={bold:true};
      // Une ligne par ÉCRITURE du compte : son montant au débit ou au crédit,
      // posé dans la colonne d'ancienneté qui lui correspond.
      //
      // Ces lignes ne totalisent PAS toujours la ligne du compte, tranche par
      // tranche, et c'est normal : la balance répartit le solde d'un lettrage
      // entre ses factures au prorata, tandis qu'un règlement s'impute sur une
      // seule d'entre elles. La ligne du compte, au-dessus, reste la référence.
      for(const i of g.lignes.sort((a,b)=>tri(a)<tri(b)?-1:1)){
        const e=info.get(V(i,'Clé de la créance'));
        const m=ar2(N(i,'Débit')-N(i,'Crédit'));
        const r=new Array(LARGE).fill(null);
        r[P.lib]='          '+(V(i,'N° de facture')||'·')+'   '+V(i,'Date');
        r[P.total]=m;
        if(e.tr==='Non échu') r[P.nonEchu]=m;
        else { r[P.echu]=m; if(rang.has(e.tr)) r[P.tranche+rang.get(e.tr)]=m; }
        r[P.ecart]=0;
        r[P.autre]=e.autre;
        const le=ws.addRow(r); le.outlineLevel=2; le.hidden=true;
      }
    }
  }
}

// Ce qui doit arriver dans Excel comme un NOMBRE, et rien d'autre. Un numéro
// de compte n'est pas un nombre : « 4110600400000 » devenait « 4,1106E+12 »,
// illisible et impossible à rapprocher de la balance.
const NUMERIQUES=new Set([...MONNAIE,'Taux d’attribution TVA','Taux de change',
  'Nb jours échus recalculée','Délai appliqué (jours)']);

function feuilleDetail(wb,idx,nom){
  const ws=wb.addWorksheet(nom);
  // La première colonne reprend mot pour mot l'étiquette de la balance :
  // « 411C103129000 - Lorik Carrier ». Un filtre sur cette colonne donne les
  // écritures du compte qu'on vient de lire, sans rien reconstruire à la main.
  ws.columns=[{header:'Compte - Client',width:46},
    ...D.cols.map(c=>({header:c,width:Math.min(42,Math.max(13,c.length+3))}))];
  poserEntete(ws,ws.getRow(1));
  // 16 080 lignes : on écrit les valeurs d'un bloc et on ne pose la mise en
  // forme que sur les colonnes, pas sur chaque cellule — sans quoi le
  // navigateur passerait une minute à fabriquer 884 000 objets de style.
  ws.addRows(idx.map(i=>[
    V(i,'N° de compte')+' - '+(V(i,'Libellé de compte')||V(i,'Tiers')),
    ...D.cols.map(c=>{ const v=V(i,c);
      return (NUMERIQUES.has(c)&&NOMBRE.test(v))?Number(v):v; })]));
  D.cols.forEach((c,j)=>{ if(MONNAIE.has(c)) ws.getColumn(j+2).numFmt=EUROS; });
  ws.autoFilter={from:{row:1,column:1},to:{row:1,column:D.cols.length+1}};
}

async function classeur(idx,nomDetail){
  const nom=nomDetail||'Détail ligne à ligne';
  const wb=new ExcelJS.Workbook();
  wb.creator='Balance âgée Liora'; wb.created=new Date();
  // Le sommaire annonce combien de paiements l'onglet porte : on les compte
  // avant de l'écrire, puisqu'il passe en premier dans le classeur.
  feuilleSommaire(wb,idx,nom);
  feuilleRegles(wb);
  feuilleBalance(wb,'cat',idx);
  feuilleBalance(wb,'sous',idx);
  feuilleDetail(wb,idx,nom);
  return new Uint8Array(await wb.xlsx.writeBuffer());
}

// ── Le téléchargement ──
// Le visualiseur bloque les téléchargements qu'une page déclenche elle-même :
// seul le canal « downloads » en ouvre un, et le lecteur confirme. Sans lui,
// les boutons n'apparaissent pas plutôt que de ne rien faire.
const MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
// ↓ la seule ligne qui diffère entre le fichier autonome et l'artefact ↓
let remettre=async(nom,octets)=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([octets],{type:MIME}));
  a.download=nom;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);};
E('telech').hidden=false;
// ↑ la seule ligne qui diffère ↑
const envoyer=async(bouton,nom,idx,quoi,nomDetail)=>{
  if(!remettre) return;
  const b=E(bouton); b.disabled=true; E('dl-note').textContent='Préparation du classeur…';
  try{
    await remettre(nom, await classeur(idx,nomDetail));
    E('dl-note').textContent=idx.length.toLocaleString('fr-FR')+' écritures · '+quoi
      +' · 5 onglets, sommaire en tête';
  }catch(e){ E('dl-note').textContent='Le classeur n’a pas pu être écrit.'; }
  b.disabled=false;
};
E('dl-xlsx').addEventListener('click',()=>
  envoyer('dl-xlsx','Balance-agee.xlsx',I,'toutes les colonnes','Détail ligne à ligne'));
E('dl-csv').addEventListener('click',()=>
  envoyer('dl-csv','Balance-agee-selection.xlsx',filtre,'la sélection à l’écran','Sélection'));

// ───────── compléter une ligne, et s'en souvenir ─────────
// La clé d'un complément est celle de la créance dès qu'il y en a une : un
// dispositif se décide par créance, pas par écriture, et toutes les lignes de
// la créance suivent. À défaut — une écriture d'un lot soldé, qui ne pèse rien
// dans la balance — la ligne se désigne par son compte, son numéro et sa date.
const cleLigne=i=>V(i,'Clé de la créance')
  || (V(i,'N° de compte')+'|'+(V(i,'N° de facture')||V(i,'N° de pièce')||'·')+'|'+V(i,'Date'));
const idDoc=k=>k.replace(/[^A-Za-z0-9_.~:@+-]+/g,'_').slice(0,180);
const leJour=()=>new Date().toLocaleDateString('fr-FR');
// Les dispositifs proposés sont ceux que la balance porte déjà : une liste
// écrite en dur vieillirait sans prévenir.
let DISPOS=[];

// Le magasin : la base de l'artefact quand la page est publiée, le stockage du
// navigateur quand c'est le fichier autonome. La page fonctionne sans l'un ni
// l'autre — un complément est une surcouche, jamais une condition d'affichage.
async function ouvrirBase(){
  DISPOS=[...new Set(I.map(i=>V(i,'Sous catégorie de type de client'))
    .filter(c=>c&&c!=='À classer'))].sort();
  E('lot-disp').innerHTML='<option value="">Choisir…</option>'
    +DISPOS.map(d=>'<option>'+d+'</option>').join('');
  try{
    if(window.claude&&claude.use){
      DB=await claude.use('db');
      const u=await claude.use('user');
      if(u&&u.can){ const p=await u.can('data.write'); if(p===false) peutEcrire=false; }
    }
  }catch(e){ DB=null; }
  try{
    if(DB){
      const q=await DB.collection('complements').get();
      q.docs.forEach(doc=>{ const v=doc.data()||{};
        if(v&&v.cle&&v.dispositif) compl.set(v.cle,v); });
    } else {
      const brut=localStorage.getItem('rec_complements');
      if(brut) for(const v of JSON.parse(brut)) if(v&&v.cle) compl.set(v.cle,v);
    }
  }catch(e){}
  if(compl.size) rafraichir();
}

function rafraichir(){
  const y=E('viewport').scrollTop;
  ruban(); synthese(); appliquer(true);
  E('viewport').scrollTop=y;
  if(sel>=0) fiche(sel);
}

const cochable=i=>!!V(i,'À compléter') && !compl.has(cleLigne(i)) && peutEcrire;

// La barre de lot : elle dit ce qui est coché et ne s'affiche pas sans objet.
function barre(){
  const n=selection.size;
  E('lot').hidden=!n;
  if(n) E('lot-n').textContent=n.toLocaleString('fr-FR')+(n>1?' lignes sélectionnées':' ligne sélectionnée');
  E('lot-ok').disabled=!n||!E('lot-disp').value;
  const ct=E('coche-tout');
  if(ct){ const dispo=[...new Set(filtre)].filter(cochable);
    ct.hidden=!dispo.length;
    ct.checked=dispo.length>0&&dispo.every(i=>selection.has(i)); }
}

// Poser un complément sans redessiner : le lot en pose plusieurs à la suite,
// et une balance qui se recalcule entre chaque écriture clignoterait pour rien.
async function poser(v){
  compl.set(v.cle,v);
  try{
    if(DB) await DB.collection('complements').doc(idDoc(v.cle)).set(v);
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ compl.delete(v.cle); return false; }
  return true;
}

// Un dispositif, posé sur tout le lot. Plusieurs lignes peuvent appartenir à
// la même créance : on ne l'écrit qu'une fois.
async function completerLot(){
  const disp=E('lot-disp').value; if(!disp||!selection.size) return;
  const bt=E('lot-ok'), note=E('lot-note');
  bt.disabled=true;
  const parCreance=new Map();
  for(const i of selection){
    const k=cleLigne(i);
    if(!parCreance.has(k)) parCreance.set(k,{cle:k, dispositif:disp,
      compte:V(i,'N° de compte'), tiers:V(i,'Tiers'), facture:V(i,'N° de facture')||'',
      manquait:V(i,'À compléter'), quand:leJour()});
  }
  let faits=0, refus=0, n=0;
  for(const v of parCreance.values()){
    note.textContent='enregistrement '+(++n)+' / '+parCreance.size+'…';
    if(await poser(v)) faits++; else refus++;
  }
  selection.clear();
  note.textContent=faits.toLocaleString('fr-FR')+(faits>1?' créances complétées':' créance complétée')
    +' en « '+disp+' »'+(refus?' · '+refus+' refusée'+(refus>1?'s':''):'');
  rafraichir(); barre();
  bt.disabled=false;
}

async function enregistrer(v){
  compl.set(v.cle,v);
  let ok=true;
  try{
    if(DB) await DB.collection('complements').doc(idDoc(v.cle)).set(v);
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ ok=false; compl.delete(v.cle); }
  rafraichir();
  return ok;
}

async function effacer(cle){
  const v=compl.get(cle); if(!v) return;
  compl.delete(cle);
  try{
    if(DB) await DB.collection('complements').doc(idDoc(cle)).delete();
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ compl.set(cle,v); }
  rafraichir();
}

// L'index des rapprochements : chaque numéro, ses lignes au débit — la ou les
// factures proposées — et sa ligne au crédit, le règlement.
let rapIdx=null;
function indexRappro(){
  if(rapIdx) return rapIdx;
  rapIdx=new Map();
  for(const i of I){
    const s=V(i,'N° de rapprochement'); if(!s) continue;
    const ou=N(i,'Débit')>0.009?'deb':'cre';
    for(const n of s.split('·')){ const k=n.trim(); if(!k) continue;
      let e=rapIdx.get(k); if(!e){ e={deb:[],cre:[]}; rapIdx.set(k,e); }
      e[ou].push(i); }
  }
  return rapIdx;
}

function fiche(i){
  const g=n=>V(i,n), k=cleLigne(i), c=compl.get(k), ac=g('À compléter')&&!c;
  const cal=g('Calcul'), m=metaCreance.get(g('Clé de la créance'));
  let h='<div class="fiche-tete"><span class="ref">'+(g('N° de facture')||'écriture sans numéro')+'</span>'
    +'<span>'+g('Tiers')+'</span>'
    +'<span class="puce'+(ac?' sig':' ok')+'">'
    +(c?'complété':(ac||'justifiée'))+'</span></div>';
  // Ce qu'il manque se complète ici même : le dispositif choisi déplace
  // aussitôt le reste dû de la créance dans la balance, et il est gardé.
  if(ac||c){
    h+='<div class="compl'+(c?' fait':'')+'">';
    if(c){
      h+='<span class="etat"><strong>'+c.dispositif+'</strong> — complété le '+c.quand
        +(m&&m.rd?' · '+eur(m.rd)+' déplacés de « '+(m.sc||'À classer')+' » vers « '+c.dispositif+' »':'')
        +'</span><button type="button" class="plat" id="c-annul">Revenir en arrière</button>';
    } else if(peutEcrire){
      h+='<label for="c-disp">Dispositif</label>'
        +'<select id="c-disp"><option value="">Choisir…</option>'
        +DISPOS.map(d=>'<option>'+d+'</option>').join('')+'</select>'
        +'<button type="button" id="c-ok" disabled>Enregistrer</button>'
        +'<span class="etat" id="c-note">'
        +(m&&m.rd?eur(m.rd)+' quitteront « '+(m.sc||'À classer')+' »'
                :'cette écriture ne pèse rien dans la balance : seul son classement change')
        +'</span>';
    } else {
      h+='<span class="etat">Lecture seule : les compléments ne peuvent pas être enregistrés depuis cette vue.</span>';
    }
    h+='</div>';
  }
  if(cal) h+='<p class="calcul">'+cal
    +(g('Motif particulier')?'<br><span style="color:var(--encre-2)">motif : '+g('Motif particulier')+'</span>':'')
    +(g('Pourquoi pas le barème')?'<br><span style="color:var(--encre-2)">'+g('Pourquoi pas le barème')+'</span>':'')
    +'</p>';
  h+='<div class="champs">';
  for(const nom of D.cols){
    const v=g(nom); if(!v) continue;
    h+='<div class="champ"><dt>'+nom+'</dt><dd>'+v+'</dd></div>';
  }
  E('fiche').innerHTML=h+'</div>';
  const sl=E('c-disp'), bt=E('c-ok');
  if(sl&&bt){
    sl.addEventListener('change',()=>{ bt.disabled=!sl.value; });
    bt.addEventListener('click',async()=>{
      if(!sl.value) return; bt.disabled=true;
      const ok=await enregistrer({cle:k, dispositif:sl.value, compte:g('N° de compte'),
        tiers:g('Tiers'), facture:g('N° de facture')||'', manquait:g('À compléter'),
        quand:leJour()});
      if(!ok){ const n=E('c-note');
        if(n) n.textContent='Enregistrement refusé — rien n’a été gardé.';
        bt.disabled=false; }
    });
  }
  const an=E('c-annul'); if(an) an.addEventListener('click',()=>effacer(k));
  E('fiche').scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
