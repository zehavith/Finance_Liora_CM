</script>
<script>
const DONNEES=JSON.parse(document.getElementById("donnees").textContent);
const E=(n)=>document.getElementById(n);
const eur=n=>(Math.round(n||0)).toLocaleString('fr-FR')+' €';
// À l'euro près : plus de « 6,67 M€ » dans les tableaux de synthèse. Un
// arrondi par cellule peut faire différer la somme des lignes du total affiché
// d'un ou deux euros ; le total, lui, reste celui du grand livre.
const eurC=n=>(n<0?'−':'')+Math.round(Math.abs(n||0)).toLocaleString('fr-FR')+' €';
let D=null, I=[], filtre=[], marques=[], sel=-1;
const col={};
// Les compléments saisis dans la page, par clé de créance.
let DB=null, peutEcrire=true;
const compl=new Map(), metaCreance=new Map(), typeDe=new Map();
// Les lignes cochées, par index. La liste est virtualisée : la sélection ne
// peut pas vivre dans le DOM, qui se refait à chaque défilement.
const selection=new Set();
// Le montant de la balance sur lequel elle a cliqué : son type ou sa
// sous-catégorie, et sa tranche. C'est un filtre à part, qui ne touche pas
// aux trois menus — ils restent disponibles par-dessus.
let zoom=null;

Promise.resolve(DONNEES).then(d=>{ D=d;
  d.cols.forEach((c,i)=>col[c]=i);
  I=d.lignes.map((_,i)=>i);
  demarrer();
}).catch(()=>{ E('sous').textContent="Les données n'ont pas pu être chargées."; });

const NON_LETTRE='(non lettré)';

// Le solde NET de chaque compte client : tout son débit moins tout son crédit,
// lettrages confondus. Un compte dont le net est négatif a reçu plus que ce que
// ses factures justifient — c'est l'excédent de trésorerie, celui qu'il faut
// rembourser ou retrouver. À ne pas confondre avec un lettrage créditeur, qui
// n'est bien souvent qu'un règlement pas encore pointé sur une facture du même
// compte.
let netCompte=null;
function soldeDuCompte(cpt){
  if(!netCompte){
    netCompte=new Map();
    for(const i of I){ const c=V(i,'N° de compte'); if(!c) continue;
      netCompte.set(c,(netCompte.get(c)||0)+N(i,'Débit')-N(i,'Crédit')); }
  }
  return netCompte.get(cpt)||0;
}
const enExcedent=cpt=>soldeDuCompte(cpt)<-0.004;
const V=(li,nom)=>D.dico[D.lignes[li][col[nom]]]||'';
const N=(li,nom)=>{const s=V(li,nom).replace(/\s| |€/g,'').replace(',','.');
  const x=parseFloat(s); return isFinite(x)?x:0;};

function demarrer(){
  // Ce que chaque créance pèse, une fois pour toutes : son reste dû, sa
  // tranche, sa sous-catégorie. C'est ce qui permet à un complément de
  // déplacer un montant d'une ligne de synthèse à l'autre, à l'euro près,
  // sans recalculer une balance que personne n'aurait auditée.
  for(const i of I){
    const sc=V(i,'Type de financement');
    if(sc && !typeDe.has(sc)) typeDe.set(sc, V(i,'Type de client')||sc);
    const k=V(i,'Clé de la créance'); if(!k || metaCreance.has(k)) continue;
    // La sous-catégorie ET la tranche de la CRÉANCE : celles que la ligne
    // affiche retombent, faute de classement, sur celui de l'écriture — une
    // créance comptée dans « À classer » s'affichait « B2C-Entreprise », et le
    // complément aurait déplacé le montant depuis une ligne qui ne le portait
    // pas. Le total serait resté juste, les deux lignes touchées, fausses.
    metaCreance.set(k,{rd:N(i,'Reste dû de la créance'),
      tr:V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'),
      sc:V(i,'Type de financement de la créance')||sc,
      // Le compteur ne suit que les factures : un complément posé sur un
      // avoir ou sur une ligne sans facture déplace son montant, pas une
      // créance. Sans cette distinction, une ligne de synthèse affichait
      // « −4 créances ».
      fac:V(i,'Nature de la créance')==='Facture'});
  }
  ruban();
  E('sous').textContent=D.source+' · arrêté au '+D.arrete+' · '
    +D.lignes.length.toLocaleString('fr-FR')+' écritures, '+(D.synthese.find(s=>s.cat==='TOTAL')||{nb:0}).nb.toLocaleString('fr-FR')+' créances';
  E('pied-src').textContent='Source : '+D.source+'. Document généré le '+D.genere+'.';

  synthese();
  brancherNiveaux();
  const cats=[...new Set(I.map(i=>V(i,'Type de financement')).filter(Boolean))].sort();
  E('fcat').innerHTML+=cats.map(c=>'<option>'+c+'</option>').join('');
  const trs=[...new Set(I.map(i=>V(i,'Tranche d’ancienneté')).filter(Boolean))];
  E('ftr').innerHTML+=trs.map(c=>'<option>'+c+'</option>').join('');
  ['q','fcat','ftr','fac','ffiab','frap'].forEach(id=>E(id).addEventListener('input',()=>appliquer()));
  for(const id of ['q','fcat','ftr','fac'])
    E(id).addEventListener('input',()=>{ if(zoom){ zoom=null; E('zoom').hidden=true; } });
  E('zoom-non').addEventListener('click',fermerZoom);
  E('lot-disp').addEventListener('change',barre);
  E('lot-ok').addEventListener('click',completerLot);
  E('lot-non').addEventListener('click',()=>{selection.clear();dessiner();barre();});
  E('coche-tout').addEventListener('change',e=>{
    const dispo=[...new Set(filtre)].filter(cochable);
    if(e.target.checked) for(const i of dispo) selection.add(i);
    else for(const i of dispo) selection.delete(i);
    dessiner(); barre(); });
  E('viewport').addEventListener('scroll',dessiner);
  brancherTri();
  appliquer();
  E("telech").hidden=false;
  brancherParametres();
  parametres();
  ouvrirBase();
}

// Le ruban, redessiné à chaque complément : seule la tuile « type de
// financement à compléter »
// bouge, et c'est bien le seul chiffre qu'un complément change au total.
function ruban(){
  const t=D.synthese.find(s=>s.cat==='TOTAL')||{total:0,echu:0,nonEchu:0,nb:0,crediteur:0};
  const aC=I.filter(i=>V(i,'Type de financement : à compléter')&&!compl.has(cleLigne(i))).length;
  const tuiles=[
    ['Reste dû',eur(t.total),'solde des comptes clients'],
    ['Échu',eur(t.echu),Math.round(t.echu/t.total*100)+' % du reste dû'],
    ['Non échu',eur(t.nonEchu),'pas encore exigible'],
    // Le trop-perçu n'est plus une tuile : elle l'a retirée du tableau de bord
    // le 16/10/2026. Il reste accessible par le filtre « comptes en excédent
    // de trésorerie », qui en donne les écritures compte par compte.
  ];
  // Zéro écriture à compléter : la tuile n'a plus rien à dire et quitte le
  // tableau de bord. Ce qui a été complété se lit dans le filtre et dans la
  // colonne « Origine du classement ».
  if(aC) tuiles.push(['Type de financement : à compléter',aC.toLocaleString('fr-FR')+' écritures',
    compl.size?(compl.size.toLocaleString('fr-FR')+' complétée'+(compl.size>1?'s':'')+' par vous'):"dont on n'est pas sûr"]);
  // La provision, telle que le barème du groupe la calcule sur cette balance.
  // Tant que le rattachement des financements aux trois familles n'est pas
  // confirmé, la tuile le dit : un montant à provisionner qui repose sur une
  // supposition doit se présenter comme tel.
  const pv=provisions();
  if(pv.total) tuiles.push(['À provisionner',eur(pv.total),
    PROV.confirme
      ? Math.round(pv.total/t.total*100)+' % du reste dû'
      : 'barème appliqué, rattachement à confirmer',
    // Sa demande du 20/10/2026 : le périmètre d'imputation se lit sous le
    // pourcentage, en petit. Sans lui, deux chiffres également défendables
    // se ressemblent — 4 654 820 € au lettrage, 4 436 014 € au compte.
    //
    // Et il DIT DE QUELLE IMPUTATION il parle, 21/10/2026 : il y en a deux
    // désormais, celle du règlement sur les factures qu'il nomme, et celle-ci,
    // qui ne sert qu'à l'assiette de la provision.
    'imputation pour provision : par compte client']);
  E('ruban').innerHTML=tuiles.map(([e,v,n,bas])=>
    '<div class="tuile"><div class="etiq">'+e+'</div><div class="val">'+v+'</div>'
    +'<div class="note">'+n+'</div>'
    +(bas?'<div class="sous-note">'+bas+'</div>':'')+'</div>').join('');
}

// Un complément ne recalcule pas la balance : il déplace exactement le reste
// dû de SA créance d'une ligne de synthèse à l'autre. Le total est conservé
// par construction — ce qui sort de « À classer » entre ailleurs.
function avecComplements(rows, niveau){
  if(!compl.size) return rows;
  const out=rows.map(r=>({...r, buckets:r.buckets.slice()}));
  const par=new Map(out.map(r=>[r.cat,r]));
  const ligneNeuve=cat=>{const r={cat, total:0, echu:0, nonEchu:0, nb:0,
    buckets:D.tranches.map(()=>0)}; out.splice(out.length-1,0,r); par.set(cat,r); return r;};
  const faites=new Set();
  for(const [k,v] of compl){
    const m=metaCreance.get(k); if(!m||!m.rd||faites.has(k)) continue;
    faites.add(k);
    // Un complément se déplace au niveau où l'on lit : d'un type de client à
    // l'autre quand on lit par type de client, d'un type de financement à
    // l'autre quand on lit par financement.
    const cible=niveau==='cat'
      ? (catDuDispositif(v.dispositif)||typeDe.get(v.dispositif)||v.dispositif)
      : v.dispositif;
    const depart=niveau==='cat'
      ? (catDuDispositif(m.sc)||typeDe.get(m.sc)||m.sc)
      : m.sc;
    if(cible===depart) continue;
    const de=par.get(depart), vers=par.get(cible)||ligneNeuve(cible);
    const j=D.tranches.indexOf(m.tr);
    const bouger=(r,s)=>{ r.total+=s*m.rd; if(m.fac) r.nb+=s;
      if(m.tr==='Non échu') r.nonEchu+=s*m.rd; else r.echu+=s*m.rd;
      if(j>=0) r.buckets[j]+=s*m.rd; };
    if(de) bouger(de,-1);
    bouger(vers,1);
  }
  return out;
}

// Deux lectures du même reste dû : par type de client — B2C, Entreprise, OPCO,
// POEI, ETAT, Alternance, Interco — ou par type de financement, qui les
// détaille. Le total est le même des deux côtés ; seul le niveau de lecture
// change.
let niveau='cat';
function synthese(){
  const tr=D.tranches;
  if(!D.syntheseCat){ niveau='sous'; if(E('niveaux')) E('niveaux').hidden=true; }
  // La troisième lecture ne range pas le reste dû : elle montre comment les
  // types de financement se répartissent dans chaque type de client, pour le
  // montant à provisionner. Le tableau lui cède la place.
  const ceTitre=E('titre-synth'), bT=E('bloc-synth'), bP=E('bloc-prov');
  if(bT) bT.hidden = niveau==='prov';
  if(bP) bP.hidden = niveau!=='prov';
  if(ceTitre) ceTitre.textContent = niveau==='prov'
    ? 'Montant à provisionner' : 'Reste dû par ancienneté';
  if(niveau==='prov'){ vueProvision(); return; }
  // Une ligne « À classer » vide ne dit rien : quand il n'y a plus rien à
  // classer, elle sort du tableau — et elle revient d'elle-même si un
  // complément est retiré. Les six types de client, eux, restent affichés à
  // zéro : leur absence se lirait comme un oubli, pas comme un fait.
  const rows=avecComplements((niveau==='cat'?D.syntheseCat:D.synthese)||D.synthese, niveau)
    .filter(s=>!(s.cat==='À classer' && !s.nb && Math.abs(s.total)<0.005));
  let h='<thead><tr><th>'+(niveau==='cat'?'Type de client':'Type de financement')
    +'</th><th class="n">Reste dû</th><th class="n">Échu</th>'
    +'<th class="n">À provisionner</th>'
    +tr.map(x=>'<th class="n">'+x+'</th>').join('')
    +'<th class="n">Non échu</th><th class="n">Créances</th>'
    +'<th class="n">Part</th></tr></thead><tbody>';
  // Le montant à provisionner de chaque ligne, à sa demande du 16/10/2026.
  const prov=provisionParCategorie(niveau);
  const provTotal=[...prov.values()].reduce((a,b)=>a+b,0);
  // La part du NOMBRE de créances, pas du montant : sa règle, le 16/10/2026,
  // « 3 324 créances en B2C : 3 324 / 5 525 ». Le dénominateur est le total
  // affiché, compléments compris, pour que la colonne somme bien à 100 %.
  const totalNb=rows.reduce((n,s)=>s.cat==='TOTAL'?n:n+s.nb,0);
  const part=n=>!totalNb?'·':(n/totalNb*100).toLocaleString('fr-FR',
    {minimumFractionDigits:1,maximumFractionDigits:1})+' %';
  // Chaque montant porte ce qu'il faut pour retrouver ses lignes : la
  // catégorie et la tranche. Un clic ouvre le détail dessus.
  const cell=(v,cat,tr,txt)=>'<td class="n ouvrable" data-cat="'+esc(cat)+'" data-tr="'+esc(tr)
    +'" title="Voir les lignes">'+txt+'</td>';
  for(const s of rows){
    const cat=s.cat==='TOTAL'?'':s.cat;
    h+='<tr'+(s.cat==='TOTAL'?' class="total"':'')+'><td>'+s.cat+'</td>'
      +cell(s.total,cat,'',eurC(s.total))
      +cell(s.echu,cat,'(échu)',eurC(s.echu))
      +'<td class="n prov" title="Barème de provision du groupe — voir Paramètres, en bas de page">'
        +(()=>{ const v=s.cat==='TOTAL'?provTotal:(prov.get(s.cat)||0);
                return v?eurC(v):'·'; })()+'</td>'
      +s.buckets.map((b,j)=>cell(b,cat,tr[j],b?eurC(b):'·')).join('')
      +cell(s.nonEchu,cat,'(non échu)',eurC(s.nonEchu))
      +cell(s.nb,cat,'',s.nb.toLocaleString('fr-FR'))
      +'<td class="n" title="'+s.nb.toLocaleString('fr-FR')+' créances sur '
        +totalNb.toLocaleString('fr-FR')+'">'
        +(s.cat==='TOTAL'?part(totalNb):part(s.nb))+'</td></tr>';
  }
  E('synthese').innerHTML=h+'</tbody>';
  for(const td of E('synthese').querySelectorAll('td.ouvrable'))
    td.addEventListener('click',()=>ouvrir(td.dataset.cat,td.dataset.tr));
}

const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

// Ouvrir un montant de la balance : le détail ne garde que les écritures des
// créances qui le composent. Le compte rendu redonne le montant et le nombre
// de créances — s'il ne retombe pas sur la case cliquée, c'est que le filtre
// est faux, et cela doit se voir.
// Le niveau est passé explicitement depuis la vue « à provisionner », qui lit
// par type de financement quel que soit l'onglet actif. `prov` restreint aux
// créances qui portent réellement une provision : cliquer un montant à
// provisionner doit rendre les lignes qui le composent, et elles seules.
function ouvrir(cat,tr,niv,prov){
  zoom={niveau:niv||niveau, cat:cat||'', tr:tr||'', prov:!!prov};
  E('fac').value=''; E('fcat').value=''; E('ftr').value='';
  E('ffiab').value=''; E('ffiab').hidden=true;
  E('frap').value=''; E('frap').hidden=true;
  appliquer();
  E('viewport').scrollIntoView({behavior:'smooth',block:'center'});
}
function fermerZoom(){ zoom=null; appliquer(); }

// La sous-catégorie d'une créance, complément compris, et le type de client
// qui la porte.
// La catégorie à laquelle chaque dispositif appartient, telle que les règles
// livrées l'écrivent. Elle ne sert qu'à une ligne qu'elle vient de compléter à
// la main : celle-là n'a pas encore de catégorie calculée.
//
// Construite à la première demande, et non au chargement du script : D n'est
// rempli qu'une fois les données lues, et la lire trop tôt cassait le bouton
// de téléchargement sans rien dire à l'écran.
let catDeRegle=null;
const catDuDispositif=disp=>{
  if(!catDeRegle) catDeRegle=new Map(((D&&D.regles)||[]).map(r=>[r.dispositif, r.type||r.dispositif]));
  return catDeRegle.get(disp);
};
// Le type de financement de la créance, celui qui reste écrit sur chaque
// ligne. Chacun garde son nom : B2B et B2C-Entreprise ne sont pas réunis, OPCO
// et OPCO - Alternance non plus. Sa règle, le 16/10/2026 : « de fusionner
// B2C-Entreprise et B2B, j'aimerais que tu reviennes en arrière, pareil pour
// OPCO ».
const sousVraie=i=>{ const c=compl.get(cleLigne(i));
  return c?c.dispositif:(V(i,'Type de financement de la créance')||''); };
function categorieDe(i,niv){
  const sc=sousVraie(i);
  const c=compl.get(cleLigne(i));
  if(niv!=='cat') return sc;
  // Une créance porte sa propre catégorie : c'est elle qui fait foi. La
  // déduire de sa sous-catégorie rangeait les 31 créances « ETAT » sous une
  // seule des deux catégories qu'elles portent — la balance par catégorie
  // s'écartait alors de celle par sous-catégorie, sur les mêmes créances.
  if(!c){ const propre=V(i,'Type de client de la créance'); if(propre) return propre; }
  return catDuDispositif(sc)||typeDe.get(sc)||sc;
}

function brancherNiveaux(){
  for(const b of document.querySelectorAll('#niveaux button'))
    b.addEventListener('click',()=>{
      for(const x of document.querySelectorAll('#niveaux button')) x.classList.remove('actif');
      b.classList.add('actif'); niveau=b.dataset.niveau; synthese(); });
}

// ───────── trier la liste ─────────
//
// « Il faut une possibilité de trier les dates d'échéance, etc. », 22/10/2026.
// Chaque en-tête trie sa colonne : un clic croissant, deux décroissant, trois
// et l'ordre du grand livre revient — c'est lui qui fait foi, et on doit
// pouvoir y retourner.
//
// Le tri s'applique AVANT les deux vues qui regroupent (rapprochement et
// excédent) : elles rangent par couple ou par compte, et trier après les
// démonterait. Elles héritent donc de l'ordre choisi sans le contredire.
let TRI={col:'',sens:1};
const COLS_TRI={
  facture:{col:'N° de facture', type:'txt'},
  compte:{col:'N° de compte', type:'txt'},
  client:{col:'Tiers', type:'txt'},
  debit:{col:'Débit', type:'num'},
  credit:{col:'Crédit', type:'num'},
  echeance:{col:'Date d’échéance recalculée', type:'date'},
  financement:{col:'Type de financement', type:'fin'},
};
// Une date jj/mm/aaaa se compare en nombre ; une date absente passe en
// dernier, dans les deux sens — une case vide n'est pas une date ancienne.
const JJ=/^(\d{2})\/(\d{2})\/(\d{4})$/;
function valTri(i,k){
  const d=COLS_TRI[k]; if(!d) return '';
  if(d.type==='num') return N(i,d.col);
  if(d.type==='date'){ const m=JJ.exec(String(V(i,d.col)||'').trim());
    return m?(+m[3]*10000+ +m[2]*100+ +m[1]):null; }
  // Le financement affiché est celui que la ligne MONTRE : un complément posé
  // à la main prime, comme dans la liste.
  if(d.type==='fin'){ const c=compl.get(cleLigne(i)); return (c?c.dispositif:V(i,d.col))||''; }
  return String(V(i,d.col)||'');
}
function trier(liste){
  const k=TRI.col; if(!k||!COLS_TRI[k]) return liste;
  const num=COLS_TRI[k].type==='num'||COLS_TRI[k].type==='date';
  return liste.slice().sort((a,b)=>{
    const x=valTri(a,k), y=valTri(b,k);
    const vx=(x===null||x===''), vy=(y===null||y==='');
    if(vx&&vy) return a-b;
    if(vx) return 1;              // les vides toujours à la fin
    if(vy) return -1;
    const c=num?(x-y):String(x).localeCompare(String(y),'fr');
    return c?c*TRI.sens:(a-b);    // à égalité, l'ordre du grand livre
  });
}
function marquerTri(){
  document.querySelectorAll('.ent>div[data-tri]').forEach(d=>{
    const a=d.dataset.tri===TRI.col;
    d.classList.toggle('trie',a);
    const i=d.querySelector('i'); if(i) i.textContent=a?(TRI.sens>0?'▲':'▼'):'';
  });
}
function brancherTri(){
  document.querySelectorAll('.ent>div[data-tri]').forEach(d=>{
    d.addEventListener('click',e=>{
      if(e.target&&e.target.id==='coche-tout') return;   // la case n'est pas un tri
      const k=d.dataset.tri;
      if(TRI.col!==k) TRI={col:k,sens:1};
      else if(TRI.sens>0) TRI={col:k,sens:-1};
      else TRI={col:'',sens:1};                          // retour à l'ordre du grand livre
      marquerTri(); appliquer();
    });
  });
  marquerTri();
}

function appliquer(garderPlace){
  const q=E('q').value.trim().toLowerCase(), c=E('fcat').value, t=E('ftr').value, a=E('fac').value;
  // LE DEGRÉ DE FIABILITÉ, quand on ne regarde que les propositions.
  //
  // « Lorsque je mets seulement les propositions de rapprochement, j'aimerais
  // avoir un nouveau filtre qui apparaît avec le degré de fiabilité »,
  // 22/10/2026. Il n'a de sens que là : ailleurs la colonne est vide sur neuf
  // lignes sur dix, et un filtre qui ne garde rien n'est pas un filtre. Il
  // apparaît donc avec la vue, et se vide quand on la quitte.
  const vf=E('ffiab');
  if(a!=='rappro'){ if(!vf.hidden){ vf.hidden=true; vf.value=''; } }
  else if(vf.hidden) vf.hidden=false;
  const fi=a==='rappro'?vf.value:'';
  // UNE PROPOSITION À LA FOIS, PAR SON NUMÉRO.
  //
  // Le numéro de rapprochement est le seul lien entre la facture et le
  // règlement qu'on lui propose : le saisir ici isole le couple, et lui seul.
  // Comme le filtre de fiabilité, le champ n'existe que dans cette vue.
  const vr=E('frap');
  if(a!=='rappro'){ if(!vr.hidden){ vr.hidden=true; vr.value=''; } }
  else if(vr.hidden) vr.hidden=false;
  const nrap=a==='rappro'?vr.value.trim():'';
  // Changer de vue vide la sélection : une case cochée hors de l'écran, qu'on
  // compléterait sans la voir, serait pire que de devoir recocher.
  if(!garderPlace&&selection.size){ selection.clear(); }
  filtre=I.filter(i=>{
    // Le montant ouvert : seules les écritures des créances qui le composent.
    if(zoom){
      if(!V(i,'Clé de la créance')) return false;
      // Un lot soldé ne pèse rien dans la case cliquée : ses écritures portent
      // bien une créance et une sous-catégorie, mais un reste dû nul. Les
      // garder gonflait le compte — 5 335 créances annoncées pour 5 225.
      if(Math.abs(N(i,'Reste dû de la créance'))<0.005) return false;
      if(zoom.cat && categorieDe(i,zoom.niveau)!==zoom.cat) return false;
      const trc=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
      if(zoom.tr==='(échu)'){ if(trc==='Non échu'||!trc) return false; }
      else if(zoom.tr==='(non échu)'){ if(trc!=='Non échu') return false; }
      else if(zoom.tr && trc!==zoom.tr) return false;
      if(zoom.prov && !(provisionDe(N(i,'Reste dû de la créance'),sousVraie(i),trc,
                                    V(i,'Clé de la créance'))>0))
        return false;
    }
    if(c && V(i,'Type de financement')!==c) return false;
    if(t && V(i,'Tranche d’ancienneté')!==t) return false;
    const ac=!!V(i,'Type de financement : à compléter') && !compl.has(cleLigne(i));
    if(a==='oui'&&!ac) return false;
    if(a==='non'&&ac) return false;
    // « Lignes non lettrées » : l'écriture ne porte aucun code de lettrage,
    // au débit comme au crédit. Les deux côtés font le même travail — une
    // facture que rien ne solde et un encaissement que rien ne rattache sont
    // les deux moitiés du même lettrage à faire. Ne montrer que le crédit, ce
    // qu'il faisait jusqu'au 14/10, cachait la facture d'en face.
    if(a==='credit'){ const L=V(i,'Let.').trim();
      if(L && L!==NON_LETTRE) return false;
      if(N(i,'Débit')<0.009 && N(i,'Crédit')<0.009) return false; }
    // Le moteur comptable a proposé une facture pour ce règlement non lettré.
    //
    // ET SEULEMENT LE RÈGLEMENT. « Comment cela se fait qu'il n'y a que des
    // montants au débit ? », 22/10/2026 : depuis que la facture d'en face
    // porte elle aussi la proposition, elle entrait dans le filtre — puis le
    // regroupement par couple, plus bas, la rajoutait une seconde fois. Chaque
    // facture apparaissait donc en double, et les quatorze factures d'un compte
    // passaient avant son premier règlement. La proposition naît sur le
    // règlement, qui est toujours au crédit : c'est lui qu'on filtre, et le
    // couple va chercher ses factures.
    if(a==='rappro'&&!(V(i,'Proposition de rapprochement')&&N(i,'Crédit')>0.009)) return false;
    // Le numéro saisi, comparé aux numéros que la ligne porte — elle peut en
    // porter plusieurs : « 3 · 4 ».
    if(nrap && !V(i,'N° de rapprochement').split('·').map(x=>x.trim()).includes(nrap))
      return false;
    // La fiabilité est portée par le RÈGLEMENT ; la facture d'en face la
    // reprend préfixée de son numéro de couple. On cherche donc le mot.
    if(fi&&!new RegExp('(^|\\W)'+fi.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\W|$)','i')
        .test(V(i,'Fiabilité du rapprochement'))) return false;
    // Toutes les écritures des comptes qui ont reçu plus qu'ils ne doivent :
    // c'est là que se trouve, ligne par ligne, l'excédent de trésorerie.
    if(a==='excedent'&&!enExcedent(V(i,'N° de compte'))) return false;
    // Les deux exceptions au barème, demandées le 16/10/2026 : le mandat de
    // prélèvement, qui annule le délai, et la refacturation après formation,
    // qui le fait courir depuis l'émission. Toutes deux sont écrites noir sur
    // blanc dans « Règle de datation appliquée » : le filtre n'invente rien, il lit.
    // Le filtre lit le MOTIF, pas une étiquette figée : les deux libellés ont
    // été réécrits le 20/10/2026 (« Exception · mandat de prélèvement
    // GoCardless », « Exception · facture émise après la fin de formation ») et
    // les deux filtres ne gardaient plus rien — 1 335 écritures devenues
    // inatteignables sans qu'un écran vide ne se distingue d'un écran sans
    // résultat. On compare désormais sur ce qui ne bouge pas.
    if(a==='mandat'&&!/mandat de pr/i.test(V(i,'Règle de datation appliquée'))) return false;
    if(a==='posterieure'&&!/post[ée]rieure|apr[èe]s la fin/i.test(V(i,'Règle de datation appliquée'))) return false;
    if(q){ const s=(V(i,'N° de facture')+' '+V(i,'Tiers')+' '+V(i,'N° de compte')+' '
        +V(i,'Libellé de compte')+' '+V(i,'Libellé de ligne')).toLowerCase();
      if(!s.includes(q)) return false; }
    return true;
  });
  // Le tri choisi s'applique ici, avant tout regroupement.
  filtre=trier(filtre);
  // Une proposition ne se juge pas sur le seul règlement : on affiche le
  // couple — la facture au débit, puis le règlement au crédit qui la
  // solderait. Les deux lignes portent le même numéro de rapprochement.
  marques=filtre.map(()=>'');
  let nbProp=0, nbCpt=0, mtCpt=0;
  if(a==='rappro'){
    const ix=indexRappro(), out=[], mk=[];
    for(const i of filtre){
      nbProp++;
      for(const n of V(i,'N° de rapprochement').split('·')){
        const e=ix.get(n.trim()); if(!e) continue;
        for(const j of e.deb){ out.push(j); mk.push('facture'); }
      }
      out.push(i); mk.push('couple');
    }
    filtre=out; marques=mk;
  }
  // L'excédent se lit par CLIENT : on range les écritures compte par compte,
  // du plus gros excédent au plus petit, et on sépare chaque compte du
  // suivant. Une liste à plat mélangerait les 213 comptes et ne dirait pas
  // lequel pèse combien.
  if(a==='excedent'){
    const par=new Map();
    for(const i of filtre){ const c=V(i,'N° de compte');
      if(!par.has(c)) par.set(c,[]); par.get(c).push(i); }
    const ordre=[...par.keys()].sort((x,y)=>soldeDuCompte(x)-soldeDuCompte(y));
    const out=[], mk=[];
    for(const c of ordre){
      const l=par.get(c).sort((x,y)=>V(x,'Date')<V(y,'Date')?-1:1);
      l.forEach((i,n)=>{ out.push(i); mk.push(n===l.length-1?'couple':''); });
    }
    filtre=out; marques=mk;
    nbCpt=ordre.length; mtCpt=ordre.reduce((s,c)=>s+soldeDuCompte(c),0);
  }
  let d=0,cr=0; const vus=new Set();
  for(const i of filtre){ if(vus.has(i)) continue; vus.add(i); d+=N(i,'Débit'); cr+=N(i,'Crédit'); }
  // Le débit ET le crédit, pas leur différence. Sa question du 16/10/2026 :
  // « 2 711 écritures · 258 833 €, cela veut dire que ce montant est au
  // crédit ? » — un solde net ne dit pas de quoi il est fait, et un net
  // négatif se lisait comme un crédit pur.
  const deuxSens=d.toLocaleString('fr-FR',{maximumFractionDigits:0})+' € au débit · '
    +cr.toLocaleString('fr-FR',{maximumFractionDigits:0})+' € au crédit · solde '+eur(d-cr);
  E('cpt').textContent=(a==='rappro'
    ? nbProp.toLocaleString('fr-FR')+' propositions · '+vus.size.toLocaleString('fr-FR')
      +' lignes · '+deuxSens
    : a==='excedent'
    ? nbCpt.toLocaleString('fr-FR')+' comptes · excédent '+eurC(mtCpt)+' · '
      +filtre.length.toLocaleString('fr-FR')+' écritures · '+deuxSens
    : filtre.length.toLocaleString('fr-FR')+' écritures · '+deuxSens);
  // Ce que pèsent les créances ouvertes : la somme doit retomber sur la case
  // cliquée, sans quoi le rapprochement entre la synthèse et le détail est faux.
  E('zoom').hidden=!zoom;
  if(zoom){
    const vues=new Set(); let euros=0, prov=0;
    for(const i of filtre){ const k=V(i,'Clé de la créance');
      if(!k||vues.has(k)) continue; vues.add(k);
      const rd=N(i,'Reste dû de la créance'); euros+=rd;
      if(zoom.prov) prov+=provisionDe(rd,sousVraie(i),
        V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'), k); }
    E('zoom-quoi').textContent=(zoom.prov?'À provisionner · ':'')
      +(zoom.cat||'Toute la balance')
      +(zoom.tr?' · '+(zoom.tr==='(échu)'?'échu':zoom.tr==='(non échu)'?'non échu':zoom.tr):'');
    E('zoom-montant').textContent=(zoom.prov?eur(prov)+' provisionnés sur ':'')
      +eur(euros)+' · '+vues.size.toLocaleString('fr-FR')
      +(vues.size>1?' créances':' créance');
  }
  E('cale').style.height=(filtre.length*30)+'px';
  if(!garderPlace) E('viewport').scrollTop=0;
  dessiner();
  barre();
}

function dessiner(){
  const vp=E('viewport'), H=30, haut=vp.scrollTop, n=Math.ceil(vp.clientHeight/H)+6;
  const d=Math.max(0,Math.floor(haut/H)-3), f=Math.min(filtre.length,d+n);
  let h='';
  for(let k=d;k<f;k++){
    const i=filtre[k], c=compl.get(cleLigne(i)), ac=V(i,'Type de financement : à compléter')&&!c;
    h+='<div class="lig'+(sel===i?' sel':'')+(marques[k]==='couple'?' couple':'')
      +'" style="top:'+(k*H)+'px;height:'+H+'px" data-i="'+i+'" data-k="'+k+'">'
      +'<div class="mono">'+(cochable(i)
          ?'<input type="checkbox" class="coche" data-i="'+i+'"'+(selection.has(i)?' checked':'')+'>':'')
        +(V(i,'N° de facture')||'·')+'</div>'
      +'<div class="mono">'+V(i,'N° de compte')+'</div>'
      +'<div>'+V(i,'Tiers')
        +(ac?' <span class="puce sig">type de financement : à compléter</span>':'')
        +(c?' <span class="puce ok">complété</span>':'')+'</div>'
      +'<div class="num">'+(N(i,'Débit')?eur(N(i,'Débit')):'')+'</div>'
      +'<div class="num">'+(N(i,'Crédit')?eur(N(i,'Crédit')):'')+'</div>'
      +'<div class="mono">'+V(i,'Date d’échéance recalculée')+'</div>'
      +'<div>'+(c?c.dispositif:V(i,'Type de financement'))+'</div></div>';
  }
  E('cale').innerHTML=h;
  E('cale').querySelectorAll('.lig').forEach(el=>
    el.addEventListener('click',()=>{sel=+el.dataset.i;dessiner();fiche(sel);}));
  // La case ne doit pas ouvrir la fiche : on arrête le clic avant la ligne.
  E('cale').querySelectorAll('.coche').forEach(c=>{
    c.addEventListener('click',e=>e.stopPropagation());
    c.addEventListener('change',()=>{ const i=+c.dataset.i;
      if(c.checked) selection.add(i); else selection.delete(i); barre(); });
  });
}

// Ce que le lecteur a sous les yeux au moment où il télécharge : sans cette
// ligne, un classeur de sélection ressemble à s'y méprendre à un classeur
// complet dont il manquerait des lignes.
function filtresEnCours(){
  const p=[];
  if(zoom) p.push((zoom.prov?'montant à provisionner ouvert : ':'montant ouvert : ')
    +(zoom.cat||'toute la balance')
    +(zoom.tr?' · '+(zoom.tr==='(échu)'?'échu':zoom.tr==='(non échu)'?'non échu':zoom.tr):''));
  const q=E('q').value.trim(); if(q) p.push('recherche « '+q+' »');
  if(E('fcat').value) p.push('type de financement : '+E('fcat').value);
  if(E('ftr').value) p.push('tranche : '+E('ftr').value);
  const a=E('fac'); if(a.value) p.push(a.options[a.selectedIndex].textContent.trim());
  return p.length?p.join('  ·  '):'aucun filtre — toute la balance';
}

// La répartition au prorata, écrite là où se lisent les autres règles.
// Un texte qui court sur toute la largeur de la feuille plutôt que de
// s'entasser dans la première colonne : sans cela une phrase de trois lignes
// devenait une cellule de douze, et la feuille n'était plus lisible.
// « Enlève-moi ce type de phrase de l'export », 22/10/2026 : les paragraphes
// qui expliquaient comment lire une feuille ou comment la méthode fonctionne
// sont partis. Il ne reste que des titres, des en-têtes et des tableaux — un
// fait se dit dans une cellule, pas dans une phrase.
function bande(ws,texte,police,deCol){
  const d=deCol||1;
  const r=ws.addRow(Array(d-1).fill('').concat([texte]));
  ws.mergeCells(r.number,d,r.number,8);
  r.getCell(d).alignment={vertical:'top',wrapText:true};
  if(police) r.getCell(d).font=police;
  r.height=Math.max(16,Math.ceil(String(texte||'').length/150)*15+4);
  return r;
}

function prorataRegles(ws){
  const P=D.prorata; if(!P) return;
  ws.addRow([]);
  bande(ws,String(P.titre||'').toUpperCase(),{bold:true,size:12,color:{argb:BLEU}});
  ws.addRow([]);
  // Le texte de la règle tient sur les colonnes 3 à 8 : c'est lui qui est
  // long, les deux premières ne portent qu'un rang et un titre.
  const fus=r=>ws.mergeCells(r.number,3,r.number,8);
  const e=ws.addRow(['Ordre','Ce que c’est','Ce que dit la règle']);
  fus(e); poserEntete(ws,e);
  let y=0;
  for(const x of (P.etapes||[])){
    const l=ws.addRow([x.rang,x.quoi,x.dit]);
    fus(l);
    l.getCell(1).font={bold:true}; l.getCell(2).font={bold:true};
    l.alignment={vertical:'top',wrapText:true};
    l.height=Math.max(16,Math.ceil(String(x.dit||'').length/130)*15+4);
    if(y++%2) l.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PALE}};});
  }
  if(P.regle){
    const l=ws.addRow(['','Ce que la règle fait',P.regle]);
    fus(l);
    l.getCell(2).font={bold:true};
    l.alignment={vertical:'top',wrapText:true};
    l.height=Math.max(16,Math.ceil(String(P.regle||'').length/130)*15+4);
  }
  if(P.limites){
    const l=ws.addRow(['','Ce que la règle ne fait pas',P.limites]);
    fus(l);
    l.getCell(2).font={bold:true,color:{argb:'FFA06B14'}};
    l.getCell(3).font={color:{argb:'FFA06B14'}};
    l.alignment={vertical:'top',wrapText:true};
    l.height=Math.max(16,Math.ceil(String(P.limites||'').length/130)*15+4);
  }
}

// Le barème de provision du groupe, tel qu'il est appliqué, suivi du
// rattachement de chaque type de financement à sa famille. Les deux se lisent
// ensemble : un taux sans son périmètre ne dit pas quel montant il couvre.
function provisionRegles(ws){
  paramsPrets();
  const fen=PROV.fenetres||[], taux=PROV.taux||{};
  if(!fen.length) return;
  ws.addRow([]);
  // L'exposé de la règle de provision a quitté le classeur le 21/10/2026 :
  // « retire ça de l'export ». Le 22/10, le chapeau du rattachement est parti
  // à son tour : qu'il ne soit pas confirmé se lit maintenant dans l'en-tête
  // de sa colonne. Le classeur garde les taux et le rattachement — des
  // chiffres, pas un cours.
  const pv=provisions();
  poserEntete(ws,ws.addRow(['Famille',...fen.map(f=>f.label),'À provisionner']));
  let y=0;
  for(const f of Object.keys(taux)){
    const l=ws.addRow([f,...(taux[f]||[]),pv.parFam.get(f)||0]);
    l.getCell(1).font={bold:true};
    for(let c=2;c<=1+fen.length;c++) l.getCell(c).numFmt='0,0 %';
    l.getCell(2+fen.length).numFmt=EUROS;
    if(y++%2) l.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PALE}};});
  }
  const tot=ws.addRow(['TOTAL',...fen.map(()=>null),pv.total]);
  tot.getCell(1).font={bold:true}; tot.getCell(2+fen.length).font={bold:true};
  tot.getCell(2+fen.length).numFmt=EUROS;
  ws.addRow([]);
  poserEntete(ws,ws.addRow(['Type de financement',
    'Famille de provision'+(PROV.confirme?'':' (proposition, à confirmer)'),'',
    'Reste dû','À provisionner']));
  const rd=new Map(), vues=new Set();
  for(const i of I){ const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const sc=sousVraie(i); if(sc) rd.set(sc,(rd.get(sc)||0)+N(i,'Reste dû de la créance')); }
  y=0;
  for(const sc of [...rd.keys()].sort()){
    const l=ws.addRow([sc, familleDe(sc)||'(à rattacher)', '', rd.get(sc)||0, pv.parSc.get(sc)||0]);
    l.getCell(1).font={bold:true};
    l.getCell(4).numFmt=EUROS; l.getCell(5).numFmt=EUROS;
    if(!familleDe(sc)) l.getCell(2).font={color:{argb:CORAIL},bold:true};
    if(y++%2) l.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PALE}};});
  }
}

// Le vocabulaire des colonnes d'audit, en clair. Ces expressions disent par
// quel chemin chaque ligne a été classée et datée ; sans glossaire, « hérité
// de la facture du même lettrage » ne se devine pas. Posé à partir de la
// colonne F, à sa demande du 15/10/2026.

// Posé en colonne A, en bas de la feuille : à sa demande du 16/10/2026, et
// parce qu'un bloc décalé en colonne F se lit mal — on ne le voit qu'en
// faisant défiler vers la droite.
// Le glossaire, sans préambule ni intertitres : elle les a retirés le
// 16/10/2026. Une liste de termes et de définitions, sous un en-tête de
// tableau comme les autres — rien à lire avant d'y chercher un mot.

function feuilleBalance(wb,niv,idx){
  // « Balance âgée par type de financement » dépasse les 31 caractères
  // qu'Excel accorde à un nom d'onglet : c'est la forme courte qui tient.
  const nom=niv==='cat'?'Balance âgée':'Balance âgée par financement';
  const tete=niv==='cat'?'Type de client':'Type de financement';
  // La colonne de droite donne l'AUTRE lecture du même compte : son ou ses
  // types de financement quand on lit par type de client, son ou ses types de
  // client quand on lit par type de financement. Répéter la colonne de tête
  // n'apprendrait rien.
  const autre=niv==='cat'?'Type de financement':'Type de client';
  const nT=D.tranches.length;
  // Une seule colonne ajoutée à la balance. Tout le reste — le compte, la
  // facture, la date — tient dans la première colonne, par l'indentation. Une
  // écriture ventile son montant dans les MÊMES colonnes d'ancienneté que la
  // balance : c'est ce qui permet de lire, tranche par tranche, ce qui compose
  // un montant.
  const P={lib:0, total:1, echu:2, tranche:3, nonEchu:3+nT, nb:4+nT, part:5+nT,
           prov:6+nT, ecart:7+nT, autre:8+nT};
  const LARGE=9+nT;
  const ws=wb.addWorksheet(nom);
  // Le niveau visible à l'ouverture : 1. Les comptes sont donc repliés, et
  // déplier une catégorie ne déplie PAS les écritures qu'elle contient.
  ws.properties.outlineLevelRow=1;
  ws.properties.outlineProperties={summaryBelow:false,summaryRight:false};
  ws.columns=[{width:48},{width:15},{width:15},...D.tranches.map(()=>({width:14})),
    {width:15},{width:10},{width:9},{width:16},{width:10},{width:30}];
  const t=ws.addRow([niv==='cat'?'RESTE DÛ PAR TYPE DE CLIENT ET PAR ANCIENNETÉ'
    :'RESTE DÛ PAR DISPOSITIF ET PAR ANCIENNETÉ']);
  t.font={bold:true,size:14,color:{argb:BLEU}}; t.height=24;
  ws.addRow([]);
  const ent=new Array(LARGE).fill('');
  ent[P.lib]=tete; ent[P.total]='Restant dû'; ent[P.echu]='Échu';
  D.tranches.forEach((x,j)=>{ ent[P.tranche+j]=x; });
  ent[P.nonEchu]='Non échu'; ent[P.nb]='Créances'; ent[P.part]='Part';
  ent[P.prov]='À provisionner'; ent[P.ecart]='Écart'; ent[P.autre]=autre;
  poserEntete(ws,ws.addRow(ent));
  for(let c=P.total+1;c<=P.nonEchu+1;c++) ws.getColumn(c).numFmt=EUROS;
  ws.getColumn(P.nb+1).numFmt=ENTIER; ws.getColumn(P.ecart+1).numFmt=EUROS;
  // La part du NOMBRE de créances que porte la ligne, en fraction de 1 pour
  // qu'Excel la calcule et la somme. Sa règle, le 16/10/2026.
  ws.getColumn(P.part+1).numFmt='0,0 %';
  ws.getColumn(P.prov+1).numFmt=EUROS;
  const lignesSynth=synthRows(niv);
  // La provision par ligne de synthèse : la somme de celles de ses créances.
  const provCat=new Map();
  const totalNb=lignesSynth.reduce((n,x)=>x.cat==='TOTAL'?n:n+x.nb,0)||0;
  const part=n=>totalNb?n/totalNb:null;

  const rang=new Map(D.tranches.map((x,j)=>[x,j]));
  const info=new Map(), par=new Map();
  for(const i of idx){
    const k=V(i,'Clé de la créance'); if(!k||info.has(k)) continue;
    const rd=N(i,'Reste dû de la créance'); if(Math.abs(rd)<0.005) continue;
    info.set(k,{cat:categorieDe(i,niv), cpt:V(i,'N° de compte'), rd:rd,
      // La provision de CETTE créance : son reste dû au débit multiplié par le
      // taux de sa famille dans la fenêtre où tombe son ancienneté.
      prov:provisionDe(rd, sousVraie(i),
        V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'), k),
      // L'autre lecture de la MÊME créance. Prise sur la créance, pas sur
      // l'écriture : les deux diffèrent dès que la créance n'est pas classée.
      autre:(niv==='cat'?sousVraie(i):categorieDe(i,'cat'))||'',
      tr:V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté')});
  }
  for(const [,e] of info) provCat.set(e.cat,(provCat.get(e.cat)||0)+e.prov);
  provCat.set('TOTAL',[...provCat.values()].reduce((a,b)=>a+b,0));
  for(const i of idx){
    const k=V(i,'Clé de la créance'); const e=k&&info.get(k); if(!e) continue;
    if(!par.has(e.cat)) par.set(e.cat,new Map());
    const m=par.get(e.cat);
    let g=m.get(e.cpt);
    if(!g){ g={cpt:e.cpt, client:V(i,'Libellé de compte')||V(i,'Tiers'), total:0, echu:0,
      nonEchu:0, nb:0, prov:0, buckets:D.tranches.map(()=>0), lignes:[], vues:new Set(),
      autres:new Set()}; m.set(e.cpt,g); }
    g.lignes.push(i);
    if(!g.vues.has(k)){ g.vues.add(k); g.nb++; g.total+=e.rd; g.prov+=e.prov;
      // Un compte peut porter deux dispositifs : on les nomme tous les deux
      // plutôt que d'en élire un.
      if(e.autre) g.autres.add(e.autre);
      if(e.tr==='Non échu') g.nonEchu+=e.rd;
      else { g.echu+=e.rd; if(rang.has(e.tr)) g.buckets[rang.get(e.tr)]+=e.rd; } }
  }
  const ar2=x=>Math.round(x*100)/100;
  const tri=i=>V(i,'Clé de la créance')+'|'+V(i,'Date');

  let z=0;
  for(const s of lignesSynth){
    const l=ws.addRow([s.cat,s.total,s.echu,...s.buckets,s.nonEchu,s.nb,
      part(s.cat==='TOTAL'?totalNb:s.nb), ar2(provCat.get(s.cat)||0),
      ar2(s.total-(s.echu+s.nonEchu)),'']);
    l.getCell(1).font={bold:true};
    if(s.cat==='TOTAL'){ poserTotal(l); continue; }
    if(z++%2) l.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PALE}};});
    for(const g of [...(par.get(s.cat)||new Map()).values()].sort((a,b)=>a.cpt<b.cpt?-1:1)){
      const lr=ws.addRow(['    '+g.cpt+' - '+g.client, ar2(g.total), ar2(g.echu),
        ...g.buckets.map(ar2), ar2(g.nonEchu), g.nb, part(g.nb), ar2(g.prov),
        ar2(g.total-(g.echu+g.nonEchu)),
        [...g.autres].sort().join(' · ')]);
      lr.outlineLevel=1; lr.hidden=true; lr.getCell(1).font={bold:true};
      // Une ligne par ÉCRITURE du compte : son montant au débit ou au crédit,
      // posé dans la colonne d'ancienneté qui lui correspond.
      //
      // Ces lignes ne totalisent PAS toujours la ligne du compte, tranche par
      // tranche, et c'est normal : la balance répartit le solde d'un lettrage
      // entre ses factures au prorata, tandis qu'un règlement s'impute sur une
      // seule d'entre elles. La ligne du compte, au-dessus, reste la référence.
      for(const i of g.lignes.sort((a,b)=>tri(a)<tri(b)?-1:1)){
        const e=info.get(V(i,'Clé de la créance'));
        const m=ar2(N(i,'Débit')-N(i,'Crédit'));
        const r=new Array(LARGE).fill(null);
        // Une case vide se lit comme une donnée manquante ; un zéro dit « rien
        // dans cette tranche ». Sa règle, le 16/10/2026 : « quand il n'y a
        // rien il faut mettre dans le montant 0 € ». Les colonnes de comptage
        // — créances et part — restent vides : elles n'ont pas de sens sur une
        // écriture, et un zéro y serait une réponse à une question qu'on ne
        // pose pas.
        for(let c=P.total;c<=P.nonEchu;c++) r[c]=0;
        r[P.ecart]=0;
        r[P.lib]='          '+(V(i,'N° de facture')||'·')+'   '+V(i,'Date');
        r[P.total]=m;
        if(e.tr==='Non échu') r[P.nonEchu]=m;
        else { r[P.echu]=m; if(rang.has(e.tr)) r[P.tranche+rang.get(e.tr)]=m; }
        r[P.ecart]=0;
        r[P.autre]=e.autre;
        const le=ws.addRow(r); le.outlineLevel=2; le.hidden=true;
      }
    }
  }
}

// Ce qui doit arriver dans Excel comme un NOMBRE, et rien d'autre. Un numéro
// de compte n'est pas un nombre : « 4110600400000 » devenait « 4,1106E+12 »,
// illisible et impossible à rapprocher de la balance.
// La première colonne retirée du classeur. Tout ce qui la suit l'est aussi.
const COUPE='N° de rapprochement';
const nbColsDetail=()=>D.cols.indexOf(COUPE)<0?D.cols.length:D.cols.indexOf(COUPE);
const NUMERIQUES=new Set([...MONNAIE,'Taux d’attribution TVA','Taux de change',
  'Jours de retard','Délai appliqué (jours)']);

function feuilleDetail(wb,idx,nom){
  const ws=wb.addWorksheet(nom);
  // La première colonne reprend mot pour mot l'étiquette de la balance :
  // « 411C103129000 - Lorik Carrier ». Un filtre sur cette colonne donne les
  // écritures du compte qu'on vient de lire, sans rien reconstruire à la main.
  // Les colonnes de travail de la page ne vont pas dans le classeur. Sa
  // demande du 16/10/2026 : « retire les colonnes de l'export à partir de la
  // colonne AW ». Ce sont les propositions de rapprochement et les attributs
  // de la créance, dont la page a besoin pour calculer mais qui n'ont rien à
  // faire dans un document qu'on relit.
  const COLS=D.cols.slice(0,D.cols.indexOf(COUPE)<0?D.cols.length:D.cols.indexOf(COUPE));
  ws.columns=[{header:'Compte - Client',width:46},
    ...COLS.map(c=>({header:c,width:Math.min(42,Math.max(13,c.length+3))}))];
  poserEntete(ws,ws.getRow(1));
  // 16 080 lignes : on écrit les valeurs d'un bloc et on ne pose la mise en
  // forme que sur les colonnes, pas sur chaque cellule — sans quoi le
  // navigateur passerait une minute à fabriquer 884 000 objets de style.
  ws.addRows(idx.map(i=>[
    V(i,'N° de compte')+' - '+(V(i,'Libellé de compte')||V(i,'Tiers')),
    ...COLS.map(c=>{ const v=V(i,c);
      return (NUMERIQUES.has(c)&&NOMBRE.test(v))?Number(v):v; })]));
  COLS.forEach((c,j)=>{ if(MONNAIE.has(c)) ws.getColumn(j+2).numFmt=EUROS; });
  ws.autoFilter={from:{row:1,column:1},to:{row:1,column:COLS.length+1}};
}

async function classeur(idx,nomDetail){
  const nom=nomDetail||'Détail ligne à ligne';
  const wb=new ExcelJS.Workbook();
  wb.creator='Balance âgée Liora'; wb.created=new Date();
  // Le sommaire annonce combien de paiements l'onglet porte : on les compte
  // avant de l'écrire, puisqu'il passe en premier dans le classeur.
  feuilleSommaire(wb,idx,nom);
  feuilleRegles(wb);
  feuilleBalance(wb,'cat',idx);
  feuilleBalance(wb,'sous',idx);
  feuilleDetail(wb,idx,nom);
  return new Uint8Array(await wb.xlsx.writeBuffer());
}

// ── Le téléchargement ──
// Le visualiseur bloque les téléchargements qu'une page déclenche elle-même :
// seul le canal « downloads » en ouvre un, et le lecteur confirme. Sans lui,
// les boutons n'apparaissent pas plutôt que de ne rien faire.
const MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
// ↓ la seule ligne qui diffère entre le fichier autonome et l'artefact ↓
let remettre=async(nom,octets)=>{const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([octets],{type:MIME}));
  a.download=nom;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);};
E('telech').hidden=false;
// ↑ la seule ligne qui diffère ↑
const envoyer=async(bouton,nom,idx,quoi,nomDetail)=>{
  if(!remettre) return;
  const b=E(bouton); b.disabled=true; E('dl-note').textContent='Préparation du classeur…';
  try{
    await remettre(nom, await classeur(idx,nomDetail));
    E('dl-note').textContent=idx.length.toLocaleString('fr-FR')+' écritures · '+quoi
      +' · 5 onglets, sommaire en tête';
  }catch(e){ E('dl-note').textContent='Le classeur n’a pas pu être écrit.'; }
  b.disabled=false;
};
E('dl-xlsx').addEventListener('click',()=>
  envoyer('dl-xlsx','Balance-agee-clients.xlsx',I,'toutes les colonnes','Détail ligne à ligne'));
E('dl-csv').addEventListener('click',()=>
  envoyer('dl-csv','Balance-agee-clients-selection.xlsx',filtre,'la sélection à l’écran','Sélection'));

// ───────── compléter une ligne, et s'en souvenir ─────────
// La clé d'un complément est celle de la créance dès qu'il y en a une : un
// dispositif se décide par créance, pas par écriture, et toutes les lignes de
// la créance suivent. À défaut — une écriture d'un lot soldé, qui ne pèse rien
// dans la balance — la ligne se désigne par son compte, son numéro et sa date.
const cleLigne=i=>V(i,'Clé de la créance')
  || (V(i,'N° de compte')+'|'+(V(i,'N° de facture')||V(i,'N° de pièce')||'·')+'|'+V(i,'Date'));
const idDoc=k=>k.replace(/[^A-Za-z0-9_.~:@+-]+/g,'_').slice(0,180);
const leJour=()=>new Date().toLocaleDateString('fr-FR');
// Un dispositif renommé : sa décision porte l'ancien intitulé, la balance le
// nouveau. On ramène l'un à l'autre à la lecture, une fois pour toutes, plutôt
// que de laisser deux lignes vivre côte à côte pour un seul dispositif.
const dispoActuel=d=>((D&&D.anciensDispositifs)||{})[d]||d;
// Administratrice ou lectrice. Faux tant que la page n'a pas pu le demander :
// on n'ouvre jamais une commande d'écriture par défaut.
let admin=false;

// ═══════════ les paramètres : provision et échéance ═══════════
//
// Les deux jeux de règles vivent dans la base de l'artefact, pas dans le
// fichier : une règle changée doit tenir d'un mois sur l'autre, alors que la
// page, elle, est reconstruite à chaque balance. Ce que les données livrent
// n'est donc qu'un point de départ.
// Construits à la première demande, et NON au chargement du script : D n'est
// rempli qu'une fois les données lues. Les lire trop tôt donnait un barème
// vide et un rattachement vide — exactement la panne qui avait déjà tué le
// bouton de téléchargement en silence.
let PROV=null, ECH=null;
function paramsPrets(){
  if(!PROV) PROV=JSON.parse(JSON.stringify((D&&D.provision)
    ||{confirme:false,fenetres:[],taux:{},familles:{}}));
  if(!ECH) ECH=((D&&D.regles)||[]).map(r=>({...r}));
}

// À quelle famille de provision appartient un type de financement.
const familleDe=sc=>{
  paramsPrets();
  for(const [f,liste] of Object.entries(PROV.familles||{}))
    if(liste.indexOf(sc)>=0) return f;
  return null;
};

// ───────── l'assiette de la provision ─────────
//
// On ne provisionne pas une dette qu'un paiement du même lot a déjà éteinte.
// Depuis qu'une écriture sans facture fait SA créance, un règlement non
// rattaché est devenu une créance au crédit à côté des dettes du même lot, et
// la provision portait sur le BRUT de ces dettes : 16 983 311 € au lieu des
// 14 635 123 € réellement dus, soit 5 670 753 € provisionnés au lieu de
// 4 654 820 €. Un million de trop.
//
// Les crédits non rattachés d'un lot s'imputent donc sur ses dettes, de la
// plus ancienne à la plus récente — l'imputation de droit commun, et ce que le
// moteur faisait de lui-même avant la découpe, puisque le lot ne faisait
// qu'une créance. L'ANCIENNETÉ, elle, reste celle de chaque ligne.
let ASSIETTE=null;
function assiettes(){
  if(ASSIETTE) return ASSIETTE;
  ASSIETTE=new Map();
  // L'imputation se lit PAR COMPTE CLIENT, sa décision du 20/10/2026. C'est le
  // même périmètre que la tuile « trop-perçu », et c'est ce qui rend la page
  // cohérente avec elle-même : un client déclaré globalement créditeur d'un
  // côté ne peut pas voir sa dette provisionnée à 100 % de l'autre. Au
  // lettrage, 27 lots dont le client ne devait rien portaient encore
  // 204 879 € de provision. Le résidu non imputé devient alors exactement le
  // trop-perçu des comptes nets créditeurs, et rien d'autre.
  const lots=new Map(), vues=new Set();
  for(const i of I){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    // L'ancienneté de la CRÉANCE : un encaissement porte sa propre date
    // depuis le 20/10/2026, et l'ordre d'imputation ne doit pas en dépendre.
    const jc=V(i,'Jours de retard de la créance');
    const j=jc!==''?jc:V(i,'Jours de retard');
    const lot=V(i,'N° de compte');
    if(!lots.has(lot)) lots.set(lot,[]);
    lots.get(lot).push({k, rd:N(i,'Reste dû de la créance'), j:j===''?-1:Number(j)});
  }
  for(const [,g] of lots){
    let credit=-g.filter(c=>c.rd<0).reduce((s,c)=>s+c.rd,0);
    // L'ordre d'imputation doit être TOTAL, sinon le chiffre dépend de
    // l'ordre de lecture : deux créances du même âge se départagent par leur
    // clé. Sans ce départage, la page et le contrôle annonçaient 4 048 692,24 €
    // et 4 047 124,73 € — 1 567,51 € d'écart sur rien d'autre que l'ordre.
    for(const c of g.filter(c=>c.rd>0).sort((a,b)=>b.j-a.j||(a.k<b.k?-1:a.k>b.k?1:0))){
      const pris=Math.min(credit,c.rd); credit-=pris;
      ASSIETTE.set(c.k, c.rd-pris);
    }
  }
  return ASSIETTE;
}
// Le barème s'applique à ce qui reste vraiment dû sur la créance.
function provisionDe(rd, sc, tr, cle){
  paramsPrets();
  const a=assiettes();
  const base=(cle!=null&&a.has(cle))?a.get(cle):rd;
  if(!(base>0)) return 0;
  const j=(PROV.fenetres||[]).findIndex(f=>(f.tranches||[]).indexOf(tr)>=0);
  if(j<0) return 0;
  const fam=familleDe(sc); if(!fam) return 0;
  return base*(((PROV.taux||{})[fam]||[])[j]||0);
}

// La provision par ligne de synthèse, au niveau de lecture courant. Elle suit
// les compléments comme le reste : la famille vient de sousVraie() et la ligne
// de categorieDe(), qui tiennent compte des décisions prises dans la page.
function provisionParCategorie(niv){
  const m=new Map(), vues=new Set();
  for(const i of I){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const p=provisionDe(N(i,'Reste dû de la créance'), sousVraie(i),
      V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté'), k);
    if(!p) continue;
    const c=categorieDe(i,niv);
    m.set(c,(m.get(c)||0)+p);
  }
  return m;
}

// Le total à provisionner, créance par créance : la même assiette et le même
// barème que provisionDe(), ventilés par famille et par dispositif. Un seul
// calcul dans la page — le bandeau, les tableaux, l'onglet et la feuille des
// règles doivent annoncer le même chiffre. En deçà de 121 jours, et pour une
// créance non échue ou sans date, rien. Un reste dû négatif — un compte
// créditeur — ne se provisionne pas : il n'y a pas de perte à couvrir.
function provisions(){
  paramsPrets();
  const fen=PROV.fenetres||[], taux=PROV.taux||{};
  const a=assiettes();
  const parFam=new Map(), parSc=new Map();
  let total=0, horsFamille=new Map();
  const vues=new Set();
  for(const i of I){
    const k=V(i,'Clé de la créance'); if(!k||vues.has(k)) continue; vues.add(k);
    const rd=N(i,'Reste dû de la créance'); if(!(rd>0)) continue;
    const base=a.has(k)?a.get(k):rd; if(!(base>0)) continue;
    const sc=sousVraie(i);
    const tr=V(i,'Tranche de la créance')||V(i,'Tranche d’ancienneté');
    const j=fen.findIndex(f=>(f.tranches||[]).indexOf(tr)>=0);
    if(j<0) continue;
    const fam=familleDe(sc);
    if(!fam){ horsFamille.set(sc,(horsFamille.get(sc)||0)+base); continue; }
    const t=(taux[fam]||[])[j]||0;
    const p=base*t;
    total+=p;
    parFam.set(fam,(parFam.get(fam)||0)+p);
    parSc.set(sc,(parSc.get(sc)||0)+p);
  }
  return {total, parFam, parSc, horsFamille};
}
// Les dispositifs proposés sont ceux que la balance porte déjà : une liste
// écrite en dur vieillirait sans prévenir.
let DISPOS=[];

// Le magasin : la base de l'artefact quand la page est publiée, le stockage du
// navigateur quand c'est le fichier autonome. La page fonctionne sans l'un ni
// l'autre — un complément est une surcouche, jamais une condition d'affichage.
// ───────── déposer les fichiers du mois ─────────
//
// « J'aimerais avoir l'option sur l'artefact de déposer directement les docs
// nécessaires à l'actualisation de la balance âgée », 22/10/2026.
//
// Ce que la page peut faire : RECEVOIR les quatre fichiers, les ranger avec
// elle, les horodater et dire qui les a déposés. Ce qu'elle ne peut pas :
// refaire la balance. La reconstruction lit six fichiers, croise trois
// facturations et tourne deux minutes hors du navigateur. Le dépôt est donc
// une boîte aux lettres, et le bloc le dit au lieu de le laisser croire.
//
// Les quatre cases sont exactement les quatre fichiers que la construction
// ouvre chaque mois — même nom de feuille, même séparateur. Un cinquième
// fichier, l'ancienne balance de référence, ne bouge pas d'un mois sur
// l'autre et ne se dépose pas.
const DEPOTS=[
  {cle:'grand-livre', nom:'Grand livre clients',
   quoi:'Export Pennylane · .xlsx · onglet « Grand livre - Clients »',
   ext:['.xlsx'], va:'depot-nouvelle/balance-nouvelle.xlsx'},
  {cle:'sellsy-factures', nom:'Facturation Sellsy — factures',
   quoi:'Export Sellsy · .csv · séparateur point-virgule',
   ext:['.csv'], va:'depot-sellsy/sellsy.csv'},
  {cle:'sellsy-avoirs', nom:'Facturation Sellsy — avoirs',
   quoi:'Export Sellsy · .csv · séparateur point-virgule',
   ext:['.csv'], va:'depot-sellsy/avoirs.csv'},
  {cle:'filiz', nom:'Dossiers Filiz — échéances',
   quoi:'Export du financeur · .xlsx · onglet « Échéances »',
   ext:['.xlsx'], va:'depot-ech/echeances.xlsx'},
];
// LE MAGASIN DE LA PAGE N'ACCEPTE PAS UN CLASSEUR.
//
// « Lorsque je dépose le grand livre l'artefact ne s'actualise pas, c
// normal ? », 22/10/2026. Non : le dépôt n'arrivait pas. Le magasin de
// fichiers de la page n'accepte qu'une liste fermée de types — images, PDF,
// polices, CSV, Markdown, JSON, texte — et un .xlsx n'en fait pas partie. Les
// deux classeurs du mois étaient donc refusés à chaque tentative, et un .csv
// l'était dès que le système annonçait son type autrement (Windows présente
// volontiers un .csv comme un fichier Excel) ou qu'il n'était pas en UTF-8.
//
// Les quatre fichiers montent donc dans une enveloppe JSON, qui est un type
// accepté : le fichier y voyage en base64, octet pour octet, avec son nom et
// sa taille. Rien n'est converti, rien n'est perdu — l'enveloppe est ouverte
// à la reconstruction et le fichier d'origine en ressort tel quel.
const ENVELOPPE='json/base64';
// Le plafond du magasin est de 20 Mio, et la base64 pèse un tiers de plus que
// le fichier : 14 Mio de fichier font 19 Mio d'enveloppe. C'est donc 14 Mio
// qu'on annonce. Les quatre fichiers du mois tiennent largement dessous — le
// plus gros, l'export Sellsy, pèse 4,5 Mo.
const DEPOT_MAX=14*1024*1024;
// Une pile d'appel ne supporte pas 4 millions d'arguments : la conversion se
// fait par tranches de 32 ko.
const enBase64=buf=>{
  const u=new Uint8Array(buf); let s='';
  for(let k=0;k<u.length;k+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(k,k+0x8000));
  return btoa(s);
};
let ASSETS=null, DEPOSES=new Map();

const fTaille=o=>o>=1048576?(o/1048576).toFixed(1).replace('.',',')+' Mo'
  :Math.max(1,Math.round(o/1024))+' ko';

async function ouvrirDepots(){
  try{ ASSETS=await claude.use('assets'); }catch(e){ ASSETS=null; }
  // Pas de canal : lecteur sans droit d'écriture, ou fichier autonome. Le bloc
  // ne s'affiche pas plutôt que d'afficher un bouton qui ne ferait rien.
  if(!ASSETS||!DB||!admin) return;
  try{
    const q=await DB.collection('depots').get();
    for(const d of q.docs) DEPOSES.set(d.id,d.data());
  }catch(e){}
  E('depot-bloc').hidden=false;
  dessinerDepots();
}

function dessinerDepots(){
  E('depot-liste').innerHTML=DEPOTS.map(d=>{
    const v=DEPOSES.get(d.cle);
    const etat=v
      ? '<span class="depot-etat2">'+esc(v.nom||'')+' · '+fTaille(v.octets||0)
        +'<br>déposé le '+esc(v.quand||'')+'</span>'
      : '<span class="depot-etat2 vide">rien de déposé</span>';
    return '<div class="depot-case">'
      +'<span class="depot-n"><b>'+esc(d.nom)+'</b><span>'+esc(d.quoi)+'</span></span>'
      +etat
      +'<label for="dep-'+d.cle+'">'+(v?'Remplacer':'Déposer')+'</label>'
      +'<input type="file" id="dep-'+d.cle+'" accept="'+d.ext.join(',')+'">'
      +'</div>';
  }).join('');
  for(const d of DEPOTS){
    const i=E('dep-'+d.cle);
    if(i) i.addEventListener('change',()=>deposer(d,i));
  }
}

async function deposer(d,input){
  const f=input.files&&input.files[0]; if(!f) return;
  const lab=document.querySelector('label[for="dep-'+d.cle+'"]');
  const dire=t=>{ E('depot-etat').textContent=t; };
  if(!d.ext.some(x=>f.name.toLowerCase().endsWith(x))){
    dire('« '+f.name+' » n’est pas un '+d.ext.join(' ou ')+' — rien n’a été déposé.');
    input.value=''; return;
  }
  if(f.size>DEPOT_MAX){
    dire('« '+f.name+' » pèse '+fTaille(f.size)+', au-delà des 14 Mo que la page accepte.');
    input.value=''; return;
  }
  if(lab){ lab.classList.add('occupe'); lab.textContent='Dépôt…'; }
  dire('');
  try{
    const enveloppe=new Blob([JSON.stringify({
      fichier:f.name, octets:f.size, type:f.type||'', base64:enBase64(await f.arrayBuffer())})],
      {type:'application/json'});
    const a=await ASSETS.upload(enveloppe,{type:'application/json'});
    const v={slot:d.cle, nom:f.name, octets:f.size, asset:a.id, enveloppe:ENVELOPPE,
             quand:new Date().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}),
             va:d.va};
    await DB.collection('depots').doc(d.cle).set(v);
    DEPOSES.set(d.cle,v);
    dire('« '+f.name+' » est déposé. Il attend la reconstruction de la balance.');
  }catch(e){
    dire('Le dépôt a échoué : '+((e&&e.message)||'raison inconnue')+'. Rien n’a été enregistré.');
  }
  input.value='';
  dessinerDepots();
}

// ───── demander une reconstruction ─────
//
// Le calcul de la balance ne se fait pas dans le navigateur : il lit quatre
// fichiers sources, applique le barème à 16 151 écritures et reprend ce que
// l'ancienne balance a appris. La page ne peut donc pas se recalculer
// elle-même. « Actualiser » enregistre la demande, horodatée et motivée ; la
// reconstruction suit, et la page est republiée avec ses données.
//
// Ce que le bouton actualise tout de suite, en revanche, c'est tout ce qui se
// calcule dans la page : les taux de provision réglés ici s'appliquent à
// l'écran sans attendre, et les tableaux se redessinent.
let DEMANDE=null;

// LES TROIS ÉTAPES D'UNE ACTUALISATION.
//
// Elles sont ce qu'elles disent, et la jauge n'avance qu'au fur et à mesure
// qu'elles s'achèvent réellement :
//   1. l'affichage de la page est refait — mesuré, de l'ordre de 70 ms sur
//      16 151 écritures ;
//   2. la demande de reconstruction est enregistrée ;
//   3. la balance est reconstruite et republiée — hors de la page : le calcul
//      lit quatre fichiers sources et reprend ce que l'ancienne balance a
//      appris.
// Une barre qui se remplirait sur une minuterie ne mesurerait rien.
const ETAPES=['Affichage actualisé','Demande enregistrée','Balance reconstruite'];

// La jauge se pose sur un pourcentage, pas sur un numéro d'étape : chaque
// étape occupe un tiers de la bande et avance à l'intérieur de son tiers au
// fur et à mesure de ce qui est réellement fait.
function poserBande(id,etape,part,detail,nom){
  const b=E(id+'-bande'); if(!b) return;
  const t=100/ETAPES.length;
  const pc=Math.min(100,Math.round((etape-1)*t+Math.max(0,Math.min(1,part))*t));
  b.hidden=false;
  b.classList.toggle('fini',pc>=100);
  b.querySelector('.actu-jauge').style.width=pc+'%';
  // Le nom de l'étape peut être repris : « Balance reconstruite » est vrai à
  // l'arrivée, pas pendant le calcul.
  b.querySelector('.actu-dit').textContent=pc+' % · étape '+etape+'/'+ETAPES.length
    +' · '+(nom||ETAPES[etape-1])+(detail?' '+detail:'');
}

// Une pause qui laisse le navigateur peindre : sans elle, la jauge saute
// d'un bout à l'autre sans qu'aucun état intermédiaire ne soit affiché.
const peindre=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

// ÉTAPE 1, SOUS-TÂCHE PAR SOUS-TÂCHE.
//
// Les poids sont les durées mesurées sur ce jeu de données : l'assiette de
// provision 10 ms, le tableau des taux 17 ms, les tableaux de règles 1 ms, la
// balance et le détail 42 ms. La jauge avance de la part réellement faite.
const TACHES=[
  ['paramètres',             1,  ()=>{ paramsPrets(); ASSIETTE=null; }],
  ['assiette de provision', 10,  ()=>{ assiettes(); }],
  ['taux de provision',     17,  ()=>{ tableProvision(); }],
  ['règles',                 1,  ()=>{ tableClassement(); tableEcheance(); }],
  ['balance et détail',     42,  ()=>{ rafraichir(); }],
];

async function refaireAffichage(id){
  const total=TACHES.reduce((a,t)=>a+t[1],0);
  let fait=0;
  const t0=performance.now();
  for(const [nom,poids,faire] of TACHES){
    poserBande(id,1,fait/total,'· '+nom+'…');
    await peindre();
    faire();
    fait+=poids;
  }
  poserBande(id,1,1,'en '+Math.max(1,Math.round(performance.now()-t0))+' ms');
  await peindre();
}

// ÉTAPE 3 — LA RECONSTRUCTION, QUI SE PASSE HORS DE LA PAGE.
//
// La page ne voit pas le calcul ; elle voit le document de demande. Tant qu'il
// est « en attente », la jauge reste au seuil de l'étape. Dès qu'il passe « en
// cours », elle avance en continu, du temps écoulé depuis le début rapporté à
// la durée RÉELLEMENT MESURÉE de la reconstruction précédente — c'est une
// estimation, elle est annoncée comme telle, et elle plafonne à 99 % : seule
// la republication de la balance la porte à 100 %.
let SUIVI=null;
function suivreReconstruction(){
  if(SUIVI){ clearInterval(SUIVI); SUIVI=null; }
  const ids=['ech-actu','prov-actu','depot-actu'];
  const dessiner=()=>{
    if(!DEMANDE||!DEMANDE.quand) return false;
    if(reconstruiteDepuis()){
      for(const id of ids) poserBande(id,3,1,'le '+(D.genere||'?'));
      return false;
    }
    if(DEMANDE.etat==='en cours' && DEMANDE.debutISO){
      const duree=Number(D.dureeMs)>0?Number(D.dureeMs):120000;
      const passe=Date.now()-Date.parse(DEMANDE.debutISO);
      const part=Math.max(0,Math.min(0.97,passe/duree));
      const dit=passe>duree ? '· plus longue que la précédente'
        : '· '+Math.round(passe/1000)+' s sur '+Math.round(duree/1000)+' s estimées';
      for(const id of ids) poserBande(id,3,part,dit,'Reconstruction en cours');
      return true;
    }
    for(const id of ids) poserBande(id,2,1,'le '+DEMANDE.quand+' · en attente');
    return true;
  };
  if(!dessiner()) return;
  // On ne relit le document que tant qu'une demande est en cours, et pas
  // au-delà d'un quart d'heure : une page laissée ouverte ne doit pas
  // interroger la base indéfiniment.
  const fin=Date.now()+15*60*1000;
  SUIVI=setInterval(async()=>{
    if(Date.now()>fin){ clearInterval(SUIVI); SUIVI=null; return; }
    if(DB){ try{
      const q=await DB.collection('demandes').get();
      q.docs.forEach(doc=>{ if(doc.id==='reconstruction') DEMANDE=doc.data()||DEMANDE; });
    }catch(e){} }
    if(!dessiner()){ clearInterval(SUIVI); SUIVI=null; }
  },4000);
}

// La reconstruction est faite quand la page a été rebâtie APRÈS la demande.
function reconstruiteDepuis(){
  if(!DEMANDE||!DEMANDE.quand) return true;
  // À l'horodatage quand les deux en portent un : une reconstruction du jour
  // même doit compter.
  if(D.genereISO && DEMANDE.quandISO) return D.genereISO>DEMANDE.quandISO;
  const n=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s||'').trim());
    return m?(+m[3]*10000+ +m[2]*100+ +m[1]):0;};
  return n(D.genere)>n(DEMANDE.quand);
}

function direRecons(){
  const e=E('depot-recons'); if(!e) return;
  const faite='Dernière reconstruction : '+(D.genere||'?')+' · arrêté au '+(D.arrete||'?')+'.';
  e.textContent=DEMANDE&&DEMANDE.quand
    ? faite+' Actualisation demandée le '+DEMANDE.quand+', en attente de reconstruction.'
    : faite;
}

async function demanderActualisation(motif,etatId,bandeId){
  const dire=t=>{ const e=E(etatId); if(e) e.textContent=t; };
  dire('');
  // ÉTAPE 1 — ce qui se calcule dans la page se recalcule maintenant.
  await refaireAffichage(bandeId);
  if(!DB||!admin){ dire('Affichage actualisé.'); return; }
  // ÉTAPE 2 — la demande, horodatée et motivée.
  poserBande(bandeId,2,0,'…');
  const v={quand:leJour(), quandISO:new Date().toISOString(), motif:motif, etat:'en attente'};
  try{
    await DB.collection('demandes').doc('reconstruction').set(v);
    DEMANDE=v; direRecons();
    poserBande(bandeId,2,1,'le '+v.quand+' · en attente');
    dire('Reconstruction demandée.');
    suivreReconstruction();
  }catch(e){
    dire('La demande n’a pas pu être enregistrée.');
  }
}

function brancherActualiser(){
  const paires=[['ech-actu','les règles d’échéance','ech-etat'],
                ['prov-actu','les règles de provision','prov-etat'],
                ['depot-actu','les fichiers déposés','depot-etat']];
  for(const [id,motif,etat] of paires){
    const b=E(id); if(!b) continue;
    if(admin) b.hidden=false;
    b.addEventListener('click',()=>demanderActualisation(motif,etat,id));
  }
  // À l'ouverture, la bande dit où en est la dernière demande, et se met à la
  // suivre si elle n'est pas encore servie.
  suivreReconstruction();
  direRecons();
}

async function ouvrirBase(){
  DISPOS=[...new Set(I.map(i=>V(i,'Type de financement'))
    .filter(c=>c&&c!=='À classer'))].sort();
  E('lot-disp').innerHTML='<option value="">Choisir…</option>'
    +DISPOS.map(d=>'<option>'+d+'</option>').join('');
  try{
    if(window.claude&&claude.use){
      DB=await claude.use('db');
      const u=await claude.use('user');
      // Deux rôles, et un seul critère : qui peut modifier l'artefact est
      // administrateur. Sa règle, le 16/10/2026 : « tout le monde ne peut pas
      // compléter la balance âgée ». Un lecteur consulte, filtre et exporte ;
      // il ne voit ni les cases à cocher, ni les boutons de modification.
      // La base refuse l'écriture de son côté : l'affichage n'est qu'une
      // politesse, la règle est côté serveur.
      if(u){
        try{ admin = !!(u.canEdit ? await u.canEdit() : (u.isOwner && await u.isOwner())); }
        catch(e){ admin=false; }
      } else { admin=false; }
      peutEcrire=admin;
    } else {
      // Le fichier autonome n'est pas publié : il n'a ni base ni identité.
      // C'est SA copie, posée sur son disque — elle y est chez elle.
      admin=true; peutEcrire=true;
    }
  }catch(e){ DB=null; }
  try{
    if(DB){
      const q=await DB.collection('complements').get();
      q.docs.forEach(doc=>{ const v=doc.data()||{};
        if(v&&v.cle&&v.dispositif) compl.set(v.cle,{...v,dispositif:dispoActuel(v.dispositif)}); });
      try{ const dq=await DB.collection('demandes').get();
        dq.docs.forEach(doc=>{ if(doc.id==='reconstruction') DEMANDE=doc.data()||null; });
      }catch(e){}
      const pq=await DB.collection('parametres').get();
      pq.docs.forEach(doc=>{ const v=doc.data()||{};
        if(doc.id==='provision'&&v.taux){ paramsPrets(); PROV={...PROV,...v}; }
        if(doc.id==='echeance'&&Array.isArray(v.regles)) ECH=v.regles; });
    } else {
      const brut=localStorage.getItem('rec_complements');
      if(brut) for(const v of JSON.parse(brut)) if(v&&v.cle)
        compl.set(v.cle,{...v,dispositif:dispoActuel(v.dispositif)});
      const pv=localStorage.getItem('rec_provision');
      if(pv){ paramsPrets(); PROV={...PROV,...JSON.parse(pv)}; }
      const ec=localStorage.getItem('rec_echeance');
      if(ec) ECH=JSON.parse(ec);
    }
  }catch(e){}
  parametres();
  brancherActualiser();
  ruban();
  if(compl.size) rafraichir();
  // Le dépôt vient après : il a besoin de savoir qui regarde (DB, admin).
  if(window.claude&&claude.use) ouvrirDepots();
}

function rafraichir(){
  ASSIETTE=null;                    // un complément peut changer la famille
  const y=E('viewport').scrollTop;
  ruban(); synthese(); appliquer(true);
  E('viewport').scrollTop=y;
  if(sel>=0) fiche(sel);
}

const cochable=i=>!!V(i,'Type de financement : à compléter') && !compl.has(cleLigne(i)) && peutEcrire;

// La barre de lot : elle dit ce qui est coché et ne s'affiche pas sans objet.
function barre(){
  const n=selection.size;
  E('lot').hidden=!n;
  if(n) E('lot-n').textContent=n.toLocaleString('fr-FR')+(n>1?' lignes sélectionnées':' ligne sélectionnée');
  E('lot-ok').disabled=!n||!E('lot-disp').value;
  const ct=E('coche-tout');
  if(ct){ const dispo=[...new Set(filtre)].filter(cochable);
    ct.hidden=!dispo.length;
    ct.checked=dispo.length>0&&dispo.every(i=>selection.has(i)); }
}

// Poser un complément sans redessiner : le lot en pose plusieurs à la suite,
// et une balance qui se recalcule entre chaque écriture clignoterait pour rien.
async function poser(v){
  compl.set(v.cle,v);
  try{
    if(DB) await DB.collection('complements').doc(idDoc(v.cle)).set(v);
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ compl.delete(v.cle); return false; }
  return true;
}

// Un dispositif, posé sur tout le lot. Plusieurs lignes peuvent appartenir à
// la même créance : on ne l'écrit qu'une fois.
async function completerLot(){
  const disp=E('lot-disp').value; if(!disp||!selection.size) return;
  const bt=E('lot-ok'), note=E('lot-note');
  bt.disabled=true;
  const parCreance=new Map();
  for(const i of selection){
    const k=cleLigne(i);
    if(!parCreance.has(k)) parCreance.set(k,{cle:k, dispositif:disp,
      compte:V(i,'N° de compte'), tiers:V(i,'Tiers'), facture:V(i,'N° de facture')||'',
      manquait:V(i,'Type de financement : à compléter'), quand:leJour()});
  }
  let faits=0, refus=0, n=0;
  for(const v of parCreance.values()){
    note.textContent='enregistrement '+(++n)+' / '+parCreance.size+'…';
    if(await poser(v)) faits++; else refus++;
  }
  selection.clear();
  note.textContent=faits.toLocaleString('fr-FR')+(faits>1?' créances complétées':' créance complétée')
    +' en « '+disp+' »'+(refus?' · '+refus+' refusée'+(refus>1?'s':''):'');
  rafraichir(); barre();
  bt.disabled=false;
}

async function enregistrer(v){
  compl.set(v.cle,v);
  let ok=true;
  try{
    if(DB) await DB.collection('complements').doc(idDoc(v.cle)).set(v);
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ ok=false; compl.delete(v.cle); }
  rafraichir();
  return ok;
}

async function effacer(cle){
  const v=compl.get(cle); if(!v) return;
  compl.delete(cle);
  try{
    if(DB) await DB.collection('complements').doc(idDoc(cle)).delete();
    else localStorage.setItem('rec_complements',JSON.stringify([...compl.values()]));
  }catch(e){ compl.set(cle,v); }
  rafraichir();
}

// L'index des rapprochements : chaque numéro, ses lignes au débit — la ou les
// factures proposées — et sa ligne au crédit, le règlement.
let rapIdx=null;
function indexRappro(){
  if(rapIdx) return rapIdx;
  rapIdx=new Map();
  for(const i of I){
    const s=V(i,'N° de rapprochement'); if(!s) continue;
    const ou=N(i,'Débit')>0.009?'deb':'cre';
    for(const n of s.split('·')){ const k=n.trim(); if(!k) continue;
      let e=rapIdx.get(k); if(!e){ e={deb:[],cre:[]}; rapIdx.set(k,e); }
      e[ou].push(i); }
  }
  return rapIdx;
}

function fiche(i){
  const g=n=>V(i,n), k=cleLigne(i), c=compl.get(k), ac=g('Type de financement : à compléter')&&!c;
  const cal=g('Détail du calcul'), m=metaCreance.get(g('Clé de la créance'));
  // « Je veux une séparation nette entre 2 propositions de rapprochement »,
  // 22/10/2026. Une par ligne ne suffisait pas : deux lignes qui se touchent
  // se lisent comme une phrase qui revient à la ligne. Chacune prend donc son
  // bloc, adossé à un trait.
  const enLignes=t=>{
    const bouts=esc(t).split('\n').map(x=>x.replace(/^•\s*/,'').trim()).filter(Boolean);
    return bouts.length<2 ? bouts.join('')
      : '<ul class="props">'+bouts.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  };
  let h='<div class="fiche-tete"><span class="ref">'+(g('N° de facture')||'écriture sans numéro')+'</span>'
    +'<span>'+g('Tiers')+'</span>'
    +'<span class="puce'+(ac?' sig':' ok')+'">'
    +(c?'complété':(ac||'justifiée'))+'</span></div>';
  // Ce qu'il manque se complète ici même : le dispositif choisi déplace
  // aussitôt le reste dû de la créance dans la balance, et il est gardé.
  if(ac||c){
    h+='<div class="compl'+(c?' fait':'')+'">';
    if(c){
      h+='<span class="etat"><strong>'+c.dispositif+'</strong> — complété le '+c.quand
        +(m&&m.rd?' · '+eur(m.rd)+' déplacés de « '+(m.sc||'À classer')+' » vers « '+c.dispositif+' »':'')
        +'</span><button type="button" class="plat" id="c-annul">Revenir en arrière</button>';
    } else if(peutEcrire){
      h+='<label for="c-disp">Dispositif</label>'
        +'<select id="c-disp"><option value="">Choisir…</option>'
        +DISPOS.map(d=>'<option>'+d+'</option>').join('')+'</select>'
        +'<button type="button" id="c-ok" disabled>Enregistrer</button>'
        +'<span class="etat" id="c-note">'
        +(m&&m.rd?eur(m.rd)+' quitteront « '+(m.sc||'À classer')+' »'
                :'cette écriture ne pèse rien dans la balance : seul son classement change')
        +'</span>';
    } else {
      h+='<span class="etat">Lecture seule : les compléments ne peuvent pas être enregistrés depuis cette vue.</span>';
    }
    h+='</div>';
  }
  if(cal) h+='<p class="calcul">'+cal
    +(g('Règle de datation appliquée')?'<br><span style="color:var(--encre-2)">motif : '+g('Règle de datation appliquée')+'</span>':'')
    +'</p>';
  h+='<div class="champs">';
  for(const nom of D.cols){
    const v=g(nom); if(!v) continue;
    // Tout ce qui parle de rapprochement se lit une proposition par ligne :
    // la facture, sa fiabilité et sa raison, des deux côtés du couple.
    h+='<div class="champ"><dt>'+nom+'</dt><dd>'
      +(/rapprochement$/.test(nom)?enLignes(v):v)+'</dd></div>';
  }
  E('fiche').innerHTML=h+'</div>';
  const sl=E('c-disp'), bt=E('c-ok');
  if(sl&&bt){
    sl.addEventListener('change',()=>{ bt.disabled=!sl.value; });
    bt.addEventListener('click',async()=>{
      if(!sl.value) return; bt.disabled=true;
      const ok=await enregistrer({cle:k, dispositif:sl.value, compte:g('N° de compte'),
        tiers:g('Tiers'), facture:g('N° de facture')||'', manquait:g('Type de financement : à compléter'),
        quand:leJour()});
      if(!ok){ const n=E('c-note');
        if(n) n.textContent='Enregistrement refusé — rien n’a été gardé.';
        bt.disabled=false; }
    });
  }
  const an=E('c-annul'); if(an) an.addEventListener('click',()=>effacer(k));
  E('fiche').scrollIntoView({behavior:'smooth',block:'nearest'});
}
